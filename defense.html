<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baseball Defense & Pitching</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Arial Black', Arial, sans-serif; }
  #gameCanvas { display: block; width: 100vw; height: 100vh; }
  #webcamContainer {
    position: fixed; bottom: 16px; right: 16px;
    width: 180px; height: 135px;
    border: 3px solid #00ffff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 20px #00ffff88;
    z-index: 100;
  }
  #webcam { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
  #poseCanvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    transform: scaleX(-1);
  }
  #ui {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px 24px; pointer-events: none; z-index: 50;
  }
  #scoreBoard {
    background: rgba(0,0,0,0.7);
    border: 2px solid #ffdd00;
    border-radius: 12px;
    padding: 10px 20px;
    color: #ffdd00;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px #ffdd00;
    box-shadow: 0 0 20px #ffdd0044;
  }
  #scoreBoard span { margin: 0 8px; }
  #actionLabel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 38px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff, 0 0 90px #00ffff;
    text-align: center;
    pointer-events: none;
    z-index: 200;
    display: none;
    animation: pulse 1s ease-in-out infinite;
    letter-spacing: 2px;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 0.7; transform: translate(-50%,-50%) scale(1.05); }
  }
  #pauseBtn {
    position: fixed; top: 16px; right: 220px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #888;
    border-radius: 8px;
    color: #ccc;
    font-size: 14px;
    padding: 8px 14px;
    cursor: pointer;
    z-index: 200;
    transition: all 0.2s;
  }
  #pauseBtn:hover { border-color: #fff; color: #fff; }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 300;
    text-align: center;
  }
  #overlay h1 {
    font-size: 72px;
    font-weight: 900;
    color: #ffdd00;
    text-shadow: 0 0 40px #ffdd00, 0 0 80px #ff8800;
    margin-bottom: 16px;
    letter-spacing: 4px;
  }
  #overlay .subtitle {
    font-size: 24px;
    color: #00ffff;
    text-shadow: 0 0 20px #00ffff;
    margin-bottom: 40px;
    max-width: 600px;
    line-height: 1.5;
  }
  #overlay .instructions {
    font-size: 18px;
    color: #aaa;
    margin-bottom: 50px;
    line-height: 1.8;
  }
  #overlay .instructions strong { color: #ffdd00; }
  #startBtn {
    font-size: 28px;
    font-weight: 900;
    color: #000;
    background: linear-gradient(135deg, #ffdd00, #ff8800);
    border: none;
    border-radius: 50px;
    padding: 18px 60px;
    cursor: pointer;
    box-shadow: 0 0 40px #ffdd0088;
    transition: all 0.2s;
    letter-spacing: 2px;
  }
  #startBtn:hover { transform: scale(1.05); box-shadow: 0 0 60px #ffdd00aa; }
  #gameOverTitle {
    font-size: 80px;
    font-weight: 900;
    color: #ff4444;
    text-shadow: 0 0 40px #ff4444;
    margin-bottom: 20px;
  }
  #resultStats {
    font-size: 26px;
    color: #ffdd00;
    text-shadow: 0 0 15px #ffdd00;
    margin-bottom: 40px;
    line-height: 2;
  }
  #repCounter {
    position: fixed; bottom: 20px; left: 20px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #00ff88;
    border-radius: 10px;
    padding: 10px 18px;
    color: #00ff88;
    font-size: 16px;
    font-weight: bold;
    z-index: 100;
    text-shadow: 0 0 10px #00ff88;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="webcamContainer">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="poseCanvas"></canvas>
</div>

<div id="ui">
  <div id="scoreBoard">
    <span>INNING: <span id="inningNum">1</span></span>
    <span>OUTS: <span id="outsNum">0</span></span>
    <span>STRIKES: <span id="strikesNum">0</span></span>
    <span>RUNS: <span id="runsNum">0</span></span>
  </div>
</div>

<div id="actionLabel"></div>
<div id="repCounter">CRUNCHES: 0 | PUSH-UPS: 0</div>
<button id="pauseBtn">PAUSE (ESC)</button>

<div id="overlay">
  <h1>⚾ DEFENSE!</h1>
  <div class="subtitle">Pitch. Field. Dominate.<br>Use your BODY to control the game!</div>
  <div class="instructions">
    <strong>AB CRUNCH</strong> → Pitch the ball / Make a diving catch<br>
    <strong>PUSH-UP</strong> → Swing the bat (opponent batting)<br>
    <strong>SPACEBAR</strong> → Fallback for both actions<br>
    <strong>ESC</strong> → Pause game
  </div>
  <button id="startBtn" onclick="startGame()">PLAY BALL!</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
// ============================================================
// GLOBALS
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const webcam = document.getElementById('webcam');
const poseCanvas = document.getElementById('poseCanvas');
const poseCtx = poseCanvas.getContext('2d');
const actionLabel = document.getElementById('actionLabel');
const overlay = document.getElementById('overlay');
const repCounterEl = document.getElementById('repCounter');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// GAME STATE
// ============================================================
const state = {
  phase: 'start',       // start | pitching | fielding | batting | gameover | paused | result
  inning: 1,
  outs: 0,
  strikes: 0,
  runs: 0,
  totalCrunches: 0,
  totalPushups: 0,
  paused: false,
  prevPhase: null,
};

// ============================================================
// POSE DETECTION
// ============================================================
let landmarks = null;
let poseReady = false;

// Ab crunch detection
let nosePosHistory = [];
let crunchDown = false;
let crunchCooldown = 0;

// Push-up detection
let shoulderPosHistory = [];
let pushupDown = false;
let pushupCooldown = 0;

const CRUNCH_THRESHOLD = 0.06;
const PUSHUP_THRESHOLD = 0.04;

function detectCrunch() {
  if (!landmarks || crunchCooldown > 0) return false;
  const nose = landmarks[0];
  if (!nose) return false;
  nosePosHistory.push(nose.y);
  if (nosePosHistory.length > 8) nosePosHistory.shift();
  if (nosePosHistory.length < 4) return false;
  const recent = nosePosHistory[nosePosHistory.length - 1];
  const baseline = nosePosHistory[0];
  const dropped = recent - baseline > CRUNCH_THRESHOLD;
  if (dropped && !crunchDown) { crunchDown = true; }
  if (crunchDown && !dropped && recent < baseline) {
    crunchDown = false;
    crunchCooldown = 40;
    state.totalCrunches++;
    return true;
  }
  return false;
}

function detectPushup() {
  if (!landmarks || pushupCooldown > 0) return false;
  const ls = landmarks[11], rs = landmarks[12];
  if (!ls || !rs) return false;
  const shoulderY = (ls.y + rs.y) / 2;
  shoulderPosHistory.push(shoulderY);
  if (shoulderPosHistory.length > 8) shoulderPosHistory.shift();
  if (shoulderPosHistory.length < 4) return false;
  const recent = shoulderPosHistory[shoulderPosHistory.length - 1];
  const baseline = shoulderPosHistory[0];
  const dropped = recent - baseline > PUSHUP_THRESHOLD;
  if (dropped && !pushupDown) { pushupDown = true; }
  if (pushupDown && !dropped && recent < baseline) {
    pushupDown = false;
    pushupCooldown = 40;
    state.totalPushups++;
    return true;
  }
  return false;
}

function initPose() {
  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });
  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5,
  });
  pose.onResults((results) => {
    landmarks = results.poseLandmarks || null;
    poseReady = true;
    drawPoseSkeleton(results);
  });

  navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: 'user' } })
    .then((stream) => {
      webcam.srcObject = stream;
      const camera = new Camera(webcam, {
        onFrame: async () => { await pose.send({ image: webcam }); },
        width: 320, height: 240,
      });
      camera.start();
    })
    .catch((e) => { console.warn('Webcam not available:', e); });
}

function drawPoseSkeleton(results) {
  poseCtx.clearRect(0, 0, poseCanvas.width, poseCanvas.height);
  if (!results.poseLandmarks) return;
  const lms = results.poseLandmarks;
  const w = poseCanvas.width, h = poseCanvas.height;
  const connections = [
    [11,12],[11,13],[13,15],[12,14],[14,16],
    [11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],
    [0,11],[0,12]
  ];
  poseCtx.strokeStyle = '#00ffff';
  poseCtx.lineWidth = 2;
  for (const [a, b] of connections) {
    if (lms[a] && lms[b] && lms[a].visibility > 0.3 && lms[b].visibility > 0.3) {
      poseCtx.beginPath();
      poseCtx.moveTo(lms[a].x * w, lms[a].y * h);
      poseCtx.lineTo(lms[b].x * w, lms[b].y * h);
      poseCtx.stroke();
    }
  }
  for (const lm of lms) {
    if (lm.visibility > 0.3) {
      poseCtx.beginPath();
      poseCtx.arc(lm.x * w, lm.y * h, 3, 0, Math.PI * 2);
      poseCtx.fillStyle = '#ff00ff';
      poseCtx.fill();
    }
  }
}

// ============================================================
// PARTICLES
// ============================================================
let particles = [];
function spawnParticles(x, y, color, count = 30) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 8;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.02 + Math.random() * 0.04,
      size: 3 + Math.random() * 6,
      color,
    });
  }
}
function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= p.decay;
    p.size *= 0.97;
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ============================================================
// BALL TRAIL
// ============================================================
let ballTrail = [];
function addBallTrail(x, y) {
  ballTrail.push({ x, y, life: 1 });
  if (ballTrail.length > 20) ballTrail.shift();
}
function drawBallTrail() {
  for (let i = 0; i < ballTrail.length; i++) {
    const t = ballTrail[i];
    const alpha = (i / ballTrail.length) * 0.6 * t.life;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffdd00';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#ff8800';
    ctx.beginPath();
    ctx.arc(t.x, t.y, 4 * (i / ballTrail.length), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ============================================================
// DRAW: NIGHT STADIUM BACKGROUND
// ============================================================
let starField = [];
for (let i = 0; i < 200; i++) {
  starField.push({ x: Math.random(), y: Math.random() * 0.5, r: Math.random() * 1.5, b: Math.random() });
}

function drawStadiumNight() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  sky.addColorStop(0, '#040818');
  sky.addColorStop(1, '#0a1a2e');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (const s of starField) {
    ctx.save();
    ctx.globalAlpha = 0.4 + 0.6 * s.b;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Stadium lights (top arcs)
  const lightPositions = [0.05, 0.2, 0.5, 0.8, 0.95];
  for (const lp of lightPositions) {
    const lx = lp * W;
    const ly = H * 0.05;
    // Light pole
    ctx.save();
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(lx, ly + 60);
    ctx.stroke();
    // Light cone
    ctx.globalAlpha = 0.04;
    const cone = ctx.createRadialGradient(lx, ly, 0, lx, ly, 300);
    cone.addColorStop(0, '#ffffff');
    cone.addColorStop(1, 'transparent');
    ctx.fillStyle = cone;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(lx - 150, ly + 300);
    ctx.lineTo(lx + 150, ly + 300);
    ctx.closePath();
    ctx.fill();
    // Light head glow
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#ffffaa';
    ctx.fillStyle = '#ffffaa';
    ctx.beginPath();
    ctx.arc(lx, ly, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Crowd (dots in upper area)
  ctx.save();
  for (let i = 0; i < 300; i++) {
    const cx = (i * 137.5) % W;
    const cy = H * 0.12 + (i % 7) * 10;
    const colors = ['#ff6666','#6699ff','#ffff66','#ff99cc','#99ff99','#ffcc99'];
    ctx.fillStyle = colors[i % colors.length];
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Stadium walls arc
  ctx.save();
  ctx.strokeStyle = '#334';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(W / 2, H * 0.2, W * 0.52, 0, Math.PI);
  ctx.stroke();
  ctx.restore();
}

// ============================================================
// DRAW: PITCHING VIEW (from mound looking toward home plate)
// ============================================================
let pitchPhase = {
  timer: 0,
  ballX: 0, ballY: 0,
  ballVX: 0, ballVY: 0,
  ballSize: 14,
  ballActive: false,
  outcome: null,  // 'strike' | 'hit' | 'foul'
  resultTimer: 0,
  batterAnim: 0,
  batterSwing: false,
  swingAngle: 0,
  diveAnim: 0,
  ready: true,
};

function resetPitchPhase() {
  pitchPhase.timer = 0;
  pitchPhase.ballActive = false;
  pitchPhase.outcome = null;
  pitchPhase.resultTimer = 0;
  pitchPhase.batterSwing = false;
  pitchPhase.swingAngle = 0;
  pitchPhase.ready = true;
  ballTrail = [];
}

function throwPitch() {
  if (!pitchPhase.ready || pitchPhase.ballActive) return;
  pitchPhase.ready = false;
  pitchPhase.ballActive = true;
  // Start from pitcher's hand (center of screen, below midpoint)
  pitchPhase.ballX = W / 2 + (Math.random() - 0.5) * 30;
  pitchPhase.ballY = H * 0.58;
  pitchPhase.ballSize = 14;
  // Ball goes "away" = shrinks and moves toward vanishing point (home plate area)
  const outcomes = ['strike', 'strike', 'strike', 'hit', 'foul'];
  pitchPhase.outcome = outcomes[Math.floor(Math.random() * outcomes.length)];
  ballTrail = [];
}

function drawPitchingView(dt) {
  drawStadiumNight();

  // Pitcher's mound view — draw field in perspective looking toward home plate
  // Ground (infield dirt)
  const fieldGrad = ctx.createLinearGradient(0, H * 0.5, 0, H);
  fieldGrad.addColorStop(0, '#1a4a0e');
  fieldGrad.addColorStop(0.3, '#2d6b1a');
  fieldGrad.addColorStop(1, '#1a4a0e');
  ctx.fillStyle = fieldGrad;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.5);
  ctx.lineTo(W, H * 0.5);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  // Infield dirt oval (pitcher's view)
  ctx.save();
  ctx.fillStyle = '#8B5E3C';
  ctx.beginPath();
  ctx.ellipse(W / 2, H * 0.62, W * 0.42, H * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Baseline lines in perspective
  const vp = { x: W / 2, y: H * 0.48 }; // vanishing point = home plate area
  ctx.save();
  ctx.strokeStyle = '#ffffff88';
  ctx.lineWidth = 2;
  // Left baseline
  ctx.beginPath();
  ctx.moveTo(W * 0.1, H);
  ctx.lineTo(vp.x - 30, vp.y + 30);
  ctx.stroke();
  // Right baseline
  ctx.beginPath();
  ctx.moveTo(W * 0.9, H);
  ctx.lineTo(vp.x + 30, vp.y + 30);
  ctx.stroke();
  ctx.restore();

  // Home plate (small, far away)
  const hpX = W / 2, hpY = H * 0.52;
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#ffffff';
  ctx.fillRect(hpX - 8, hpY - 4, 16, 8);
  ctx.restore();

  // Pitcher's rubber (close, big)
  ctx.save();
  ctx.fillStyle = '#ffffffcc';
  ctx.fillRect(W / 2 - 30, H * 0.62, 60, 8);
  ctx.restore();

  // BATTER at home plate
  drawBatter(hpX, hpY);

  // Strike zone behind batter
  ctx.save();
  ctx.strokeStyle = '#ffdd0066';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([3, 3]);
  ctx.strokeRect(hpX - 12, hpY - 22, 24, 30);
  ctx.setLineDash([]);
  ctx.restore();

  // Outfield wall in background
  ctx.save();
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, H * 0.3, W, H * 0.2);
  // Outfield wall
  ctx.fillStyle = '#223';
  ctx.fillRect(W * 0.05, H * 0.38, W * 0.9, H * 0.1);
  // Home run signs on outfield wall
  const wallY = H * 0.38;
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#ffdd00';
  ctx.textAlign = 'center';
  ctx.fillText('400 FT', W / 2, wallY + 20);
  ctx.fillText('330 FT', W * 0.15, wallY + 20);
  ctx.fillText('330 FT', W * 0.85, wallY + 20);
  ctx.restore();

  // Ball
  if (pitchPhase.ballActive) {
    pitchPhase.timer++;
    // Move ball toward vanishing point (it "travels away" = shrinks + moves to vp)
    const speed = 6;
    const dx = vp.x - pitchPhase.ballX;
    const dy = (vp.y + 30) - pitchPhase.ballY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 5) {
      pitchPhase.ballX += (dx / dist) * speed;
      pitchPhase.ballY += (dy / dist) * speed * 0.7;
      pitchPhase.ballSize = Math.max(3, 14 - pitchPhase.timer * 0.35);
    } else {
      // Ball arrived at plate
      pitchPhase.ballActive = false;
      pitchPhase.resultTimer = 90;
      if (pitchPhase.outcome === 'strike') {
        state.strikes++;
        if (state.strikes >= 3) {
          state.strikes = 0;
          state.outs++;
          spawnParticles(hpX, hpY, '#ff4444', 25);
        }
        spawnParticles(hpX, hpY, '#00ff88', 15);
      } else if (pitchPhase.outcome === 'foul') {
        spawnParticles(hpX, hpY, '#ffaa00', 20);
      } else {
        // Hit — transition to fielding
        pitchPhase.batterSwing = true;
        spawnParticles(hpX, hpY, '#ffdd00', 40);
      }
      updateScoreUI();
    }
    addBallTrail(pitchPhase.ballX, pitchPhase.ballY);
    drawBallTrail();
    // Draw ball
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ffdd00';
    ctx.beginPath();
    ctx.arc(pitchPhase.ballX, pitchPhase.ballY, pitchPhase.ballSize, 0, Math.PI * 2);
    ctx.fill();
    // Ball seam
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(pitchPhase.ballX, pitchPhase.ballY, pitchPhase.ballSize, -0.5, 0.5);
    ctx.stroke();
    ctx.restore();
  }

  // Result text
  if (pitchPhase.resultTimer > 0) {
    pitchPhase.resultTimer--;
    const alpha = Math.min(1, pitchPhase.resultTimer / 20);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 80px Arial Black';
    ctx.textAlign = 'center';
    let txt = '', color = '#fff';
    if (pitchPhase.outcome === 'strike') { txt = state.outs >= 3 ? 'OUT!' : 'STRIKE!'; color = '#ff4444'; }
    else if (pitchPhase.outcome === 'foul') { txt = 'FOUL BALL!'; color = '#ffaa00'; }
    else { txt = 'HIT!'; color = '#ffdd00'; }
    ctx.fillStyle = color;
    ctx.shadowBlur = 40;
    ctx.shadowColor = color;
    ctx.fillText(txt, W / 2, H * 0.35);
    ctx.restore();

    if (pitchPhase.resultTimer === 0) {
      if (state.outs >= 3) {
        // Inning won
        setTimeout(() => startBattingPhase(), 500);
      } else if (pitchPhase.outcome === 'hit') {
        setTimeout(() => startFieldingPhase(), 400);
      } else {
        resetPitchPhase();
      }
    }
  }

  // Action label
  if (pitchPhase.ready) {
    showActionLabel('DO A CRUNCH TO PITCH! ⚡');
  }

  updateParticles();
  drawParticles();
}

function drawBatter(x, y) {
  ctx.save();
  const scale = 0.45;
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  // Body
  ctx.fillStyle = '#3355ff';
  ctx.fillRect(-8, -30, 16, 30);
  // Head
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath();
  ctx.arc(0, -38, 10, 0, Math.PI * 2);
  ctx.fill();
  // Helmet
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(0, -40, 11, Math.PI, Math.PI * 2);
  ctx.fill();
  // Bat
  if (pitchPhase.batterSwing) {
    pitchPhase.swingAngle = Math.min(pitchPhase.swingAngle + 0.25, Math.PI * 0.7);
  }
  ctx.save();
  ctx.rotate(pitchPhase.swingAngle - 0.3);
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(8, -20, 6, 35);
  ctx.restore();
  ctx.restore();
}

// ============================================================
// DRAW: FIELDING VIEW
// ============================================================
let fieldPhase = {
  timer: 0,
  ballX: 0, ballY: 0,
  ballVX: 0, ballVY: 0,
  ballT: 0,
  startX: 0, startY: 0,
  targetX: 0, targetY: 0,
  targetZone: 'center', // left | center | right
  ballLanded: false,
  caught: false,
  missed: false,
  catchWindow: 80,  // frames to catch
  catchTimer: 0,
  resultTimer: 0,
  diveAnim: 0,
  diving: false,
};

function startFieldingPhase() {
  state.phase = 'fielding';
  ballTrail = [];
  particles = [];
  const zones = ['left', 'center', 'right'];
  fieldPhase.targetZone = zones[Math.floor(Math.random() * zones.length)];
  const zoneX = fieldPhase.targetZone === 'left' ? W * 0.2 :
                 fieldPhase.targetZone === 'right' ? W * 0.8 : W * 0.5;
  fieldPhase.targetX = zoneX + (Math.random() - 0.5) * 60;
  fieldPhase.targetY = H * 0.52 + (Math.random() - 0.5) * 30;
  fieldPhase.timer = 0;
  fieldPhase.ballT = 0;
  fieldPhase.startX = W * 0.5;
  fieldPhase.startY = H * 0.85;
  fieldPhase.ballLanded = false;
  fieldPhase.caught = false;
  fieldPhase.missed = false;
  fieldPhase.catchTimer = 0;
  fieldPhase.resultTimer = 0;
  fieldPhase.diveAnim = 0;
  fieldPhase.diving = false;
  showActionLabel('DO A CRUNCH TO CATCH! 🤿');
}

function attemptCatch() {
  if (fieldPhase.ballLanded || fieldPhase.caught || fieldPhase.missed || fieldPhase.diving) return;
  fieldPhase.diving = true;
  fieldPhase.diveAnim = 0;
  // Check if timing is in catch window (ball near target)
  const progress = fieldPhase.ballT;
  if (progress > 0.65 && progress < 1.0) {
    fieldPhase.caught = true;
    state.outs++;
    spawnParticles(fieldPhase.targetX, fieldPhase.targetY, '#00ffff', 60);
    spawnParticles(fieldPhase.targetX, fieldPhase.targetY, '#ffdd00', 40);
    updateScoreUI();
  }
  fieldPhase.resultTimer = 100;
}

function drawFieldingView(dt) {
  drawStadiumNight();

  // Wide outfield view — grass, infield far away
  // Ground
  const fg = ctx.createLinearGradient(0, H * 0.45, 0, H);
  fg.addColorStop(0, '#1a4a0e');
  fg.addColorStop(1, '#0d2a08');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.45);
  ctx.lineTo(W, H * 0.45);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.fill();

  // Grass stripes
  ctx.save();
  ctx.globalAlpha = 0.1;
  for (let i = 0; i < 10; i++) {
    if (i % 2 === 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, H * 0.45 + i * (H * 0.055), W, H * 0.055);
    }
  }
  ctx.restore();

  // Infield in the distance
  ctx.save();
  ctx.fillStyle = '#8B5E3C';
  ctx.beginPath();
  ctx.ellipse(W / 2, H * 0.48, W * 0.35, H * 0.06, 0, 0, Math.PI * 2);
  ctx.fill();
  // Diamond
  ctx.fillStyle = '#ffffff88';
  ctx.beginPath();
  ctx.moveTo(W/2, H * 0.43);
  ctx.lineTo(W*0.58, H * 0.47);
  ctx.lineTo(W/2, H * 0.51);
  ctx.lineTo(W*0.42, H * 0.47);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Warning track
  ctx.save();
  ctx.strokeStyle = '#8B6914';
  ctx.lineWidth = 20;
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.arc(W / 2, H * 0.75, W * 0.7, Math.PI * 1.1, Math.PI * 1.9);
  ctx.stroke();
  ctx.restore();

  // Outfield wall
  ctx.save();
  ctx.strokeStyle = '#446';
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.arc(W / 2, H * 0.75, W * 0.73, Math.PI * 1.08, Math.PI * 1.92);
  ctx.stroke();
  ctx.restore();

  // Landing zone indicator
  if (!fieldPhase.caught && !fieldPhase.missed) {
    const pulse = 0.5 + 0.5 * Math.sin(fieldPhase.timer * 0.15);
    ctx.save();
    ctx.globalAlpha = 0.3 + pulse * 0.4;
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 3;
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ff4444';
    ctx.beginPath();
    ctx.arc(fieldPhase.targetX, fieldPhase.targetY, 40, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(fieldPhase.targetX, fieldPhase.targetY, 20, 0, Math.PI * 2);
    ctx.stroke();
    // crosshair
    ctx.beginPath();
    ctx.moveTo(fieldPhase.targetX - 45, fieldPhase.targetY);
    ctx.lineTo(fieldPhase.targetX + 45, fieldPhase.targetY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(fieldPhase.targetX, fieldPhase.targetY - 45);
    ctx.lineTo(fieldPhase.targetX, fieldPhase.targetY + 45);
    ctx.stroke();
    ctx.restore();
  }

  // Update ball arc
  if (!fieldPhase.ballLanded && !fieldPhase.caught) {
    fieldPhase.timer++;
    fieldPhase.ballT = Math.min(1, fieldPhase.timer / 120);
    // Parabolic arc
    const t = fieldPhase.ballT;
    const bx = fieldPhase.startX + (fieldPhase.targetX - fieldPhase.startX) * t;
    const arcH = H * 0.4;
    const by = fieldPhase.startY + (fieldPhase.targetY - fieldPhase.startY) * t - arcH * 4 * t * (1 - t);
    fieldPhase.ballX = bx;
    fieldPhase.ballY = by;
    addBallTrail(bx, by);

    if (fieldPhase.ballT >= 1 && !fieldPhase.caught) {
      fieldPhase.ballLanded = true;
      fieldPhase.missed = true;
      fieldPhase.resultTimer = 90;
      state.runs++;
      spawnParticles(fieldPhase.targetX, fieldPhase.targetY, '#ffaa00', 20);
      updateScoreUI();
    }
  }

  drawBallTrail();

  if (!fieldPhase.caught || fieldPhase.diveAnim < 30) {
    // Draw ball
    const bsize = 8 + (1 - fieldPhase.ballT) * 6;
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ffdd00';
    ctx.beginPath();
    ctx.arc(fieldPhase.ballX, fieldPhase.ballY, bsize, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(fieldPhase.ballX, fieldPhase.ballY, bsize, -0.5, 0.5);
    ctx.stroke();
    ctx.restore();
  }

  // Fielder figure
  drawFielder(fieldPhase.targetX, H * 0.68, fieldPhase.diving, fieldPhase.diveAnim, fieldPhase.caught);
  if (fieldPhase.diving) {
    fieldPhase.diveAnim = Math.min(fieldPhase.diveAnim + 2, 40);
  }

  // Catch timer bar
  if (!fieldPhase.caught && !fieldPhase.missed && !fieldPhase.ballLanded) {
    const barW = W * 0.4;
    const barX = W / 2 - barW / 2;
    const barY = H - 60;
    const progress = fieldPhase.ballT;
    ctx.save();
    ctx.fillStyle = '#111';
    ctx.fillRect(barX, barY, barW, 16);
    const color = progress > 0.65 ? '#00ff88' : '#ffdd00';
    ctx.fillStyle = color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = color;
    ctx.fillRect(barX, barY, barW * progress, 16);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, 16);
    // Catch window indicator
    ctx.fillStyle = '#00ff88';
    ctx.globalAlpha = 0.4;
    ctx.fillRect(barX + barW * 0.65, barY, barW * 0.35, 16);
    ctx.restore();

    ctx.save();
    ctx.font = 'bold 14px Arial';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('CATCH WINDOW →', W / 2, barY - 6);
    ctx.restore();
  }

  // Result
  if (fieldPhase.resultTimer > 0) {
    fieldPhase.resultTimer--;
    const alpha = Math.min(1, fieldPhase.resultTimer / 20);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 70px Arial Black';
    ctx.textAlign = 'center';
    let txt = fieldPhase.caught ? 'DIVING CATCH!' : 'HIT SCORES!';
    let color = fieldPhase.caught ? '#00ffff' : '#ff4444';
    ctx.fillStyle = color;
    ctx.shadowBlur = 40;
    ctx.shadowColor = color;
    ctx.fillText(txt, W / 2, H * 0.35);
    ctx.restore();

    if (fieldPhase.resultTimer === 0) {
      if (state.outs >= 3) {
        setTimeout(() => startBattingPhase(), 400);
      } else {
        setTimeout(() => { state.phase = 'pitching'; resetPitchPhase(); }, 400);
      }
    }
  }

  updateParticles();
  drawParticles();
}

function drawFielder(x, y, diving, diveAnim, caught) {
  ctx.save();
  ctx.translate(x, y);
  if (diving) {
    const diveRot = Math.min(diveAnim / 20, 1) * -0.7;
    ctx.rotate(diveRot);
    const diveX = Math.min(diveAnim * 3, 80);
    ctx.translate(diveX, 0);
  }
  ctx.scale(0.7, 0.7);
  // Legs
  ctx.fillStyle = '#3355ff';
  ctx.fillRect(-5, 0, 10, 25);
  // Body
  ctx.fillStyle = '#1144cc';
  ctx.fillRect(-10, -25, 20, 28);
  // Head
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath();
  ctx.arc(0, -33, 10, 0, Math.PI * 2);
  ctx.fill();
  // Helmet
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(0, -35, 11, Math.PI, Math.PI * 2);
  ctx.fill();
  // Glove (catching position)
  ctx.fillStyle = '#8B4513';
  if (diving && caught) {
    ctx.beginPath();
    ctx.arc(20, -15, 12, 0, Math.PI * 2);
    ctx.fill();
    // Ball in glove
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(20, -15, 6, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(15, -20, 10, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ============================================================
// DRAW: BATTING VIEW (Opponent bats, you swing)
// ============================================================
let batPhase = {
  timer: 0,
  pitchT: 0,
  pitchActive: false,
  pitchX: 0, pitchY: 0,
  swingActive: false,
  swingAngle: 0,
  outcome: null,
  resultTimer: 0,
  pitchCount: 0,
  maxPitches: 5,
  ready: true,
};

function startBattingPhase() {
  state.phase = 'batting';
  ballTrail = [];
  particles = [];
  batPhase.timer = 0;
  batPhase.pitchActive = false;
  batPhase.swingActive = false;
  batPhase.swingAngle = 0;
  batPhase.outcome = null;
  batPhase.resultTimer = 0;
  batPhase.pitchCount = 0;
  batPhase.ready = true;
  setTimeout(() => throwOpponentPitch(), 1000);
}

function throwOpponentPitch() {
  if (batPhase.pitchActive) return;
  batPhase.pitchActive = true;
  batPhase.pitchX = W / 2 + (Math.random() - 0.5) * 80;
  batPhase.pitchY = H * 0.15;
  batPhase.pitchT = 0;
  ballTrail = [];
}

function swing() {
  if (!batPhase.pitchActive || batPhase.swingActive || batPhase.outcome) return;
  batPhase.swingActive = true;
  batPhase.swingAngle = 0;
  batPhase.pitchCount++;
  // Determine hit vs strike based on timing
  const progress = batPhase.pitchT;
  let outcomes, color;
  if (progress > 0.55 && progress < 0.85) {
    const r = Math.random();
    if (r < 0.5) batPhase.outcome = 'hit';
    else if (r < 0.75) batPhase.outcome = 'homerun';
    else batPhase.outcome = 'out';
  } else {
    batPhase.outcome = 'miss';
  }
  batPhase.resultTimer = 100;
  batPhase.pitchActive = false;
  if (batPhase.outcome === 'hit' || batPhase.outcome === 'homerun') {
    const hitX = W * 0.45, hitY = H * 0.55;
    spawnParticles(hitX, hitY, '#ffdd00', 50);
    if (batPhase.outcome === 'homerun') spawnParticles(hitX, hitY, '#ff4444', 80);
  }
}

function drawBattingView(dt) {
  drawStadiumNight();

  // Batter's view — looking toward pitcher
  const groundG = ctx.createLinearGradient(0, H * 0.5, 0, H);
  groundG.addColorStop(0, '#1a4a0e');
  groundG.addColorStop(1, '#0d2a08');
  ctx.fillStyle = groundG;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.5);
  ctx.lineTo(W, H * 0.5);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.fill();

  // Infield dirt
  ctx.save();
  ctx.fillStyle = '#8B5E3C';
  ctx.beginPath();
  ctx.ellipse(W / 2, H * 0.62, W * 0.42, H * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Pitcher's mound (far)
  ctx.save();
  ctx.fillStyle = '#a0724a';
  ctx.beginPath();
  ctx.ellipse(W / 2, H * 0.56, 35, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Pitcher figure
  drawPitcher(W / 2, H * 0.54, dt);

  // Baselines
  ctx.save();
  ctx.strokeStyle = '#ffffff44';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W * 0.05, H * 0.9);
  ctx.lineTo(W / 2, H * 0.54);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W * 0.95, H * 0.9);
  ctx.lineTo(W / 2, H * 0.54);
  ctx.stroke();
  ctx.restore();

  // Home plate (close, bottom)
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#fff';
  ctx.fillRect(W / 2 - 15, H * 0.88, 30, 12);
  ctx.restore();

  // Strike zone
  ctx.save();
  ctx.strokeStyle = '#ffffff44';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.strokeRect(W / 2 - 30, H * 0.62, 60, 80);
  ctx.setLineDash([]);
  ctx.restore();

  // Update pitch
  if (batPhase.pitchActive) {
    batPhase.timer++;
    batPhase.pitchT = Math.min(1, batPhase.timer / 100);
    const t = batPhase.pitchT;
    // Ball starts from pitcher (small, far) and comes toward batter (bigger, bottom center)
    const startX = W / 2, startY = H * 0.54;
    const endX = W / 2 + (Math.random() > 0.5 ? 20 : -20), endY = H * 0.72;
    batPhase.pitchX = startX + (endX - startX) * t;
    batPhase.pitchY = startY + (endY - startY) * t;
    const ballSize = 4 + t * 12;
    addBallTrail(batPhase.pitchX, batPhase.pitchY);
    drawBallTrail();
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ffdd00';
    ctx.beginPath();
    ctx.arc(batPhase.pitchX, batPhase.pitchY, ballSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (batPhase.pitchT >= 1 && !batPhase.swingActive) {
      batPhase.outcome = 'called_strike';
      batPhase.resultTimer = 70;
      batPhase.pitchActive = false;
      batPhase.pitchCount++;
    }
  }

  // Player bat (bottom center)
  drawPlayerBat(batPhase.swingActive, batPhase.swingAngle);
  if (batPhase.swingActive) {
    batPhase.swingAngle = Math.min(batPhase.swingAngle + 0.22, Math.PI * 0.8);
  }

  // Result
  if (batPhase.resultTimer > 0) {
    batPhase.resultTimer--;
    const alpha = Math.min(1, batPhase.resultTimer / 20);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 70px Arial Black';
    ctx.textAlign = 'center';
    let txt = '', color = '#fff';
    if (batPhase.outcome === 'homerun') { txt = 'HOME RUN!'; color = '#ff4444'; }
    else if (batPhase.outcome === 'hit') { txt = 'BASE HIT!'; color = '#00ff88'; }
    else if (batPhase.outcome === 'out') { txt = 'CAUGHT OUT!'; color = '#ff8800'; }
    else if (batPhase.outcome === 'miss') { txt = 'SWING & MISS!'; color = '#888'; }
    else { txt = 'CALLED STRIKE!'; color = '#ffaa00'; }
    ctx.fillStyle = color;
    ctx.shadowBlur = 40;
    ctx.shadowColor = color;
    ctx.fillText(txt, W / 2, H * 0.35);
    ctx.restore();

    if (batPhase.resultTimer === 0) {
      if (batPhase.pitchCount >= batPhase.maxPitches) {
        // End batting, new inning
        state.inning++;
        if (state.inning > 3) {
          state.phase = 'gameover';
          showGameOver();
        } else {
          state.outs = 0;
          state.strikes = 0;
          state.phase = 'pitching';
          resetPitchPhase();
          updateScoreUI();
        }
      } else {
        batPhase.swingActive = false;
        batPhase.swingAngle = 0;
        batPhase.outcome = null;
        batPhase.timer = 0;
        batPhase.pitchActive = false;
        setTimeout(() => throwOpponentPitch(), 800);
      }
    }
  }

  // Action label for batting
  if (batPhase.ready && batPhase.pitchActive && !batPhase.swingActive) {
    showActionLabel('DO A PUSH-UP TO SWING! 💪');
  }

  updateParticles();
  drawParticles();
}

function drawPitcher(x, y, dt) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(0.35, 0.35);
  // Body
  ctx.fillStyle = '#cc2222';
  ctx.fillRect(-8, -28, 16, 30);
  // Head
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath();
  ctx.arc(0, -36, 8, 0, Math.PI * 2);
  ctx.fill();
  // Cap
  ctx.fillStyle = '#cc0000';
  ctx.beginPath();
  ctx.arc(0, -38, 9, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(-9, -38, 18, 4);
  // Arm with ball
  const armAngle = -0.3 + 0.1 * Math.sin(Date.now() * 0.003);
  ctx.save();
  ctx.translate(8, -20);
  ctx.rotate(armAngle);
  ctx.fillStyle = '#cc2222';
  ctx.fillRect(0, 0, 5, 20);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(2, 22, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawPlayerBat(swinging, angle) {
  ctx.save();
  ctx.translate(W * 0.38, H * 0.78);
  if (swinging) {
    ctx.rotate(angle - 0.2);
  } else {
    ctx.rotate(-0.4);
  }
  // Bat
  const batGrad = ctx.createLinearGradient(0, 0, 0, 110);
  batGrad.addColorStop(0, '#c8a870');
  batGrad.addColorStop(1, '#8B4513');
  ctx.fillStyle = batGrad;
  ctx.beginPath();
  ctx.roundRect(-5, -10, 12, 100, 4);
  ctx.fill();
  // Bat barrel
  ctx.fillStyle = '#c8a870';
  ctx.beginPath();
  ctx.ellipse(1, -10, 14, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Player hands
  ctx.save();
  ctx.translate(W * 0.38 + 5, H * 0.82);
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath();
  ctx.arc(0, 0, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ============================================================
// UI HELPERS
// ============================================================
function showActionLabel(text) {
  actionLabel.textContent = text;
  actionLabel.style.display = 'block';
}
function hideActionLabel() {
  actionLabel.style.display = 'none';
}

function updateScoreUI() {
  document.getElementById('inningNum').textContent = state.inning;
  document.getElementById('outsNum').textContent = state.outs;
  document.getElementById('strikesNum').textContent = state.strikes;
  document.getElementById('runsNum').textContent = state.runs;
}

// ============================================================
// PAUSE
// ============================================================
let pausedPhase = null;
document.getElementById('pauseBtn').addEventListener('click', togglePause);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Escape') togglePause();
  if (e.code === 'Space') {
    e.preventDefault();
    handleAction();
  }
});

function togglePause() {
  if (state.phase === 'start' || state.phase === 'gameover') return;
  if (state.paused) {
    state.paused = false;
    state.phase = pausedPhase;
    document.getElementById('pauseBtn').textContent = 'PAUSE (ESC)';
    overlay.style.display = 'none';
  } else {
    state.paused = true;
    pausedPhase = state.phase;
    state.phase = 'paused';
    document.getElementById('pauseBtn').textContent = 'RESUME (ESC)';
    overlay.innerHTML = `
      <h1 style="color:#00ffff;text-shadow:0 0 40px #00ffff">PAUSED</h1>
      <div class="subtitle">Game is paused</div>
      <button class="startBtn" onclick="togglePause()" style="font-size:24px;font-weight:900;color:#000;background:linear-gradient(135deg,#00ffff,#0088ff);border:none;border-radius:50px;padding:14px 50px;cursor:pointer;box-shadow:0 0 30px #00ffff88">RESUME</button>
    `;
    overlay.style.display = 'flex';
  }
}

// ============================================================
// INPUT ACTIONS
// ============================================================
function handleAction() {
  if (state.phase === 'pitching') {
    if (pitchPhase.ready) throwPitch();
  } else if (state.phase === 'fielding') {
    attemptCatch();
  } else if (state.phase === 'batting') {
    swing();
  }
}

function handleCrunch() {
  if (state.phase === 'pitching' || state.phase === 'fielding') handleAction();
}
function handlePushup() {
  if (state.phase === 'batting') handleAction();
}

// ============================================================
// GAME SCREENS
// ============================================================
function startGame() {
  overlay.style.display = 'none';
  state.phase = 'pitching';
  state.inning = 1;
  state.outs = 0;
  state.strikes = 0;
  state.runs = 0;
  updateScoreUI();
  resetPitchPhase();
  initPose();
}

function showGameOver() {
  hideActionLabel();
  overlay.innerHTML = `
    <div id="gameOverTitle">GAME OVER!</div>
    <div id="resultStats">
      Innings Pitched: ${state.inning - 1}<br>
      Runs Allowed: ${state.runs}<br>
      Total Crunches: ${state.totalCrunches}<br>
      Total Push-Ups: ${state.totalPushups}
    </div>
    <button onclick="location.reload()" style="font-size:24px;font-weight:900;color:#000;background:linear-gradient(135deg,#ffdd00,#ff8800);border:none;border-radius:50px;padding:14px 50px;cursor:pointer;box-shadow:0 0 30px #ffdd0088;letter-spacing:2px">PLAY AGAIN</button>
  `;
  overlay.style.display = 'flex';
}

// ============================================================
// DRAW: FIREWORKS on great plays
// ============================================================
let fireworks = [];
function spawnFirework(x, y) {
  const colors = ['#ff4444', '#ffdd00', '#00ffff', '#ff88ff', '#00ff88'];
  spawnParticles(x, y, colors[Math.floor(Math.random() * colors.length)], 40);
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastTime = 0;
function loop(ts) {
  const dt = ts - lastTime;
  lastTime = ts;

  ctx.clearRect(0, 0, W, H);

  // Update cooldowns
  if (crunchCooldown > 0) crunchCooldown--;
  if (pushupCooldown > 0) pushupCooldown--;

  // Detect exercises
  if (state.phase !== 'start' && state.phase !== 'paused' && state.phase !== 'gameover') {
    if (detectCrunch()) handleCrunch();
    if (detectPushup()) handlePushup();
    repCounterEl.textContent = `CRUNCHES: ${state.totalCrunches} | PUSH-UPS: ${state.totalPushups}`;
  }

  if (state.phase === 'pitching') {
    drawPitchingView(dt);
  } else if (state.phase === 'fielding') {
    drawFieldingView(dt);
  } else if (state.phase === 'batting') {
    drawBattingView(dt);
  } else if (state.phase === 'start' || state.phase === 'gameover' || state.phase === 'paused') {
    drawStadiumNight();
    updateParticles();
    drawParticles();
  }

  // Phase label for fielding/batting
  if (state.phase === 'batting' && (!batPhase.pitchActive || batPhase.swingActive)) {
    hideActionLabel();
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Set up poseCanvas size
poseCanvas.width = 180;
poseCanvas.height = 135;

// Occasional ambient fireworks on start screen
setInterval(() => {
  if (state.phase === 'start') {
    spawnFirework(Math.random() * W, Math.random() * H * 0.6);
  }
}, 1200);
</script>
</body>
