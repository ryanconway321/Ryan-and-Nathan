<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geometry Dash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:Arial,sans-serif}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════
//  GEOMETRY DASH  —  Full Remake
// ═══════════════════════════════════════════════════════════════
const C = document.getElementById('c');
const cx = C.getContext('2d');
C.width = 800; C.height = 500;
const W = 800, H = 500;

// ── Physics constants (tuned to feel like the real game) ───────
const T   = 40;          // tile size px
const GX  = H - T*2;    // ground y (top of ground row)  = 420
const SPD = 340;         // px / sec (normal speed)
const G   = 2600;        // gravity px/s²
const JV  = -800;        // jump velocity px/s
const ROT_SPEED = 360;   // degrees / sec while airborne

// ── Audio ──────────────────────────────────────────────────────
const AC = new (window.AudioContext||window.webkitAudioContext)();
function beep(freq,dur,vol,type,t0){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  const t=AC.currentTime+(t0||0);
  g.gain.setValueAtTime(vol||0.1,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+dur);
}
function snd_jump(){ beep(480,0.1,0.1,'square'); }
function snd_die(){
  beep(180,0.2,0.15,'sawtooth');
  beep(120,0.35,0.1,'sawtooth',0.1);
}
function snd_orb(){ beep(660,0.12,0.1,'sine'); }
function snd_win(){
  [523,659,784,1047,1319].forEach((f,i)=>beep(f,0.25,0.12,'square',i*0.12));
}

// ── BPM music ─────────────────────────────────────────────────
const BPM=144, B=60/BPM;
let musicTimer=null, mBeat=0;
const MEL=[659,0,784,0,659,587,0,523,587,659,0,784,880,0,784,0];
const BASS=[131,131,131,131,175,175,175,175,131,131,131,131,110,110,131,131];
function startMusic(){
  if(musicTimer)return;
  mBeat=0;
  function tick(){
    if(G_state!=='play')return;
    const mf=MEL[mBeat%MEL.length];
    if(mf) beep(mf,B*0.35,0.04,'square');
    const bf=BASS[mBeat%BASS.length];
    if(bf) beep(bf,B*0.7,0.06,'triangle');
    if(mBeat%4===0){// kick
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.setValueAtTime(150,AC.currentTime);
      o.frequency.exponentialRampToValueAtTime(40,AC.currentTime+0.08);
      g.gain.setValueAtTime(0.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.12);
      o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+0.12);
    }
    if(mBeat%2===1){// hat
      const buf=AC.createBuffer(1,AC.sampleRate*0.04,AC.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const n=AC.createBufferSource(),g=AC.createGain();n.buffer=buf;g.gain.value=0.03;
      n.connect(g);g.connect(AC.destination);n.start();
    }
    mBeat++;
    musicTimer=setTimeout(tick,B*1000);
  }
  tick();
}
function stopMusic(){ clearTimeout(musicTimer); musicTimer=null; }

// ── Level builder ──────────────────────────────────────────────
// Tiles placed on a grid.  tx = tile-x col, ty = rows from ground (0=ground level)
// Types: 'b'=block, 's'=spike, 'ss'=double spike, 'p'=platform(floaty),
//        'orb'=yellow orb, 'ship'=ship portal, 'cube'=cube portal, 'ball'=ball portal, 'end'=end flag
function makeLvl(){
  const o=[];
  const b  =(tx,ty=0)=>o.push({t:'b', x:tx*T, y:GX-(ty+1)*T, w:T, h:T});
  const b2 =(tx)     =>o.push({t:'b', x:tx*T, y:GX-T*2,      w:T, h:T*2});
  const s  =(tx)     =>o.push({t:'s', x:tx*T, y:GX-T});
  const ss =(tx)     =>{s(tx);s(tx+1);};
  const pl =(tx,ty,w)=>o.push({t:'p', x:tx*T, y:GX-ty*T,     w:(w||3)*T, h:8});
  const orb=(tx,ty)  =>o.push({t:'orb', x:tx*T+T/2, y:GX-ty*T});
  const portal=(tx,mode)=>o.push({t:'portal', x:tx*T, mode});
  const end=(tx)     =>o.push({t:'end', x:tx*T});

  // ── SECTION 1: Very easy intro ─────────────────────────────
  // Single spikes with huge gaps — just learn the jump timing
  s(10);
  s(15);
  s(20);
  b(25);          // single block to jump onto
  s(28);
  s(33);
  ss(38);         // first double spike (wide gap before it)
  b(44);
  s(47);
  s(52);
  ss(57);
  b(62);
  s(65);

  // ── SECTION 2: Moderate — blocks + orbs ────────────────────
  b(74);
  s(77);
  b2(82);         // tall block — jump over it
  s(85);
  s(90);
  orb(95,4);      // first orb: jump onto it mid-air
  s(98);
  b(103);
  s(106);
  ss(111);
  orb(117,4);
  b(120);
  s(123);
  ss(128);
  b(133);
  s(136);

  // ── SECTION 3: Ship portal (easy gaps) ─────────────────────
  portal(144,'ship');
  // Wide gaps between obstacles so ship is easy
  o.push({t:'ceil',x:150*T, y:0,          w:T, h:120});
  o.push({t:'ceil',x:155*T, y:GX-120,     w:T, h:120});
  o.push({t:'ceil',x:161*T, y:0,          w:T, h:100});
  o.push({t:'ceil',x:166*T, y:GX-110,     w:T, h:110});
  o.push({t:'ceil',x:172*T, y:0,          w:T, h:130});
  o.push({t:'ceil',x:177*T, y:GX-130,     w:T, h:130});

  // ── SECTION 4: Cube again, medium ──────────────────────────
  portal(184,'cube');
  s(188);
  ss(193);
  b(198);
  s(201);
  orb(206,4);
  ss(210);
  b(215);
  s(218);
  ss(223);
  b2(228);
  s(231);
  orb(236,4);
  ss(240);
  s(244);
  b(249);
  ss(253);

  // ── SECTION 5: Ball mode (easy — just floor spikes) ────────
  portal(260,'ball');
  s(265);
  s(271);
  s(277);
  s(283);         // ball = flip gravity to dodge floor spikes
  s(289);
  s(295);
  s(301);

  // ── SECTION 6: Final cube (challenging but fair) ───────────
  portal(308,'cube');
  ss(313);
  b(318); s(321);
  ss(326);
  orb(332,4);
  b(336); s(339);
  ss(344);
  b2(349); s(352);
  orb(357,4);
  ss(362);
  b(367); ss(370);
  orb(376,4);
  ss(380); s(384);
  b2(389); ss(392);
  s(397);

  end(404);
  return o;
}

const LEVEL = makeLvl();
const LVL_W = 410*T;

// ── Player ─────────────────────────────────────────────────────
const P={
  x:0, y:GX-T, vy:0, rot:0,
  onGround:false,
  mode:'cube',  // cube|ship|ball|ufo
  grav:1,       // 1 or -1
  spd:SPD,
  w:T-6, h:T-6  // hitbox slightly smaller than visual
};
function resetP(cx){
  P.x=cx||0; P.y=GX-T; P.vy=0; P.rot=0;
  P.onGround=false; P.mode='cube'; P.grav=1; P.spd=SPD;
}

// ── State ──────────────────────────────────────────────────────
let G_state='menu'; // menu|play|dead|win
let camX=0, attempt=1, pct=0;
let held=false, pressed=false;
let deathTimer=0, winTimer=0;
let bgFlash=0, screenShake=0;

// Practice checkpoints
let practiceMode=false;
let checkpoints=[];

// Particles
let PARTS=[];
function burst(wx,wy,col,n=20){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=80+Math.random()*280;
    PARTS.push({x:wx,y:wy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,
      life:1,r:2+Math.random()*5,col,sq:Math.random()<0.5});
  }
}

// Death stars (expanding rings)
let RINGS=[];
function ring(wx,wy,col){
  RINGS.push({x:wx,y:wy,r:5,col,life:1});
}

// ── Input ──────────────────────────────────────────────────────
function press(){
  AC.resume();
  if(G_state==='menu'){ startGame(); return; }
  if(G_state==='dead'&&deathTimer<=0.6){ respawn(); return; }
  if(G_state==='win'&&winTimer<=1){ respawn(); return; }
  if(G_state==='play'){ held=true; pressed=true; }
}
function release(){ held=false; }
document.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){ e.preventDefault(); press(); }
  if(e.code==='KeyP'){ practiceMode=!practiceMode; checkpoints=[]; }
});
document.addEventListener('keyup',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)) release();
});
C.addEventListener('mousedown',e=>{ e.preventDefault(); press(); });
C.addEventListener('mouseup',release);
C.addEventListener('touchstart',e=>{ e.preventDefault(); press(); },{passive:false});
C.addEventListener('touchend',release);
C.addEventListener('contextmenu',e=>e.preventDefault());

function startGame(){
  G_state='play'; attempt=1; PARTS=[]; RINGS=[];
  resetP(); camX=0; pct=0;
  deathTimer=0; winTimer=0;
  held=false; pressed=false;
  checkpoints=[];
  startMusic();
}
function die(){
  if(G_state!=='play') return;
  G_state='dead'; deathTimer=1.5;
  burst(P.x+T/2, P.y+T/2, '#4af', 18);
  burst(P.x+T/2, P.y+T/2, '#fff', 10);
  ring(P.x+T/2, P.y+T/2, '#4af');
  ring(P.x+T/2, P.y+T/2, '#fff');
  screenShake=0.5;
  snd_die(); stopMusic();
}
function respawn(){
  PARTS=[]; RINGS=[];
  if(practiceMode&&checkpoints.length){
    const cp=checkpoints[checkpoints.length-1];
    P.x=cp.px; P.y=cp.py; P.vy=0; P.rot=cp.rot;
    P.mode=cp.mode; P.spd=cp.spd; P.grav=cp.grav;
    camX=cp.cx; pct=cp.pct;
  } else {
    resetP(); camX=0; pct=0;
  }
  G_state='play'; attempt++;
  held=false; pressed=false;
  deathTimer=0;
  startMusic();
}
function winGame(){
  G_state='win'; winTimer=4;
  burst(P.x+T/2,P.y+T/2,'#ff4',30);
  burst(P.x+T/2,P.y+T/2,'#fff',20);
  snd_win(); stopMusic();
}

// ── AABB hit test (with hitbox shrink) ────────────────────────
function hits(ox,oy,ow,oh){
  const s=5; // hitbox shrink per side
  return P.x+s < ox+ow && P.x+T-s > ox &&
         P.y+s < oy+oh && P.y+T-s > oy;
}
// Spike: triangle — use shrunk center point
function hitsSpike(sx,sy){
  const cx=P.x+T/2, cy=P.y+T/2;
  const shrink=8;
  if(cx<sx+shrink||cx>sx+T-shrink) return false;
  if(cy<sy) return false;
  const t=(cx-sx)/T;
  const edgeH=T*Math.min(t,1-t)*2;
  return cy > sy+T-edgeH+shrink;
}

// ── Update ─────────────────────────────────────────────────────
let last=performance.now();
function update(dt){
  // background pulse
  bgFlash=Math.max(0,bgFlash-dt*4);
  screenShake=Math.max(0,screenShake-dt*8);

  // particles
  PARTS=PARTS.filter(p=>{
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=900*dt; p.vx*=0.97;
    p.life-=dt*1.1; return p.life>0;
  });
  RINGS=RINGS.filter(r=>{
    r.r+=dt*200; r.life-=dt*2.5; return r.life>0;
  });

  if(G_state==='dead'){ deathTimer-=dt; return; }
  if(G_state==='win'){  winTimer-=dt; return; }
  if(G_state!=='play') return;

  // progress
  pct=Math.min(100,Math.floor(P.x/LVL_W*100));

  // Camera
  camX=P.x-180;

  // Practice checkpoint every ~4 sec
  if(practiceMode){
    const cpX=Math.floor(P.x/(P.spd*4));
    if(!checkpoints.length||checkpoints[checkpoints.length-1].cpX!==cpX){
      checkpoints.push({cpX,px:P.x,py:P.y,rot:P.rot,mode:P.mode,spd:P.spd,grav:P.grav,cx:camX,pct});
      if(checkpoints.length>20) checkpoints.shift();
    }
  }

  // Check portals
  for(const o of LEVEL){
    if(o.t!=='portal') continue;
    if(P.x+T>o.x && P.x<o.x+T*0.5){
      if(o.mode!==P.mode){
        P.mode=o.mode;
        if(o.mode==='ship'){ P.spd=SPD*1.2; P.vy=0; }
        else if(o.mode==='ball'){ P.spd=SPD*1.15; P.grav=1; P.vy=0; }
        else { P.spd=SPD*1.3; P.grav=1; }
        bgFlash=0.4;
      }
    }
  }

  // Move
  P.x+=P.spd*dt;

  // Mode physics
  if(P.mode==='cube'){
    P.vy+=G*P.grav*dt;
    P.y+=P.vy*dt;
    // Ground
    const floorY=P.grav===1?GX-T:-(H-GX);
    if(P.grav===1&&P.y>=GX-T){ P.y=GX-T; P.vy=0; P.onGround=true; snapRot(); }
    else if(P.grav===-1&&P.y<=0){ P.y=0; P.vy=0; P.onGround=true; snapRot(); }
    else P.onGround=false;
    if(P.onGround&&pressed){ P.vy=JV*P.grav; P.onGround=false; snd_jump(); }
    if(!P.onGround) P.rot+=ROT_SPEED*P.grav*dt;

  } else if(P.mode==='ship'){
    if(held) P.vy=Math.max(-480, P.vy-2200*dt);
    else     P.vy=Math.min( 480, P.vy+1600*dt);
    P.y+=P.vy*dt;
    P.y=Math.max(T/2,Math.min(GX-T/2,P.y));
    P.rot=P.vy*0.04; // tilt with velocity
    P.onGround=false;

  } else if(P.mode==='ball'){
    P.vy+=G*P.grav*dt;
    P.y+=P.vy*dt;
    if(P.grav===1&&P.y>=GX-T){ P.y=GX-T; P.vy=0; P.onGround=true; }
    else if(P.grav===-1&&P.y<=0){ P.y=0; P.vy=0; P.onGround=true; }
    else P.onGround=false;
    if(pressed){ P.grav*=-1; P.vy=0; snd_jump(); bgFlash=0.15; }
    P.rot+=ROT_SPEED*P.grav*dt;

  } else if(P.mode==='ufo'){
    if(pressed){ P.vy=-420; snd_jump(); bgFlash=0.1; }
    P.vy=Math.min(500, P.vy+1800*dt);
    P.y+=P.vy*dt;
    P.y=Math.max(T/2,Math.min(GX-T/2,P.y));
    P.rot+=2*dt;
    P.onGround=false;
  }

  pressed=false;

  // Orbs
  for(const o of LEVEL){
    if(o.t!=='orb') continue;
    const dist=Math.hypot(P.x+T/2-o.x, P.y+T/2-o.y);
    if(dist<T*0.9&&held&&!o._used){
      o._used=true;
      P.vy=JV;
      snd_orb();
      setTimeout(()=>o._used=false,300);
    }
  }

  // Ceiling/floor kill in ship/ball
  if((P.mode==='ship'||P.mode==='ufo')&&(P.y<2||P.y>GX-T+2)){ die(); return; }

  // Collisions
  for(const o of LEVEL){
    const rel=o.x-camX; if(rel<-T*2||rel>W+T) continue;

    if(o.t==='end'){ if(P.x>=o.x){ winGame(); return; } }

    if(o.t==='s'){ if(hitsSpike(o.x,o.y)){ die(); return; } }

    if(o.t==='b'){
      if(hits(o.x,o.y,o.w,o.h)){
        // Land on top if falling and player top is above block top
        if(P.vy>=0 && P.y<=o.y+4){
          P.y=o.y-T; P.vy=0; P.onGround=true; snapRot();
        } else { die(); return; }
      }
    }

    if(o.t==='p'){// platform (land on top only)
      const shrink=4;
      if(P.x+T-shrink>o.x && P.x+shrink<o.x+o.w &&
         P.y+T>=o.y && P.y+T<=o.y+16 && P.vy>=0){
        P.y=o.y-T; P.vy=0; P.onGround=true; snapRot();
      }
    }

    if(o.t==='ceil'||o.t==='ceil2'){// ship obstacles
      if(hits(o.x,o.y,o.w,o.h)){ die(); return; }
    }
  }

  // Out of bounds
  if(P.y>H+50){ die(); }
}

function snapRot(){
  P.rot=Math.round(P.rot/90)*90;
}

// ── Background colors per section ─────────────────────────────
const THEMES=[
  {sky1:'#0a0a1e',sky2:'#12124a',ground:'#0d0d2a',line:'#1a1a55',glow:'#4af',acc:'#2a2a88'},
  {sky1:'#1a0a0a',sky2:'#4a1010',ground:'#2a0d0d',line:'#5a1a1a',glow:'#f44',acc:'#881a1a'},
  {sky1:'#0a1a0a',sky2:'#104a10',ground:'#0d2a0d',line:'#1a5a1a',glow:'#4f4',acc:'#1a881a'},
  {sky1:'#1a1a0a',sky2:'#4a4a10',ground:'#2a2a0d',line:'#5a5a1a',glow:'#ff4',acc:'#88881a'},
  {sky1:'#1a0a1a',sky2:'#4a104a',ground:'#2a0d2a',line:'#5a1a5a',glow:'#f4f',acc:'#881a88'},
];
function theme(){ return THEMES[Math.floor(pct/20)%THEMES.length]; }

// Animated background triangles
const BGT=Array.from({length:40},()=>({
  x:Math.random()*W*5, y:100+Math.random()*(GX-120),
  sz:15+Math.random()*45, spx:0.05+Math.random()*0.2, rot:Math.random()*360
}));
let bgTimer=0;

// ── Draw ───────────────────────────────────────────────────────
function drawBG(dt){
  bgTimer+=dt;
  const th=theme();
  // Sky
  const sg=cx.createLinearGradient(0,0,0,GX);
  sg.addColorStop(0,th.sky1); sg.addColorStop(1,th.sky2);
  cx.fillStyle=sg; cx.fillRect(0,0,W,GX);

  // Beat flash
  if(bgFlash>0){
    cx.fillStyle=`rgba(255,255,255,${bgFlash*0.07})`;
    cx.fillRect(0,0,W,H);
  }

  // Parallax triangles
  for(const t of BGT){
    const sx=((t.x-camX*t.spx)%(W*5)+W*5)%(W*5)-W*0.5;
    if(sx<-100||sx>W+100) continue;
    cx.save(); cx.translate(sx,t.y); cx.rotate((t.rot+bgTimer*20*t.spx)*Math.PI/180);
    cx.globalAlpha=0.06;
    cx.strokeStyle=th.glow; cx.lineWidth=1.5;
    cx.beginPath(); cx.moveTo(0,-t.sz/2); cx.lineTo(t.sz/2,t.sz/2); cx.lineTo(-t.sz/2,t.sz/2); cx.closePath(); cx.stroke();
    cx.globalAlpha=1; cx.restore();
  }

  // Horizon glow
  cx.save();
  cx.shadowColor=th.glow; cx.shadowBlur=18;
  cx.fillStyle=th.glow; cx.globalAlpha=0.12;
  cx.fillRect(0,GX-3,W,3);
  cx.globalAlpha=1; cx.restore();

  // Ground
  const gg=cx.createLinearGradient(0,GX,0,H);
  gg.addColorStop(0,th.acc); gg.addColorStop(1,th.ground);
  cx.fillStyle=gg; cx.fillRect(0,GX,W,H-GX);

  // Ground grid
  cx.globalAlpha=0.18; cx.strokeStyle=th.glow; cx.lineWidth=1;
  const gox=((- camX%T)+T)%T;
  for(let x=gox;x<W;x+=T){
    cx.beginPath(); cx.moveTo(x,GX); cx.lineTo(x,H); cx.stroke();
  }
  for(let y=GX;y<H;y+=T){
    cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke();
  }
  cx.globalAlpha=1;

  // Glowing ground line
  cx.save();
  cx.shadowColor=th.glow; cx.shadowBlur=12+bgFlash*10;
  cx.strokeStyle=th.glow; cx.lineWidth=2.5;
  cx.beginPath(); cx.moveTo(0,GX); cx.lineTo(W,GX); cx.stroke();
  cx.restore();

  // Ceiling line (ball/ship mode)
  if(P.mode==='ship'||P.mode==='ball'||P.mode==='ufo'){
    cx.save(); cx.shadowColor=th.glow; cx.shadowBlur=8;
    cx.strokeStyle=th.glow; cx.lineWidth=2; cx.globalAlpha=0.5;
    cx.beginPath(); cx.moveTo(0,0); cx.lineTo(W,0); cx.stroke();
    cx.restore();
  }
}

function glow(col,blur){ cx.shadowColor=col; cx.shadowBlur=blur||14; }
function noGlow(){ cx.shadowBlur=0; }

function drawObstacles(){
  const th=theme();
  for(const o of LEVEL){
    const sx=o.x-camX;
    if(sx<-T*2||sx>W+T*2) continue;

    if(o.t==='s'){
      cx.save(); glow(th.glow,16);
      // Spike: filled triangle with gradient
      const sg2=cx.createLinearGradient(sx,o.y,sx+T,o.y+T);
      sg2.addColorStop(0,th.glow); sg2.addColorStop(1,'rgba(255,255,255,0.2)');
      cx.fillStyle=sg2;
      cx.beginPath();
      cx.moveTo(sx+T/2,o.y); cx.lineTo(sx+T,o.y+T); cx.lineTo(sx,o.y+T);
      cx.closePath(); cx.fill();
      cx.strokeStyle='rgba(255,255,255,0.6)'; cx.lineWidth=1.5; cx.stroke();
      cx.restore();
    }

    if(o.t==='b'){
      cx.save(); glow(th.glow,8);
      for(let row=0;row<o.h/T;row++){
        const by=o.y+row*T;
        const bg2=cx.createLinearGradient(sx,by,sx+T,by+T);
        bg2.addColorStop(0,th.glow); bg2.addColorStop(1,th.acc);
        cx.fillStyle=bg2; cx.fillRect(sx,by,T,T);
        // inner square
        cx.fillStyle='rgba(0,0,0,0.35)'; cx.fillRect(sx+6,by+6,T-12,T-12);
        cx.strokeStyle='rgba(255,255,255,0.35)'; cx.lineWidth=1; cx.strokeRect(sx+6,by+6,T-12,T-12);
      }
      cx.strokeStyle='rgba(255,255,255,0.5)'; cx.lineWidth=1.5; cx.strokeRect(sx,o.y,T,o.h);
      cx.restore();
    }

    if(o.t==='p'){
      cx.save(); glow(th.glow,12);
      const pg=cx.createLinearGradient(sx,o.y,sx+o.w,o.y+8);
      pg.addColorStop(0,th.glow); pg.addColorStop(1,'rgba(255,255,255,0.1)');
      cx.fillStyle=pg; cx.fillRect(sx,o.y,o.w,8);
      cx.restore();
    }

    if(o.t==='orb'){
      const pulse=0.7+Math.sin(Date.now()*0.008)*0.3;
      cx.save(); glow(o._used?'#fff':o.col||th.glow, 20+pulse*8);
      cx.globalAlpha=0.85+pulse*0.15;
      cx.fillStyle=o.col||th.glow;
      cx.beginPath(); cx.arc(sx,o.y,T*0.42,0,Math.PI*2); cx.fill();
      cx.fillStyle='#fff'; cx.globalAlpha=0.9;
      cx.beginPath(); cx.arc(sx,o.y,T*0.18,0,Math.PI*2); cx.fill();
      // ring
      cx.globalAlpha=0.4; cx.strokeStyle='#fff'; cx.lineWidth=2;
      cx.beginPath(); cx.arc(sx,o.y,T*0.55,0,Math.PI*2); cx.stroke();
      cx.restore();
    }

    if(o.t==='ceil'||o.t==='ceil2'){
      cx.save(); glow(th.glow,8);
      const cg=cx.createLinearGradient(sx,o.y,sx+o.w,o.y+o.h);
      cg.addColorStop(0,th.glow); cg.addColorStop(1,th.acc);
      cx.fillStyle=cg; cx.fillRect(sx,o.y,o.w,o.h);
      cx.strokeStyle='rgba(255,255,255,0.4)'; cx.lineWidth=1.5; cx.strokeRect(sx,o.y,o.w,o.h);
      cx.restore();
    }

    if(o.t==='portal'){
      const pcols={cube:'#4af',ship:'#f84',ball:'#4f4',ufo:'#f4f'};
      const pc=pcols[o.mode]||'#fff';
      cx.save(); glow(pc,20);
      cx.strokeStyle=pc; cx.lineWidth=3;
      cx.strokeRect(sx,0,T*0.8,GX);
      const pulse2=0.6+Math.sin(Date.now()*0.006)*0.4;
      cx.globalAlpha=pulse2*0.25;
      cx.fillStyle=pc; cx.fillRect(sx,0,T*0.8,GX);
      cx.globalAlpha=1;
      cx.fillStyle=pc; cx.font='bold 11px Arial'; cx.textAlign='center';
      cx.fillText(o.mode.toUpperCase(),sx+T*0.4,GX-10);
      cx.textAlign='left'; cx.restore();
    }

    if(o.t==='end'){
      cx.save(); glow('#ff4',20);
      cx.strokeStyle='#ff4'; cx.lineWidth=3;
      cx.beginPath(); cx.moveTo(sx,0); cx.lineTo(sx,GX); cx.stroke();
      cx.fillStyle='#ff4'; cx.font='bold 12px Arial'; cx.textAlign='center';
      cx.fillText('END',sx,20); cx.textAlign='left'; cx.restore();
    }
  }
}

function drawPlayer(){
  if(G_state==='dead') return;
  const th=theme();
  const sx=P.x-camX, sy=P.y;
  cx.save();
  cx.translate(sx+T/2, sy+T/2);
  cx.rotate(P.rot*Math.PI/180);
  glow(th.glow, 14+bgFlash*6);

  if(P.mode==='cube'){
    // Outer square
    const g2=cx.createLinearGradient(-T/2,-T/2,T/2,T/2);
    g2.addColorStop(0,'#4af'); g2.addColorStop(1,'#08f');
    cx.fillStyle=g2; cx.fillRect(-T/2,-T/2,T,T);
    // rotated inner square
    cx.save(); cx.rotate(Math.PI/4);
    cx.fillStyle='rgba(255,255,255,0.25)';
    const is=T*0.33; cx.fillRect(-is,-is,is*2,is*2);
    cx.restore();
    // border
    cx.strokeStyle='rgba(255,255,255,0.7)'; cx.lineWidth=2; cx.strokeRect(-T/2,-T/2,T,T);
    // center dot
    cx.fillStyle='rgba(255,255,255,0.5)'; cx.beginPath(); cx.arc(0,0,4,0,Math.PI*2); cx.fill();

  } else if(P.mode==='ship'){
    cx.fillStyle='#4af';
    cx.beginPath();
    cx.moveTo(T/2,0); cx.lineTo(-T/2+4,-T/3); cx.lineTo(-T/4,0); cx.lineTo(-T/2+4,T/3);
    cx.closePath(); cx.fill();
    cx.strokeStyle='rgba(255,255,255,0.6)'; cx.lineWidth=1.5; cx.stroke();
    // flame
    if(held){
      const fl=0.6+Math.random()*0.4;
      cx.globalAlpha=fl;
      cx.fillStyle=`hsl(${30+Math.random()*30},100%,60%)`;
      cx.beginPath();
      cx.moveTo(-T/4,-T/5); cx.lineTo(-T/2-8-Math.random()*12,0); cx.lineTo(-T/4,T/5);
      cx.closePath(); cx.fill();
      cx.globalAlpha=1;
    }

  } else if(P.mode==='ball'){
    const g2=cx.createRadialGradient(-4,-4,2,0,0,T/2);
    g2.addColorStop(0,'#8ff'); g2.addColorStop(1,'#0a8');
    cx.fillStyle=g2;
    cx.beginPath(); cx.arc(0,0,T/2-2,0,Math.PI*2); cx.fill();
    cx.strokeStyle='rgba(255,255,255,0.6)'; cx.lineWidth=1.5; cx.stroke();
    cx.strokeStyle='rgba(255,255,255,0.4)'; cx.lineWidth=2;
    cx.beginPath(); cx.moveTo(-T/2+2,0); cx.lineTo(T/2-2,0); cx.stroke();
    cx.beginPath(); cx.moveTo(0,-T/2+2); cx.lineTo(0,T/2-2); cx.stroke();

  } else if(P.mode==='ufo'){
    // dome
    cx.fillStyle='#4af';
    cx.beginPath(); cx.ellipse(0,-6,T*0.35,T*0.28,0,Math.PI,0); cx.fill();
    // saucer
    const sg3=cx.createLinearGradient(-T/2,0,T/2,0);
    sg3.addColorStop(0,'#08a'); sg3.addColorStop(0.5,'#4cf'); sg3.addColorStop(1,'#08a');
    cx.fillStyle=sg3;
    cx.beginPath(); cx.ellipse(0,2,T/2-2,T*0.16,0,0,Math.PI*2); cx.fill();
    cx.strokeStyle='rgba(255,255,255,0.5)'; cx.lineWidth=1; cx.stroke();
    // lights
    const on=Math.floor(Date.now()/250)%2;
    cx.fillStyle=on?'#ff4':'#880';
    [-T*0.3,0,T*0.3].forEach(lx=>{
      cx.beginPath(); cx.arc(lx,2,3,0,Math.PI*2); cx.fill();
    });
  }
  noGlow();
  cx.restore();
}

function drawParticles(){
  for(const p of PARTS){
    const sx=p.x-camX;
    cx.save(); cx.globalAlpha=Math.max(0,p.life);
    cx.fillStyle=p.col; glow(p.col,6);
    if(p.sq) cx.fillRect(sx-p.r,p.y-p.r,p.r*2,p.r*2);
    else{ cx.beginPath(); cx.arc(sx,p.y,p.r,0,Math.PI*2); cx.fill(); }
    noGlow(); cx.restore();
  }
  for(const r of RINGS){
    const sx=r.x-camX;
    cx.save(); cx.globalAlpha=Math.max(0,r.life*0.6);
    cx.strokeStyle=r.col; cx.lineWidth=3; glow(r.col,10);
    cx.beginPath(); cx.arc(sx,r.y,r.r,0,Math.PI*2); cx.stroke();
    noGlow(); cx.restore();
  }
}

function drawHUD(){
  const th=theme();
  // Progress bar
  cx.fillStyle='rgba(0,0,0,0.45)'; cx.fillRect(0,H-28,W,28);
  const pg=cx.createLinearGradient(0,0,W,0);
  pg.addColorStop(0,th.glow); pg.addColorStop(1,'#fff');
  cx.fillStyle=pg; cx.fillRect(0,H-28,W*(pct/100),28);
  cx.fillStyle='rgba(0,0,0,0.3)'; cx.fillRect(0,H-28,W*(pct/100),28);
  // % text
  cx.fillStyle='#fff'; cx.font='bold 15px Arial'; cx.textAlign='center';
  cx.fillText(pct+'%', W/2, H-10);
  cx.textAlign='left';
  // attempt
  cx.fillStyle='rgba(0,0,0,0.45)'; cx.fillRect(8,8,105,22);
  cx.fillStyle='rgba(255,255,255,0.7)'; cx.font='13px Arial';
  cx.fillText('Attempt  '+attempt, 14, 23);
  // practice mode
  if(practiceMode){
    cx.fillStyle='rgba(0,200,80,0.15)'; cx.fillRect(8,34,100,20);
    cx.fillStyle='#4fa'; cx.font='11px Arial';
    cx.fillText('PRACTICE (P)', 14, 47);
  }
  // mode badge
  const mcol={cube:'#4af',ship:'#f84',ball:'#4f4',ufo:'#f4f'}[P.mode]||'#fff';
  cx.save(); glow(mcol,8);
  cx.fillStyle=mcol; cx.font='bold 12px Arial'; cx.textAlign='right';
  cx.fillText(P.mode.toUpperCase(),W-10,22);
  cx.restore(); cx.textAlign='left';
  // Hint
  if(attempt===1&&pct<5){
    cx.fillStyle='rgba(255,255,255,0.5)'; cx.font='14px Arial'; cx.textAlign='center';
    cx.fillText('Click / SPACE to jump',W/2,H-50);
    cx.textAlign='left';
  }
}

function drawMenu(){
  // Animated GD-style menu
  const t=Date.now()/1000;
  cx.fillStyle='#0a0a1e'; cx.fillRect(0,0,W,H);
  // spinning shapes BG
  for(let i=0;i<16;i++){
    const x=((i*90+t*40)%W), y=50+Math.sin(t*0.8+i)*180;
    cx.save(); cx.translate(x,y); cx.rotate(t*0.5+i);
    cx.globalAlpha=0.06+Math.sin(t+i)*0.02;
    cx.strokeStyle='#4af'; cx.lineWidth=2;
    cx.strokeRect(-20,-20,40,40);
    cx.restore();
  }
  // Title glow
  cx.save();
  cx.shadowColor='#4af'; cx.shadowBlur=40;
  cx.fillStyle='#4af'; cx.font='bold 62px Arial'; cx.textAlign='center';
  cx.fillText('GEOMETRY',W/2,H/2-55);
  cx.restore();
  cx.save();
  cx.shadowColor='#fff'; cx.shadowBlur=20;
  cx.fillStyle='#fff'; cx.font='bold 62px Arial'; cx.textAlign='center';
  cx.fillText('DASH',W/2,H/2+10);
  cx.restore();
  // Subtitle
  cx.fillStyle='rgba(255,255,255,0.55)'; cx.font='15px Arial'; cx.textAlign='center';
  cx.fillText('Click · Space · Tap to jump', W/2, H/2+55);
  cx.fillText('P = Practice Mode  (checkpoints)', W/2, H/2+78);
  // Pulsing button
  const p2=0.75+Math.sin(t*3)*0.25;
  cx.save(); cx.shadowColor='#ff4'; cx.shadowBlur=20*p2;
  cx.globalAlpha=p2;
  cx.fillStyle='#ff4'; cx.font='bold 22px Arial'; cx.textAlign='center';
  cx.fillText('▶   CLICK TO PLAY', W/2, H/2+125);
  cx.restore(); cx.textAlign='left';
}

function drawDead(){
  cx.fillStyle='rgba(255,0,0,0.1)'; cx.fillRect(0,0,W,H);
  if(deathTimer>0.7){
    cx.save(); cx.shadowColor='#f44'; cx.shadowBlur=30;
    cx.fillStyle='#f44'; cx.font='bold 48px Arial'; cx.textAlign='center';
    cx.fillText('DEAD',W/2,H/2-10);
    cx.restore();
    cx.fillStyle='rgba(255,255,255,0.5)'; cx.font='18px Arial'; cx.textAlign='center';
    cx.fillText(pct+'% reached', W/2, H/2+35);
    cx.textAlign='left';
  } else {
    cx.fillStyle='rgba(255,255,255,0.4)'; cx.font='16px Arial'; cx.textAlign='center';
    cx.fillText('Click or SPACE to retry', W/2, H/2);
    cx.textAlign='left';
  }
}

function drawWin(){
  cx.fillStyle='rgba(255,220,0,0.08)'; cx.fillRect(0,0,W,H);
  const t=Date.now()/1000;
  cx.save(); cx.shadowColor='#ff4'; cx.shadowBlur=40+Math.sin(t*4)*10;
  cx.fillStyle='#ff4'; cx.font='bold 52px Arial'; cx.textAlign='center';
  cx.fillText('LEVEL COMPLETE!',W/2,H/2-30);
  cx.restore();
  cx.fillStyle='#fff'; cx.font='22px Arial'; cx.textAlign='center';
  cx.fillText('100%  🎉  Attempts: '+attempt, W/2, H/2+25);
  if(winTimer<1.8){
    cx.fillStyle='rgba(255,255,255,0.5)'; cx.font='16px Arial';
    cx.fillText('Click or SPACE to play again', W/2, H/2+70);
  }
  cx.textAlign='left';
}

// ── Main loop ──────────────────────────────────────────────────
function loop(now){
  const dt=Math.min((now-last)/1000, 0.05);
  last=now;
  update(dt);

  // Screen shake
  let ox=0,oy=0;
  if(screenShake>0){ ox=(Math.random()-0.5)*screenShake*10; oy=(Math.random()-0.5)*screenShake*8; }

  cx.save(); cx.translate(ox,oy);

  if(G_state==='menu'){
    drawMenu();
  } else {
    drawBG(dt);
    drawObstacles();
    drawParticles();
    drawPlayer();
    drawHUD();
    if(G_state==='dead') drawDead();
    if(G_state==='win')  drawWin();
  }

  cx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
