<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soccer Levels — Ryan & Nathan</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = C.width  = Math.min(window.innerWidth,  900);
const H = C.height = Math.min(window.innerHeight, 580);

// ── LEVELS ─────────────────────────────────────────────────────────────────
const LEVELS = [
  { id:0,  name:'Tutorial',       sub:'Learn the basics',     col:'#2255cc', diff:'TUTORIAL', time:999, aiSpd:0,   aiJump:false, aiKick:0,   scoreWin:1  },
  { id:1,  name:'Kickoff',        sub:'Your first real match', col:'#22aa44', diff:'EASY',     time:30,  aiSpd:1.4, aiJump:false, aiKick:0.12, scoreWin:1  },
  { id:2,  name:'Park Game',      sub:'A friendly kickaround', col:'#22aa44', diff:'EASY',     time:30,  aiSpd:2.0, aiJump:false, aiKick:0.22, scoreWin:1  },
  { id:3,  name:'School League',  sub:'First real challenge',  col:'#88aa22', diff:'EASY',     time:30,  aiSpd:2.6, aiJump:false, aiKick:0.30, scoreWin:1  },
  { id:4,  name:'Town Cup',       sub:'Getting tougher',       col:'#ccaa00', diff:'MEDIUM',   time:30,  aiSpd:4.0, aiJump:true,  aiKick:0.5, scoreWin:1  },
  { id:5,  name:'City Finals',    sub:'You feel the pressure', col:'#cc8800', diff:'MEDIUM',   time:30,  aiSpd:4.5, aiJump:true,  aiKick:0.6, scoreWin:1  },
  { id:6,  name:'Regional Champ', sub:'This one won\'t be easy',col:'#cc5500',diff:'HARD',     time:30,  aiSpd:5.0, aiJump:true,  aiKick:0.7, scoreWin:1  },
  { id:7,  name:'National Cup',   sub:'Elite competition',     col:'#cc2200', diff:'HARD',     time:30,  aiSpd:5.5, aiJump:true,  aiKick:0.8, scoreWin:1  },
  { id:8,  name:'World Cup Semi', sub:'Only legends get here', col:'#aa0000', diff:'INSANE',   time:30,  aiSpd:6.0, aiJump:true,  aiKick:0.9, scoreWin:1  },
  { id:9,  name:'WORLD CUP FINAL',sub:'BECOME A LEGEND',       col:'#880000', diff:'EXTREME',  time:30,  aiSpd:6.5, aiJump:true,  aiKick:1.0, scoreWin:1  },
];
const DIFF_COLS = { TUTORIAL:'#2255cc', EASY:'#22aa44', MEDIUM:'#ccaa00', HARD:'#cc5500', INSANE:'#cc0022', EXTREME:'#880000' };

// ── SAVE ───────────────────────────────────────────────────────────────────
let save = JSON.parse(localStorage.getItem('soccer_save') || 'null') || { unlocked:1, stars:{} };
if (!save.stars) save.stars = {};
if (save.unlocked < 1) save.unlocked = 1;
const persist = () => localStorage.setItem('soccer_save', JSON.stringify(save));

// ── PHYSICS CONSTANTS ──────────────────────────────────────────────────────
const GY      = H * 0.84;
const GRAVITY = 0.52;
const JUMP_F  = -15.5;
const P_ACCEL = 1.5;
const P_MAXSPD= 6;
const BALL_R  = 15;
const P_R     = 20;
const GOAL_W  = 26;
const GOAL_H  = 140;
const GOAL_Y  = GY - GOAL_H;

const lerp  = (a,b,t) => a+(b-a)*t;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

// ── INPUT ──────────────────────────────────────────────────────────────────
const keys = {};
const keysUp = {};
document.addEventListener('keydown', e => {
  keys[e.code]=true;
  ['Space','ArrowUp','ArrowDown'].includes(e.code)&&e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.code]=false;
  keysUp[e.code]=true;
});
let jclick=false, mx=0, my=0;
C.addEventListener('click', ()=>jclick=true);
C.addEventListener('mousemove', e=>{ const r=C.getBoundingClientRect(); mx=(e.clientX-r.left)*(W/r.width); my=(e.clientY-r.top)*(H/r.height); });

// ── PARTICLES ──────────────────────────────────────────────────────────────
let parts=[];
function spawnP(x,y,cols,n=20,spd=5){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=1+Math.random()*spd; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:3+Math.random()*5,life:1,col:cols[i%cols.length]}); } }
function tickP(){ parts=parts.filter(p=>{ p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.018;return p.life>0; }); }
function drawP(){ parts.forEach(p=>{ ctx.globalAlpha=p.life*p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill(); }); ctx.globalAlpha=1; }

// ── SCREEN SHAKE ───────────────────────────────────────────────────────────
let shk={t:0,x:0,y:0};
function doShk(n){ shk.t=n; }
function tickShk(){ if(shk.t>.5){shk.t*=.8;shk.x=(Math.random()-.5)*shk.t*2;shk.y=(Math.random()-.5)*shk.t*2;}else{shk.t=0;shk.x=0;shk.y=0;} }

// ── CROWD ──────────────────────────────────────────────────────────────────
const CC=['#cc2222','#2244cc','#22aa44','#cc8800','#882288','#888'];
let crowd=[];
for(let i=0;i<55;i++) crowd.push({x:(i+.5)/55*W,baseY:H*.07+Math.random()*H*.15,jy:0,col:CC[i%CC.length],sz:5+Math.random()*4});
function tickCrowd(excited){ crowd.forEach(c=>{ c.jy*=excited?.92:.88; if(excited&&Math.random()<.04)c.jy=-18-Math.random()*14; }); }
function drawCrowd(){ crowd.forEach(c=>{ const y=c.baseY+c.jy; ctx.fillStyle=c.col; ctx.beginPath();ctx.arc(c.x,y,c.sz,0,Math.PI*2);ctx.fill(); ctx.fillStyle=c.col+'88';ctx.fillRect(c.x-c.sz*.7,y+c.sz,c.sz*1.4,c.sz*2); }); }

// ── STATIC BACKGROUND ──────────────────────────────────────────────────────
let bgC=null;
function buildBG(levelCol='#0e2010'){
  bgC=document.createElement('canvas'); bgC.width=W; bgC.height=H;
  const b=bgC.getContext('2d');
  const sky=b.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#060c18'); sky.addColorStop(1,levelCol+'44');
  b.fillStyle=sky; b.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){b.fillStyle=`rgba(255,255,255,${.3+Math.random()*.6})`;b.beginPath();b.arc((i*173+7)%W,(i*97+11)%(H*.3),.8+Math.random(),0,Math.PI*2);b.fill();}
  b.fillStyle='#0c180c';b.fillRect(0,H*.04,W,H*.4);
  for(let r=0;r<8;r++){b.fillStyle=`rgba(0,0,0,${.3+r*.04})`;b.fillRect(0,H*.04+r*(H*.4/8),W,H*.4/8-1);}
  [[W*.12,H*.03],[W*.38,H*.01],[W*.62,H*.01],[W*.88,H*.03]].forEach(([lx,ly])=>{
    b.strokeStyle='#555';b.lineWidth=4;b.beginPath();b.moveTo(lx,ly+18);b.lineTo(lx,ly-22);b.stroke();
    const g=b.createRadialGradient(lx,ly-22,0,lx,ly-22,50);g.addColorStop(0,'rgba(255,245,170,.8)');g.addColorStop(1,'rgba(255,245,170,0)');
    b.fillStyle=g;b.beginPath();b.arc(lx,ly-22,50,0,Math.PI*2);b.fill();
    b.fillStyle='#ffe';b.beginPath();b.arc(lx,ly-22,5,0,Math.PI*2);b.fill();
  });
  const fg=b.createLinearGradient(0,H*.43,0,H);fg.addColorStop(0,'#1a7a20');fg.addColorStop(1,'#125018');
  b.fillStyle=fg;b.fillRect(0,H*.43,W,H*.57);
  for(let i=0;i<8;i++){if(i%2===0){b.fillStyle='rgba(0,0,0,.07)';b.fillRect(i*W/8,H*.43,W/8,H*.57);}}
  b.strokeStyle='rgba(255,255,255,.55)';b.lineWidth=2;
  b.strokeRect(GOAL_W+2,H*.43,W-GOAL_W*2-4,GY-H*.43);
  b.beginPath();b.moveTo(W/2,H*.43);b.lineTo(W/2,GY);b.stroke();
  b.beginPath();b.arc(W/2,(H*.43+GY)/2,65,0,Math.PI*2);b.stroke();
  b.fillStyle='rgba(255,255,255,.5)';b.beginPath();b.arc(W/2,(H*.43+GY)/2,4,0,Math.PI*2);b.fill();
  b.strokeRect(GOAL_W,GY-110,130,110);b.strokeRect(W-GOAL_W-130,GY-110,130,110);
  b.strokeRect(GOAL_W,GY-60,55,60);b.strokeRect(W-GOAL_W-55,GY-60,55,60);
  b.strokeStyle='rgba(255,255,255,.5)';b.lineWidth=3;
  b.beginPath();b.moveTo(0,GY);b.lineTo(W,GY);b.stroke();
}

function drawGoals(){
  [0,W-GOAL_W].forEach((gx,i)=>{
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(gx,GOAL_Y,GOAL_W,GOAL_H);
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.strokeRect(gx,GOAL_Y,GOAL_W,GOAL_H);
    ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;
    for(let n=1;n<5;n++){ctx.beginPath();ctx.moveTo(gx+n*(GOAL_W/5),GOAL_Y);ctx.lineTo(gx+n*(GOAL_W/5),GY);ctx.stroke();}
    for(let n=1;n<6;n++){ctx.beginPath();ctx.moveTo(gx,GOAL_Y+n*(GOAL_H/6));ctx.lineTo(gx+GOAL_W,GOAL_Y+n*(GOAL_H/6));ctx.stroke();}
  });
}

// ── PLAYER ─────────────────────────────────────────────────────────────────
const TCOL=['#2255ee','#ee2222'];
const TLIT=['#5588ff','#ff5555'];

function mkPlayer(x,team){
  return {
    x, y:GY, vx:0, vy:0, onGround:true, team,
    dir:team===0?1:-1, kickCD:0, cel:0, legPh:0,
    charge:0,           // charged shot (0-1)
    isCharging:false,   // currently holding charge key
    speedBoost:0,       // frames remaining for speed boost
    powerKick:false,    // next kick does 2x force
    frozen:0,           // frames remaining frozen
    activePU:null,      // active power-up type string
    activePUTimer:0,    // frames remaining for display bar
    activePUMax:0,      // max frames for display bar
    lastKeyA:0,         // frame of last A press (for dash)
    lastKeyD:0,         // frame of last D press (for dash)
  };
}
let p1,p2,ball;

function resetPos(levelId){
  p1=mkPlayer(W*.28,0); p2=mkPlayer(W*.72,1);
  const bvy=levelId===0?-3:-2;
  ball={x:W/2,y:GY-180,vx:(Math.random()-.5)*2,vy:bvy,spin:0,rot:0};
}

// ── POWER-UPS ──────────────────────────────────────────────────────────────
let powerups=[];
let puSpawnTimer=0;
let ballScale=1;
let ballScaleTimer=0;
const PU_TYPES=[
  {type:'speed',  emoji:'⚡', col:'#ffdd00', desc:'+Speed'},
  {type:'power',  emoji:'💥', col:'#ff8800', desc:'Power Kick'},
  {type:'freeze', emoji:'❄️',  col:'#00ddff', desc:'Freeze Foe'},
  {type:'bigball',emoji:'🔮', col:'#aa44ff', desc:'Big Ball'},
];

function spawnPowerup(){
  const t=PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];
  const x=GOAL_W+60+Math.random()*(W-GOAL_W*2-120);
  powerups.push({x, y:GY-18, type:t.type, emoji:t.emoji, col:t.col, pulse:0});
}

function applyPowerup(player, pu){
  const opponent = player===p1?p2:p1;
  player.activePU=pu.type;
  switch(pu.type){
    case 'speed':
      player.speedBoost=6*60;
      player.activePUTimer=6*60; player.activePUMax=6*60;
      break;
    case 'power':
      player.powerKick=true;
      player.activePUTimer=1;  player.activePUMax=1; // shows until used
      break;
    case 'freeze':
      opponent.frozen=3*60;
      player.activePUTimer=3*60; player.activePUMax=3*60;
      break;
    case 'bigball':
      ballScale=2;
      ballScaleTimer=5*60;
      player.activePUTimer=5*60; player.activePUMax=5*60;
      break;
  }
  spawnP(pu.x, pu.y, [pu.col,'#fff','#ffff88'], 20, 5);
}

function tickPowerups(){
  // Spawn timer
  puSpawnTimer++;
  if(puSpawnTimer>=8*60){ puSpawnTimer=0; spawnPowerup(); }

  // Big ball timer
  if(ballScaleTimer>0){ ballScaleTimer--; if(ballScaleTimer===0) ballScale=1; }

  // Animate pulse
  powerups.forEach(pu=>{ pu.pulse=(pu.pulse||0)+0.08; });

  // Check collection by both players
  [p1,p2].forEach(pl=>{
    for(let i=powerups.length-1;i>=0;i--){
      const pu=powerups[i];
      if(Math.hypot(pl.x-pu.x, pl.y-pu.y)<25){
        applyPowerup(pl, pu);
        powerups.splice(i,1);
      }
    }
  });

  // Tick player power-up timers
  [p1,p2].forEach(pl=>{
    if(pl.speedBoost>0) pl.speedBoost--;
    if(pl.frozen>0) pl.frozen--;
    if(pl.activePUTimer>0 && pl.activePU!=='power') pl.activePUTimer--;
  });
}

function drawPowerups(){
  powerups.forEach(pu=>{
    const pulse=Math.sin(pu.pulse)*5;
    const r=18+pulse;
    // Glow
    const grd=ctx.createRadialGradient(pu.x,pu.y,2,pu.x,pu.y,r+10);
    grd.addColorStop(0, pu.col+'cc');
    grd.addColorStop(1, pu.col+'00');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(pu.x,pu.y,r+10,0,Math.PI*2);ctx.fill();
    // Circle
    ctx.fillStyle=pu.col+'99';
    ctx.beginPath();ctx.arc(pu.x,pu.y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=pu.col;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(pu.x,pu.y,r,0,Math.PI*2);ctx.stroke();
    // Emoji
    ctx.font='20px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.fillText(pu.emoji,pu.x,pu.y+7);
  });
}

function drawPlayerPUBar(p){
  if(!p.activePU || p.activePUTimer<=0) return;
  const pu=PU_TYPES.find(t=>t.type===p.activePU);
  if(!pu) return;
  const bw=50, bh=7;
  const bx=p.x-bw/2, by=p.y-P_R-80;
  // Icon
  ctx.font='14px Arial';ctx.textAlign='center';ctx.fillText(pu.emoji, p.x, by-4);
  // Bar bg
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx,by,bw,bh);
  // Bar fill
  const frac = p.activePU==='power' ? 1 : p.activePUTimer/p.activePUMax;
  ctx.fillStyle=pu.col;ctx.fillRect(bx,by,bw*frac,bh);
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
}

// ── COMBO SYSTEM ───────────────────────────────────────────────────────────
let comboTimer=0, comboCount=0, comboDisplay=0, maxComboReached=0;

function tickCombo(){
  if(comboTimer>0) comboTimer--;
  if(comboDisplay>0) comboDisplay--;
}

function onGoalCombo(){
  if(comboTimer>0){ comboCount++; } else { comboCount=1; }
  comboTimer=8*60;
  comboDisplay=150;
  if(comboCount>maxComboReached) maxComboReached=comboCount;
}

function resetCombo(){
  comboTimer=0; comboCount=0; comboDisplay=0; maxComboReached=0;
}

function drawCombo(){
  if(comboDisplay<=0 || comboCount<2) return;
  const a=Math.min(1, comboDisplay/40);
  const sc=1+0.5*Math.sin(comboDisplay*0.15);
  ctx.save();
  ctx.globalAlpha=a;
  ctx.translate(W/2, H*.37);
  ctx.scale(sc,sc);
  ctx.font='bold 52px Arial';ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillText(`${comboCount}x COMBO!`,2,2);
  ctx.fillStyle='#ffcc00';ctx.fillText(`${comboCount}x COMBO!`,0,0);
  ctx.restore();
}

// ── ELECTRIC WALL BOUNCE ───────────────────────────────────────────────────
let electricFlash=0;

function spawnElectric(x,y){
  spawnP(x,y,['#00ffff','#ffffff','#88ccff'],15,7);
  electricFlash=12;
}

function drawElectricFlash(){
  if(electricFlash<=0) return;
  electricFlash--;
  const a=(electricFlash/12)*0.18;
  ctx.fillStyle=`rgba(100,220,255,${a})`;ctx.fillRect(0,0,W,H);
}

// ── PLAYER UPDATE ──────────────────────────────────────────────────────────
function updatePlayer(p,up,dn,lt,rt,kick){
  // Frozen: cannot move
  if(p.frozen>0){
    p.vx*=0; p.vy+=GRAVITY; p.x+=p.vx; p.y+=p.vy;
    if(p.y>=GY){p.y=GY;p.vy=0;p.onGround=true;p.vx=0;}
    p.x=clamp(p.x,GOAL_W+P_R,W-GOAL_W-P_R);
    if(p.kickCD>0)p.kickCD--;
    if(p.cel>0)p.cel--;
    return;
  }

  const maxSpd = P_MAXSPD + (p.speedBoost>0?3:0);

  if(lt) p.vx=Math.max(p.vx-P_ACCEL,-maxSpd);
  else if(rt) p.vx=Math.min(p.vx+P_ACCEL,maxSpd);
  else p.vx*=p.onGround?.80:.96;
  if(up&&p.onGround){p.vy=JUMP_F;p.onGround=false;}
  p.vy+=GRAVITY; p.x+=p.vx; p.y+=p.vy;
  if(p.y>=GY){p.y=GY;p.vy=0;p.onGround=true;p.vx*=.78;}
  p.x=clamp(p.x,GOAL_W+P_R,W-GOAL_W-P_R);
  if(p.vx>.2)p.dir=1;else if(p.vx<-.2)p.dir=-1;
  if(p.kickCD>0)p.kickCD--;
  if(p.cel>0)p.cel--;
  if(p.onGround&&Math.abs(p.vx)>.5)p.legPh+=Math.abs(p.vx)*.1;

  // ── BICYCLE KICK: W+S in air ──
  if(up&&dn&&!p.onGround&&p.kickCD===0){
    const dx=ball.x-p.x,dy=ball.y-(p.y-P_R),d=Math.hypot(dx,dy);
    if(d<P_R+BALL_R+28){
      ball.vy=-22; ball.vx=p.dir*16;
      spawnP(ball.x,ball.y,['#ffcc00','#ff8800','#fff'],18,7);
      p.kickCD=30; p.cel=60;
      return;
    }
  }

  // ── CHARGED SHOT ──
  if(kick&&p.kickCD===0){
    const dx=ball.x-p.x,dy=ball.y-(p.y-P_R),d=Math.hypot(dx,dy);
    if(d<P_R+BALL_R+18){
      // Build charge
      p.isCharging=true;
      p.charge=Math.min(1, p.charge+1/40);
      // Don't kick yet — wait for key release
    } else {
      p.isCharging=false;
    }
  } else {
    p.isCharging=false;
  }
}

function fireChargedShot(p){
  if(p.kickCD!==0) return;
  const dx=ball.x-p.x,dy=ball.y-(p.y-P_R),d=Math.hypot(dx,dy);
  if(d<P_R+BALL_R+18){
    const nx=dx/d,ny=dy/d;
    const force=(20+p.charge*18)*(p.powerKick?2:1);
    ball.vx=nx*force+p.vx*.7;
    ball.vy=ny*force-10+p.vy*.5;
    ball.spin=p.vx*.4;
    p.kickCD=22;
    if(p.powerKick){ p.powerKick=false; p.activePU=null; p.activePUTimer=0; }
    // Particles scale with charge
    const pCount=Math.round(10+p.charge*20);
    if(p.charge>0.6){
      spawnP(ball.x,ball.y,['#ff6600','#ff9900','#ffcc00','#fff','#ff3300'],pCount,8);
    } else {
      spawnP(ball.x,ball.y,['#fff','#ffcc00','#ff8800'],pCount,6);
    }
    doShk(p.charge*8);
  }
  p.charge=0; p.isCharging=false;
}

function collidePB(p){
  const br=BALL_R*ballScale;
  const dx=ball.x-p.x,dy=ball.y-(p.y-P_R),d=Math.hypot(dx,dy);
  if(d<P_R+br){
    const nx=dx/d,ny=dy/d,rv=(ball.vx-p.vx)*nx+(ball.vy-p.vy)*ny;
    if(rv<0){const imp=rv*1.4;ball.vx-=nx*imp;ball.vy-=ny*imp;}
    const ov=(P_R+br)-d;ball.x+=nx*ov;ball.y+=ny*ov;
  }
}

function drawPlayer(p){
  // Power-up bar above head
  drawPlayerPUBar(p);

  // Charging aura
  if(p.isCharging&&p.charge>0){
    const t=Date.now()/200;
    const col=`hsl(${lerp(50,0,p.charge)},100%,55%)`;
    ctx.save();
    ctx.strokeStyle=col;
    ctx.lineWidth=3+p.charge*4;
    ctx.globalAlpha=0.5+0.4*Math.sin(t)*p.charge;
    ctx.beginPath();ctx.arc(p.x,p.y-P_R-5,(P_R+8)+Math.sin(t)*4*p.charge,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // Frozen tint indicator
  if(p.frozen>0){
    ctx.save();
    ctx.globalAlpha=0.35;
    ctx.fillStyle='#00ccff';
    ctx.beginPath();ctx.arc(p.x,p.y-P_R-5,P_R+10,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // Ground shadow
  const shadowA=p.onGround?.35:.15;
  ctx.fillStyle=`rgba(0,0,0,${shadowA})`;ctx.beginPath();ctx.ellipse(p.x,GY,20,5,0,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.dir,1);
  const cel=p.cel>0,run=p.onGround&&Math.abs(p.vx)>1;
  const tc=TCOL[p.team],tl=TLIT[p.team];

  // ── Legs ──
  [-1,1].forEach((s,li)=>{

// ── BALL ───────────────────────────────────────────────────────────────────
function drawBall(){
  const br=BALL_R*ballScale;
  const sh=GY-ball.y,ss=clamp(1-sh/500,.05,.9);
  ctx.fillStyle=`rgba(0,0,0,${.35*ss})`;ctx.beginPath();ctx.ellipse(ball.x,GY,br*ss,br*ss*.35,0,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.rot);
  const bg=ctx.createRadialGradient(-4,-5,1,0,0,br);bg.addColorStop(0,'#fff');bg.addColorStop(.5,'#eee');bg.addColorStop(1,'#bbb');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,br,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';
  [[0,0],[0,-br*.55],[br*.52,br*.17],[-br*.52,br*.17],[br*.32,-br*.44],[-br*.32,-br*.44]].forEach(([px,py])=>{
    ctx.beginPath();for(let s=0;s<5;s++){const a=s*Math.PI*2/5-Math.PI/2;ctx[s?'lineTo':'moveTo'](px+Math.cos(a)*br*.28,py+Math.sin(a)*br*.28);}ctx.closePath();ctx.fill();
  });
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(-4,-5,5,4,-.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function updateBall(){
  const br=BALL_R*ballScale;
  const spd=Math.hypot(ball.vx,ball.vy);

  // ── Fire/Electric trail ──
  if(spd>8){
    const trailCols = spd>14
      ? ['#00ccff','#0099ff','#ffffff','#66ffff']
      : ['#ff6600','#ff9900','#ffcc00','#fff','#ff3300'];
    spawnP(ball.x,ball.y,trailCols,3,1.5);
  }

  ball.vy+=GRAVITY;ball.vx*=.993;ball.x+=ball.vx;ball.y+=ball.vy;
  ball.rot+=ball.vx*.055;ball.spin*=.96;ball.vx+=ball.spin*.04;

  if(ball.y-br<0){
    const hitSpd=Math.hypot(ball.vx,ball.vy);
    ball.y=br;ball.vy*=-.6;
    if(hitSpd>12) spawnElectric(ball.x,ball.y);
  }
  if(ball.y+br>=GY){
    const hitSpd=Math.hypot(ball.vx,ball.vy);
    ball.y=GY-br;ball.vy*=-.6;ball.vx*=.82;
    if(Math.abs(ball.vy)<1.5)ball.vy=0;
    if(hitSpd>12) spawnElectric(ball.x,GY);
  }

  const inGY=ball.y+br>GOAL_Y&&ball.y-br<GY+10;
  if(ball.x-br<=0&&inGY){triggerGoal(1);return;}
  if(ball.x+br>=W&&inGY){triggerGoal(0);return;}

  if(ball.x-br<GOAL_W&&!inGY){
    const hitSpd=Math.hypot(ball.vx,ball.vy);
    ball.x=GOAL_W+br;ball.vx*=-.65;
    if(hitSpd>12) spawnElectric(ball.x,ball.y);
  }
  if(ball.x+br>W-GOAL_W&&!inGY){
    const hitSpd=Math.hypot(ball.vx,ball.vy);
    ball.x=W-GOAL_W-br;ball.vx*=-.65;
    if(hitSpd>12) spawnElectric(ball.x,ball.y);
  }
  if(ball.x-br<0){
    const hitSpd=Math.hypot(ball.vx,ball.vy);
    ball.x=br;ball.vx*=-.65;
    if(hitSpd>12) spawnElectric(ball.x,ball.y);
  }
  if(ball.x+br>W){
    const hitSpd=Math.hypot(ball.vx,ball.vy);
    ball.x=W-br;ball.vx*=-.65;
    if(hitSpd>12) spawnElectric(ball.x,ball.y);
  }
}

// ── GAME STATE ─────────────────────────────────────────────────────────────
let G={screen:'menu'}; // menu | levels | game | result
let curLevel=0, goalFlash=0, goalTeam=-1, score=[0,0], timeLeft=0, frames=0, gameover=false;

function startLevel(id){
  curLevel=id;
  const lv=LEVELS[id];
  score=[0,0]; timeLeft=lv.time; frames=0; gameover=false; goalFlash=0;
  parts=[]; crowd.forEach(c=>c.jy=0);
  powerups=[]; puSpawnTimer=0; ballScale=1; ballScaleTimer=0;
  resetCombo();
  buildBG(lv.col);
  resetPos(id);
  G.screen= id===0?'tutorial':'game';
  if(id===0) initTutorial();
}

function triggerGoal(team){
  if(gameover||goalFlash>0) return;
  score[team]++;goalFlash=200;goalTeam=team;
  onGoalCombo();
  doShk(12);
  spawnP(ball.x,ball.y,team===0?['#5588ff','#aaccff','#fff','#ffcc00']:['#ff5555','#ffaaaa','#fff','#ffcc00'],55,9);
  crowd.forEach(c=>c.jy=-30-Math.random()*20);
  [p1,p2][team].cel=200;
  setTimeout(()=>{
    if(G.screen==='game'||G.screen==='tutorial'||G.screen==='twoplayer'){
      goalFlash=0;
      if(G.screen==='twoplayer'){ resetPos(1); return; }
      if(timeLeft<=0){ endGame(); return; }
      resetPos(curLevel);
    }
  },2800);
}

function endGame(){
  gameover=true;
  const won=score[0]>score[1];
  const margin=score[0]-score[1];
  let stars=0;
  if(won){ stars=margin>=3?3:margin>=2?2:1; }
  // Bonus star for combo >= 3
  if(maxComboReached>=3 && stars>0 && stars<3) stars=Math.min(3,stars+1);
  if(stars>0){
    const prev=save.stars[curLevel]||0;
    if(stars>prev) save.stars[curLevel]=stars;
    if(curLevel+1>save.unlocked&&curLevel+1<LEVELS.length) save.unlocked=curLevel+1;
    persist();
  }
  G.screen='result';
  G.resultWon=won; G.resultStars=stars; G.resultScore=[...score];
  G.resultMaxCombo=maxComboReached;
}

// ── AI ──────────────────────────────────────────────────────────────────────
function updateAI(p,lv){
  const bx=ball.x,by=ball.y;
  let tx=bx+(bx<W/2?30:-30);
  if(bx>W*.65&&by>GY-80)tx=bx-50;
  const spd=lv.aiSpd+(p.speedBoost>0?3:0);

  // Frozen: can't move or kick
  if(p.frozen>0){
    p.vy+=GRAVITY; p.y+=p.vy;
    if(p.y>=GY){p.y=GY;p.vy=0;p.onGround=true;p.vx=0;}
    p.x=clamp(p.x,GOAL_W+P_R,W-GOAL_W-P_R);
    if(p.kickCD>0)p.kickCD--; if(p.cel>0)p.cel--;
    return;
  }

  // Jump
  if(lv.aiJump&&by<p.y-70&&Math.abs(bx-p.x)<100&&p.onGround&&Math.random()<.06){p.vy=JUMP_F;p.onGround=false;}

  // Kick
  const dk=Math.hypot(bx-p.x,by-(p.y-P_R))<P_R+BALL_R+22&&p.kickCD===0&&Math.random()<lv.aiKick;
  if(dk){
    const dx=ball.x-p.x,dy=ball.y-(p.y-P_R),d=Math.hypot(dx,dy);
    if(d<P_R+BALL_R+22){
      const nx=dx/d,ny=dy/d;
      const force=20*(p.powerKick?2:1);
      ball.vx=nx*force+p.vx*.7;ball.vy=ny*force-10+p.vy*.5;
      ball.spin=p.vx*.4;p.kickCD=22;
      if(p.powerKick){ p.powerKick=false; p.activePU=null; p.activePUTimer=0; }
      spawnP(ball.x,ball.y,['#fff','#ffcc00','#ff8800'],10,6);
    }
  }

  if(lv.aiSpd===0) return; // tutorial AI: no movement

  // Move
  if(tx<p.x-10)p.vx=Math.max(p.vx-P_ACCEL,-spd);
  else if(tx>p.x+10)p.vx=Math.min(p.vx+P_ACCEL,spd);
  else p.vx*=.78;
  p.vy+=GRAVITY; p.x+=p.vx; p.y+=p.vy;
  if(p.y>=GY){p.y=GY;p.vy=0;p.onGround=true;p.vx*=.78;}
  p.x=clamp(p.x,GOAL_W+P_R,W-GOAL_W-P_R);
  if(p.vx>.2)p.dir=1;else if(p.vx<-.2)p.dir=-1;
  if(p.kickCD>0)p.kickCD--;
  if(p.cel>0)p.cel--;
  if(p.onGround&&Math.abs(p.vx)>.5)p.legPh+=Math.abs(p.vx)*.1;
}

  if(Math.abs(p1.vx)>1) tut.moved=true;
  if(!p1.onGround&&p1.vy<0) tut.jumped=true;

  if(score[0]>0||score[1]>0) tut.goalScored=true;

  const step=TUT_STEPS[tut.step];

// ── TRICK MOVES: DASH ──────────────────────────────────────────────────────
function handleDash(p, isP1){
  // Called once per frame before updatePlayer
  const curFrame=frames;
  if(isP1){
    if(keys['KeyA']&&!p._prevKeyA){
      if(curFrame-p.lastKeyA<15){ // double-tap
        p.vx=-8; spawnP(p.x,p.y,['#88aaff','#fff','#aaddff'],8,5);
      }
      p.lastKeyA=curFrame;
    }
    if(keys['KeyD']&&!p._prevKeyD){
      if(curFrame-p.lastKeyD<15){
        p.vx=8; spawnP(p.x,p.y,['#88aaff','#fff','#aaddff'],8,5);
      }
      p.lastKeyD=curFrame;
    }
    p._prevKeyA=keys['KeyA'];
    p._prevKeyD=keys['KeyD'];
  } else {
    if(keys['ArrowLeft']&&!p._prevKeyA){
      if(curFrame-p.lastKeyA<15){
        p.vx=-8; spawnP(p.x,p.y,['#ffaaaa','#fff','#ffdddd'],8,5);
      }
      p.lastKeyA=curFrame;
    }
    if(keys['ArrowRight']&&!p._prevKeyD){
      if(curFrame-p.lastKeyD<15){
        p.vx=8; spawnP(p.x,p.y,['#ffaaaa','#fff','#ffdddd'],8,5);
      }
      p.lastKeyD=curFrame;
    }
    p._prevKeyA=keys['ArrowLeft'];
    p._prevKeyD=keys['ArrowRight'];
  }
}

// ── GAME LOOP ───────────────────────────────────────────────────────────────
function updateGame(){
  if(gameover||goalFlash>50) return;

  // Dash trick
  handleDash(p1,true);

  // Charged shot: build charge while S held
  updatePlayer(p1,keys['KeyW'],keys['KeyS'],keys['KeyA'],keys['KeyD'],keys['KeyS']);

  // Fire charged shot on S key release
  if(keysUp['KeyS'] && p1.charge>0){
    fireChargedShot(p1);
  } else if(!keys['KeyS'] && !p1.isCharging && p1.charge>0){
    // release with very low charge: just do a normal kick
    p1.charge=0;
  }

  updateAI(p2,LEVELS[curLevel]);
  collidePB(p1);collidePB(p2);
  updateBall();
  tickPowerups();
  tickCombo();
  frames++;
  if(frames%60===0&&timeLeft>0){ timeLeft--; if(timeLeft===0) endGame(); }
  tickP();tickShk();tickCrowd(goalFlash>150);
}

  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText('GOAL!',W/2+3,H/2-10+3);
  ctx.fillStyle=col;ctx.fillText('GOAL!',W/2,H/2-10);
  ctx.font='bold 28px Arial';ctx.fillStyle='#fff';ctx.fillText(goalTeam===0?'YOU score!':'ROBOT scores!',W/2,H/2+45);
  ctx.font='bold 26px Arial';ctx.fillStyle='#ffcc00';ctx.fillText(`${score[0]}  :  ${score[1]}`,W/2,H/2+85);
}

// ── LEVEL SELECT ────────────────────────────────────────────────────────────
let lvScroll=0;
function drawLevelSelect(){
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#060c18');bg.addColorStop(1,'#0e1a0e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.font='bold 36px Arial';ctx.textAlign='center';ctx.fillStyle='#66ee44';ctx.fillText('⚽  LEVEL SELECT',W/2,44);
  ctx.font='15px Arial';ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillText(`🪙 Complete levels to unlock more`,W/2,68);

  const cols=5, gap=14;
  const cardW=Math.floor((W-gap*6)/cols);
  const cardH=120;
  const startX=gap;
  const startY=90;

  LEVELS.forEach((lv,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const cx=startX+col*(cardW+gap), cy=startY+row*(cardH+gap);
    const unlocked=i<=save.unlocked;
    const stars=save.stars[i]||0;
    const hover=unlocked&&mx>=cx&&mx<=cx+cardW&&my>=cy&&my<=cy+cardH;

    ctx.fillStyle=unlocked?(hover?lv.col+'cc':lv.col+'88'):'#1a1a2a';
    ctx.beginPath();ctx.roundRect(cx,cy,cardW,cardH,12);ctx.fill();
    ctx.strokeStyle=unlocked?(hover?'#fff':'rgba(255,255,255,.3)'):'rgba(255,255,255,.1)';
    ctx.lineWidth=hover?3:1.5;ctx.beginPath();ctx.roundRect(cx,cy,cardW,cardH,12);ctx.stroke();

    if(unlocked){
      ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.15)';
      ctx.fillText(i+1,cx+cardW*.5,cy+42);
      ctx.font='bold 13px Arial';ctx.fillStyle='#fff';
      ctx.fillText(lv.name,cx+cardW/2,cy+28);
      ctx.font='11px Arial';ctx.fillStyle='rgba(255,255,255,.6)';
      ctx.fillText(lv.sub,cx+cardW/2,cy+46);
      const dc=DIFF_COLS[lv.diff]||'#888';
      ctx.fillStyle=dc+'cc';ctx.beginPath();ctx.roundRect(cx+8,cy+56,cardW-16,20,6);ctx.fill();
      ctx.font='bold 11px Arial';ctx.fillStyle='#fff';ctx.fillText(lv.diff,cx+cardW/2,cy+70);
      const starY=cy+cardH-18;
      for(let s=0;s<3;s++){
        ctx.font='16px Arial';ctx.fillStyle=s<stars?'#ffcc00':'rgba(255,255,255,.2)';
        ctx.fillText('★',cx+cardW/2-16+s*16,starY);
      }
      if(jclick&&hover) startLevel(i);
    } else {
      ctx.font='28px Arial';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText('🔒',cx+cardW/2,cy+52);
      ctx.font='bold 12px Arial';ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText(lv.name,cx+cardW/2,cy+80);
      ctx.font='10px Arial';ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillText('Complete previous level',cx+cardW/2,cy+96);
    }
  });

  ctx.fillStyle=mx>=18&&mx<=118&&my>=H-52&&my<=H-12?'#445':'#334';
  ctx.beginPath();ctx.roundRect(18,H-52,100,40,10);ctx.fill();
  ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('← Menu',68,H-26);
  if(jclick&&mx>=18&&mx<=118&&my>=H-52&&my<=H-12) G.screen='menu';
}

// ── RESULT SCREEN ───────────────────────────────────────────────────────────
function drawResult(){
  if(bgC) ctx.drawImage(bgC,0,0);
  ctx.fillStyle='rgba(0,0,0,.88)';ctx.fillRect(0,0,W,H);
  const won=G.resultWon, stars=G.resultStars, sc=G.resultScore;
  ctx.font='bold 58px Arial';ctx.textAlign='center';
  ctx.fillStyle=won?'#ffcc00':'#ff4444';
  ctx.fillText(won?'YOU WIN! 🏆':'YOU LOST',W/2,H*.28);
  ctx.font='bold 22px Arial';ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.fillText(LEVELS[curLevel]?LEVELS[curLevel].name:'2-Player',W/2,H*.35);
  ctx.font='bold 64px Arial';ctx.fillStyle='#fff';
  ctx.fillText(`${sc[0]}  -  ${sc[1]}`,W/2,H*.48);
  if(won){
    for(let s=0;s<3;s++){
      const lit=s<stars;
      ctx.font=`${lit?52:40}px Arial`;
      ctx.fillStyle=lit?'#ffcc00':'rgba(255,255,255,.2)';
      ctx.fillText('★',W/2-52+s*52,H*.63);
    }
    ctx.font='bold 16px Arial';ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.fillText(stars===3?'PERFECT!':stars===2?'Great job!':'You made it!',W/2,H*.68);
  } else {
    ctx.font='bold 18px Arial';ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText('Don\'t give up — try again!',W/2,H*.58);
  }
  // Combo achievement
  if(G.resultMaxCombo>=3){
    ctx.font='bold 15px Arial';ctx.fillStyle='#ffcc00';ctx.textAlign='center';
    ctx.fillText(`🔥 Max Combo: ${G.resultMaxCombo}x — Bonus star awarded!`,W/2,H*.72);
  }
  const nextId=curLevel+1;
  const hasNext=nextId<LEVELS.length&&nextId<=save.unlocked;
  const btnY=H*.75;
  if(hasNext){
    const bx=W/2-230;
    ctx.fillStyle=mx>=bx&&mx<=bx+200&&my>=btnY&&my<=btnY+52?'#22bb44':'#22aa44';
    ctx.beginPath();ctx.roundRect(bx,btnY,200,52,12);ctx.fill();
    ctx.font='bold 18px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('Next Level ▶',bx+100,btnY+33);
    if(jclick&&mx>=bx&&mx<=bx+200&&my>=btnY&&my<=btnY+52) startLevel(nextId);
  }
  const rbx=hasNext?W/2+30:W/2-100;
  ctx.fillStyle=mx>=rbx&&mx<=rbx+200&&my>=btnY&&my<=btnY+52?'#3a6aee':'#2255cc';
  ctx.beginPath();ctx.roundRect(rbx,btnY,200,52,12);ctx.fill();
  ctx.font='bold 18px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('Try Again 🔄',rbx+100,btnY+33);
  if(jclick&&mx>=rbx&&mx<=rbx+200&&my>=btnY&&my<=btnY+52) startLevel(curLevel);

  ctx.fillStyle=mx>=W/2-80&&mx<=W/2+80&&my>=btnY+64&&my<=btnY+104?'#445':'#334';
  ctx.beginPath();ctx.roundRect(W/2-80,btnY+64,160,40,10);ctx.fill();
  ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('Level Select',W/2,btnY+88);
  if(jclick&&mx>=W/2-80&&mx<=W/2+80&&my>=btnY+64&&my<=btnY+104) G.screen='levels';
}

// ── MENU ────────────────────────────────────────────────────────────────────
function drawMenu(){
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#06091a');bg.addColorStop(1,'#0e1a0e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(bgC) ctx.drawImage(bgC,0,0);
  drawCrowd();drawGoals();
  if(p1)drawPlayer(p1);if(p2)drawPlayer(p2);

  ctx.fillStyle='rgba(0,0,0,.7)';ctx.beginPath();ctx.roundRect(W/2-260,H*.07,520,110,18);ctx.fill();
  ctx.strokeStyle='rgba(100,200,100,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W/2-260,H*.07,520,110,18);ctx.stroke();
  ctx.font='bold 64px Arial';ctx.textAlign='center';
  ctx.fillStyle='rgba(0,180,0,.25)';ctx.fillText('⚽  SOCCER',W/2+3,H*.07+76+3);
  ctx.fillStyle='#66ee44';ctx.fillText('⚽  SOCCER',W/2,H*.07+76);
  ctx.font='bold 17px Arial';ctx.fillStyle='#aaa';ctx.fillText('Ryan & Nathan Edition',W/2,H*.07+102);

  const b1y=H*.52;
  ctx.fillStyle=mx>=W/2-145&&mx<=W/2+145&&my>=b1y&&my<=b1y+62?'#2a55dd':'#2244bb';
  ctx.beginPath();ctx.roundRect(W/2-145,b1y,290,62,14);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W/2-145,b1y,290,62,14);ctx.stroke();
  ctx.font='bold 22px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('🎮  Play Levels',W/2,b1y+38);
  if(jclick&&mx>=W/2-145&&mx<=W/2+145&&my>=b1y&&my<=b1y+62) G.screen='levels';

  const b2y=b1y+78;
  ctx.fillStyle=mx>=W/2-130&&mx<=W/2+130&&my>=b2y&&my<=b2y+54?'#1a8a1a':'#1a7a1a';
  ctx.beginPath();ctx.roundRect(W/2-130,b2y,260,54,14);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W/2-130,b2y,260,54,14);ctx.stroke();
  ctx.font='bold 20px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('🧑‍🤝‍🧑  2 Players (No AI)',W/2,b2y+34);
  if(jclick&&mx>=W/2-130&&mx<=W/2+130&&my>=b2y&&my<=b2y+54) startTwoPlayer();

  ctx.font='12px Arial';ctx.fillStyle='rgba(255,255,255,.28)';ctx.textAlign='center';
  ctx.fillText('A D run  •  W jump  •  S charge-kick  •  DD=dash  |  ← → run  •  ↑ jump  •  ↓ kick',W/2,H-8);
}

// ── 2-PLAYER MODE ─────────────────────────────────────────────────────────
let twoPlayer=false;
function startTwoPlayer(){
  twoPlayer=true;curLevel=-1;score=[0,0];timeLeft=120;frames=0;gameover=false;goalFlash=0;parts=[];
  powerups=[]; puSpawnTimer=0; ballScale=1; ballScaleTimer=0;
  resetCombo();
  buildBG('#001122');resetPos(1);G.screen='twoplayer';
}
function updateTwoPlayer(){
  if(gameover||goalFlash>50) return;

  handleDash(p1,true);
  handleDash(p2,false);

  updatePlayer(p1,keys['KeyW'],keys['KeyS'],keys['KeyA'],keys['KeyD'],keys['KeyS']);
  updatePlayer(p2,keys['ArrowUp'],keys['ArrowDown'],keys['ArrowLeft'],keys['ArrowRight'],keys['ArrowDown']);

  // Charged shot release for p1
  if(keysUp['KeyS'] && p1.charge>0) fireChargedShot(p1);
  else if(!keys['KeyS'] && !p1.isCharging && p1.charge>0) p1.charge=0;

  // Charged shot release for p2
  if(keysUp['ArrowDown'] && p2.charge>0) fireChargedShot(p2);
  else if(!keys['ArrowDown'] && !p2.isCharging && p2.charge>0) p2.charge=0;

  collidePB(p1);collidePB(p2);updateBall();
  tickPowerups();
  tickCombo();
  frames++;
  if(frames%60===0&&timeLeft>0){
    timeLeft--;
    if(timeLeft===0){
      G.resultWon=score[0]>score[1];G.resultStars=0;G.resultScore=[...score];
      G.resultMaxCombo=maxComboReached;
      G.screen='result';gameover=true;
    }
  }
  tickP();tickShk();tickCrowd(goalFlash>150);
}
function drawTwoPlayerHUD(){
  ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,42);
  ctx.fillStyle=TLIT[0];ctx.font='bold 14px Arial';ctx.textAlign='left';ctx.fillText('P1 (WASD)',14,26);
  ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.fillText(score[0],135,30);
  ctx.fillStyle=TLIT[1];ctx.font='bold 14px Arial';ctx.textAlign='right';ctx.fillText('P2 (ARROWS)',W-14,26);
  ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.fillText(score[1],W-135,30);
  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  ctx.textAlign='center';ctx.fillStyle=timeLeft<=15?'#ff4444':'#fff';ctx.font='bold 22px Arial';
  ctx.fillText(`${m}:${s<10?'0':''}${s}`,W/2,28);
}

// ── MAIN LOOP ────────────────────────────────────────────────────────────────
let frame=0;
function loop(){
  requestAnimationFrame(loop);
  frame++;ctx.clearRect(0,0,W,H);
  ctx.save();if(shk.t>.5)ctx.translate(shk.x,shk.y);
  try{

  if(G.screen==='menu'){
    tickCrowd(false);drawMenu();
  } else if(G.screen==='levels'){
    drawLevelSelect();
  } else if(G.screen==='tutorial'){
    updateTutorial();drawTutorial();
    if(goalFlash>0) drawGoalOverlay();
  } else if(G.screen==='game'){
    updateGame();
    if(bgC)ctx.drawImage(bgC,0,0);
    drawCrowd();drawGoals();
    drawP(); // particles behind ball
    drawPowerups();
    drawPlayer(p1);drawPlayer(p2);drawBall();
    drawElectricFlash();
    drawHUD();drawGoalOverlay();
    drawCombo();
  } else if(G.screen==='twoplayer'){
    updateTwoPlayer();
    if(bgC)ctx.drawImage(bgC,0,0);
    drawCrowd();drawGoals();
    drawP();
    drawPowerups();
    drawPlayer(p1);drawPlayer(p2);drawBall();
    drawElectricFlash();
    drawTwoPlayerHUD();drawGoalOverlay();
    drawCombo();
  } else if(G.screen==='result'){
    drawResult();drawP();
  }

  }catch(e){console.error('loop error:',e);}
  ctx.restore();
  // Clear one-shot key-up events after processing
  for(const k in keysUp) delete keysUp[k];
  jclick=false;
}

// ── BOOT ────────────────────────────────────────────────────────────────────
buildBG('#001a00');resetPos(0);G.screen='menu';
loop();
</script>
