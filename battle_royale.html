<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Battle Royale</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { display:block; cursor:none; }
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;

// Game state
let state = 'menu'; // menu, playing, dead, won
let gameTime = 0;
let kills = 0;
let placement = 20;

// Map
const MAP = 3000;
const cam = { x: 0, y: 0 };

// Weapons
const WEAPONS = [
  { name: 'Pistol',   damage: 25, fireRate: 0.5,  range: 400, speed: 700, spread: 0.05, ammo: 12, maxAmmo: 12, color: '#aaa',  bulletColor: '#ff8' },
  { name: 'Shotgun',  damage: 60, fireRate: 1.2,  range: 200, speed: 600, spread: 0.25, ammo: 6,  maxAmmo: 6,  color: '#c84', bulletColor: '#fa4', pellets: 5 },
  { name: 'AR',       damage: 18, fireRate: 0.12, range: 600, speed: 900, spread: 0.03, ammo: 30, maxAmmo: 30, color: '#48c', bulletColor: '#8ef' },
];

// Player
const player = {
  x: MAP/2, y: MAP/2, r: 14,
  hp: 100, shield: 50, maxHp: 100, maxShield: 50,
  speed: 220, angle: 0,
  weapon: { ...WEAPONS[0] }, weapons: [{ ...WEAPONS[0] }],
  weaponIdx: 0, fireCooldown: 0,
  color: '#4af', alive: true,
  reloading: false, reloadTime: 0
};

// Map features
const trees = [], rocks = [], buildings = [];
function genMap() {
  for (let i = 0; i < 300; i++) trees.push({ x: Math.random()*MAP, y: Math.random()*MAP, r: 15+Math.random()*20 });
  for (let i = 0; i < 120; i++) rocks.push({ x: Math.random()*MAP, y: Math.random()*MAP, w: 20+Math.random()*40, h: 15+Math.random()*30 });
  for (let i = 0; i < 40; i++) buildings.push({ x: Math.random()*(MAP-200)+100, y: Math.random()*(MAP-200)+100, w: 60+Math.random()*100, h: 60+Math.random()*80 });
}
genMap();

// Loot
const lootItems = [];
function genLoot() {
  for (let i = 0; i < 50; i++) {
    const types = ['weapon', 'weapon', 'shield', 'health'];
    const type = types[Math.floor(Math.random()*types.length)];
    lootItems.push({
      x: Math.random()*MAP, y: Math.random()*MAP,
      type, picked: false,
      weaponType: type === 'weapon' ? Math.floor(Math.random()*3) : 0
    });
  }
}
genLoot();

// Enemies
const enemies = [];
function spawnEnemies() {
  const colors = ['#f44','#f84','#f4f','#ff4','#4ff','#fa4','#8f4','#f48','#84f','#4f8','#fff','#f8a','#af8','#8af','#fa8','#a4f','#4fa','#ff8','#8ff','#f4a'];
  for (let i = 0; i < 19; i++) {
    let ex, ey;
    do { ex = Math.random()*MAP; ey = Math.random()*MAP; } while (Math.hypot(ex - MAP/2, ey - MAP/2) < 300);
    enemies.push({
      x: ex, y: ey, r: 13,
      hp: 60 + Math.random()*60, maxHp: 120,
      speed: 80 + Math.random()*60,
      angle: Math.random()*Math.PI*2,
      color: colors[i], num: i+2,
      alive: true, fireCooldown: Math.random()*2,
      weapon: { ...WEAPONS[Math.floor(Math.random()*3)] },
      state: 'wander', wanderAngle: Math.random()*Math.PI*2,
      wanderTimer: 2 + Math.random()*3,
      stormDead: false
    });
  }
}
spawnEnemies();

// Bullets
const bullets = [];
function shoot(src, angle, isPlayer) {
  const w = src.weapon;
  if (w.ammo <= 0) { if (isPlayer) startReload(); return; }
  if (src.fireCooldown > 0) return;
  w.ammo--;
  src.fireCooldown = w.fireRate;
  playSound('shoot', w === WEAPONS[1] ? 'shotgun' : w === WEAPONS[2] ? 'ar' : 'pistol');
  const pellets = w.pellets || 1;
  for (let p = 0; p < pellets; p++) {
    const spread = (Math.random()-0.5) * w.spread;
    bullets.push({
      x: src.x, y: src.y,
      vx: Math.cos(angle + spread) * w.speed,
      vy: Math.sin(angle + spread) * w.speed,
      damage: w.damage / pellets,
      range: w.range, dist: 0,
      isPlayer, color: w.bulletColor, r: 3, alive: true
    });
  }
}

// Storm
const storm = { cx: MAP/2, cy: MAP/2, r: MAP*0.7, targetR: 100, shrinkRate: 0, damage: 0.5 };
let stormPhase = 0;
const stormPhases = [
  { duration: 30, targetR: MAP*0.5, shrinkRate: 0 },
  { duration: 20, targetR: MAP*0.35, shrinkRate: 0 },
  { duration: 15, targetR: MAP*0.2, shrinkRate: 0 },
  { duration: 10, targetR: MAP*0.1, shrinkRate: 0 },
  { duration: 8,  targetR: 50, shrinkRate: 0 },
];
let phaseTimer = stormPhases[0].duration;

// Particles
const particles = [];
function spawnHit(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    const a = Math.random()*Math.PI*2, spd = 50+Math.random()*150;
    particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, life: 1, color, r: 2+Math.random()*3 });
  }
}
function spawnDeath(x, y, color) {
  for (let i = 0; i < 20; i++) {
    const a = Math.random()*Math.PI*2, spd = 80+Math.random()*200;
    particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, life: 1.5, color, r: 3+Math.random()*5, expand: true });
  }
}

// Damage numbers
const dmgNumbers = [];

// Input
const keys = {};
const mouse = { x: W/2, y: H/2, down: false };
document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; keys[e.code] = true; });
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; keys[e.code] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mousedown', e => { mouse.down = true; });
canvas.addEventListener('mouseup', e => { mouse.down = false; });
canvas.addEventListener('click', () => {
  if (state === 'menu') startGame();
  else if (state === 'dead' || state === 'won') { state = 'menu'; }
});

let screenShake = 0;

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(cat, type) {
  audioCtx.resume();
  const g = audioCtx.createGain(); g.connect(audioCtx.destination);
  const o = audioCtx.createOscillator(); o.connect(g);
  if (cat === 'shoot') {
    if (type === 'shotgun') {
      const noise = audioCtx.createBufferSource();
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.15, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
      noise.buffer = buf;
      const ng = audioCtx.createGain(); ng.gain.setValueAtTime(0.4, audioCtx.currentTime);
      noise.connect(ng); ng.connect(audioCtx.destination); noise.start(); return;
    }
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(type === 'ar' ? 800 : 300, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    o.start(); o.stop(audioCtx.currentTime + 0.1);
  } else if (cat === 'hit') {
    o.type = 'sine'; o.frequency.setValueAtTime(400, audioCtx.currentTime);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    o.start(); o.stop(audioCtx.currentTime + 0.08);
  } else if (cat === 'elim') {
    o.type = 'square';
    o.frequency.setValueAtTime(300, audioCtx.currentTime);
    o.frequency.setValueAtTime(500, audioCtx.currentTime + 0.1);
    o.frequency.setValueAtTime(700, audioCtx.currentTime + 0.2);
    g.gain.setValueAtTime(0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    o.start(); o.stop(audioCtx.currentTime + 0.3);
  } else if (cat === 'storm') {
    o.type = 'sine'; o.frequency.setValueAtTime(60, audioCtx.currentTime);
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    o.start(); o.stop(audioCtx.currentTime + 0.2);
  } else if (cat === 'loot') {
    o.type = 'sine'; o.frequency.setValueAtTime(600, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    o.start(); o.stop(audioCtx.currentTime + 0.15);
  }
}

let reloadTimer = 0;
function startReload() {
  if (player.reloading) return;
  player.reloading = true;
  reloadTimer = 1.5;
}

// Notification messages
const notifications = [];
function addNotif(text, color) {
  notifications.push({ text, color: color||'#fff', life: 3, y: 0 });
}

function startGame() {
  state = 'playing';
  gameTime = 0; kills = 0; placement = 20;
  player.hp = 100; player.shield = 50; player.alive = true;
  player.x = MAP/2; player.y = MAP/2;
  player.weapons = [{ ...WEAPONS[0] }]; player.weaponIdx = 0; player.weapon = player.weapons[0];
  player.fireCooldown = 0; player.reloading = false;
  enemies.length = 0; bullets.length = 0; particles.length = 0;
  lootItems.forEach(l => l.picked = false);
  spawnEnemies();
  stormPhase = 0; phaseTimer = stormPhases[0].duration;
  storm.r = MAP*0.7; storm.cx = MAP/2; storm.cy = MAP/2;
  notifications.length = 0;
  addNotif('Battle Royale — Last one standing wins!', '#4af');
}

function solidAt(x, y, r) {
  for (const b of buildings) {
    if (x+r > b.x && x-r < b.x+b.w && y+r > b.y && y-r < b.y+b.h) return true;
  }
  return false;
}

let lastTime = performance.now();
function update(dt) {
  if (state !== 'playing') return;
  gameTime += dt;
  screenShake = Math.max(0, screenShake - dt * 5);

  // Storm update
  phaseTimer -= dt;
  if (phaseTimer <= 0 && stormPhase < stormPhases.length - 1) {
    stormPhase++;
    phaseTimer = stormPhases[stormPhase].duration;
    addNotif('⚠️ Storm closing in!', '#f84');
  }
  const targetR = stormPhases[Math.min(stormPhase, stormPhases.length-1)].targetR;
  storm.r += (targetR - storm.r) * dt * 0.15;

  // Player move
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup'])    my -= 1;
  if (keys['s'] || keys['arrowdown'])  my += 1;
  if (keys['a'] || keys['arrowleft'])  mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (mx || my) {
    const len = Math.sqrt(mx*mx+my*my);
    const nx = player.x + mx/len * player.speed * dt;
    const ny = player.y + my/len * player.speed * dt;
    if (!solidAt(nx, player.y, player.r)) player.x = Math.max(0, Math.min(MAP, nx));
    if (!solidAt(player.x, ny, player.r)) player.y = Math.max(0, Math.min(MAP, ny));
  }

  // Camera
  cam.x = player.x - W/2;
  cam.y = player.y - H/2;

  // Player aim
  const wx = mouse.x + cam.x, wy = mouse.y + cam.y;
  player.angle = Math.atan2(wy - player.y, wx - player.x);

  // Shoot
  player.fireCooldown = Math.max(0, player.fireCooldown - dt);
  if (mouse.down && !player.reloading) shoot(player, player.angle, true);

  // Reload
  if (keys['r'] && !player.reloading) startReload();
  if (player.reloading) {
    reloadTimer -= dt;
    if (reloadTimer <= 0) {
      player.weapon.ammo = player.weapon.maxAmmo;
      player.reloading = false;
    }
  }

  // Weapon switch
  if (keys['1'] && player.weapons[0]) { player.weaponIdx = 0; player.weapon = player.weapons[0]; }
  if (keys['2'] && player.weapons[1]) { player.weaponIdx = 1; player.weapon = player.weapons[1]; }

  // Loot pickup
  for (const l of lootItems) {
    if (l.picked) continue;
    if (Math.hypot(l.x - player.x, l.y - player.y) < 30) {
      l.picked = true;
      playSound('loot');
      if (l.type === 'health') {
        player.hp = Math.min(player.maxHp, player.hp + 40);
        addNotif('+40 HP', '#4f4');
      } else if (l.type === 'shield') {
        player.shield = Math.min(player.maxShield, player.shield + 25);
        addNotif('+25 Shield', '#48f');
      } else {
        const w = { ...WEAPONS[l.weaponType] };
        if (player.weapons.length < 2) player.weapons.push(w);
        else player.weapons[player.weaponIdx] = w;
        player.weapon = player.weapons[player.weaponIdx];
        addNotif('Picked up ' + w.name, '#ff4');
      }
    }
  }

  // Player storm damage
  const distToCenter = Math.hypot(player.x - storm.cx, player.y - storm.cy);
  if (distToCenter > storm.r) {
    const dmg = storm.damage * dt * 30;
    if (player.shield > 0) player.shield = Math.max(0, player.shield - dmg);
    else { player.hp -= dmg; screenShake = 0.3; playSound('storm'); }
    if (player.hp <= 0) {
      player.alive = false;
      state = 'dead';
      const alive = enemies.filter(e => e.alive).length;
      placement = alive + 1;
    }
  }

  // Update enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    e.fireCooldown = Math.max(0, e.fireCooldown - dt);

    const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);

    // AI state machine
    if (distToPlayer < 400) e.state = 'chase';
    else if (e.state === 'chase' && distToPlayer > 500) e.state = 'wander';

    if (e.state === 'wander') {
      e.wanderTimer -= dt;
      if (e.wanderTimer <= 0) { e.wanderAngle = Math.random()*Math.PI*2; e.wanderTimer = 2+Math.random()*3; }
      const nx = e.x + Math.cos(e.wanderAngle) * e.speed * 0.5 * dt;
      const ny = e.y + Math.sin(e.wanderAngle) * e.speed * 0.5 * dt;
      if (!solidAt(nx, e.y, e.r)) e.x = Math.max(0, Math.min(MAP, nx));
      if (!solidAt(e.x, ny, e.r)) e.y = Math.max(0, Math.min(MAP, ny));
    } else {
      // Chase player
      const angleToPlayer = Math.atan2(player.y - e.y, player.x - e.x);
      e.angle = angleToPlayer;
      if (distToPlayer > 150) {
        const nx = e.x + Math.cos(angleToPlayer) * e.speed * dt;
        const ny = e.y + Math.sin(angleToPlayer) * e.speed * dt;
        if (!solidAt(nx, e.y, e.r)) e.x = Math.max(0, Math.min(MAP, nx));
        if (!solidAt(e.x, ny, e.r)) e.y = Math.max(0, Math.min(MAP, ny));
      }
      // Shoot at player
      if (distToPlayer < (e.weapon.range || 400) && player.alive) {
        shoot(e, angleToPlayer + (Math.random()-0.5)*0.2, false);
      }
    }

    // Storm damage to enemies
    const eDist = Math.hypot(e.x - storm.cx, e.y - storm.cy);
    if (eDist > storm.r) {
      e.hp -= storm.damage * dt * 25;
      if (e.hp <= 0 && e.alive) {
        e.alive = false;
        spawnDeath(e.x, e.y, e.color);
        placement = Math.max(1, placement - 1);
      }
    }
  }

  // Check win
  if (enemies.every(e => !e.alive) && player.alive) {
    state = 'won';
    playSound('elim');
  }

  // Update bullets
  for (const b of bullets) {
    if (!b.alive) continue;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.dist += Math.hypot(b.vx * dt, b.vy * dt);
    if (b.dist > b.range || b.x < 0 || b.x > MAP || b.y < 0 || b.y > MAP) { b.alive = false; continue; }

    // Hit buildings
    if (solidAt(b.x, b.y, 1)) {
      spawnHit(b.x, b.y, '#888', 3);
      b.alive = false; continue;
    }

    if (b.isPlayer) {
      for (const e of enemies) {
        if (!e.alive) continue;
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
          b.alive = false;
          e.hp -= b.damage;
          spawnHit(b.x, b.y, e.color);
          dmgNumbers.push({ x: e.x, y: e.y - 20, val: Math.round(b.damage), life: 1.2, vy: -40 });
          playSound('hit');
          if (e.hp <= 0) {
            e.alive = false; kills++;
            spawnDeath(e.x, e.y, e.color);
            placement = Math.max(1, placement - 1);
            addNotif(`💀 Eliminated #${e.num} — ${placement} remain`, '#ff4');
            playSound('elim');
          }
          break;
        }
      }
    } else if (player.alive) {
      if (Math.hypot(b.x - player.x, b.y - player.y) < player.r + b.r) {
        b.alive = false;
        const dmg = b.damage;
        if (player.shield > 0) {
          const shDmg = Math.min(player.shield, dmg);
          player.shield -= shDmg;
          const hpDmg = dmg - shDmg;
          player.hp -= hpDmg;
        } else player.hp -= dmg;
        screenShake = 0.5;
        spawnHit(b.x, b.y, '#f44');
        playSound('hit');
        if (player.hp <= 0) {
          player.alive = false; player.hp = 0;
          state = 'dead';
          const alive = enemies.filter(e => e.alive).length;
          placement = alive + 1;
        }
      }
    }
  }

  // Update particles
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= dt; if (p.life <= 0) particles.splice(i, 1);
    if (p.expand) p.r += dt * 20;
  }

  // Damage numbers
  for (let i = dmgNumbers.length-1; i >= 0; i--) {
    const d = dmgNumbers[i];
    d.y += d.vy * dt; d.life -= dt; if (d.life <= 0) dmgNumbers.splice(i, 1);
  }

  // Notifications
  for (let i = notifications.length-1; i >= 0; i--) {
    notifications[i].life -= dt; if (notifications[i].life <= 0) notifications.splice(i, 1);
  }
}

function s2w(sx, sy) { return { x: sx + cam.x, y: sy + cam.y }; }
function w2s(wx, wy) { return { x: wx - cam.x, y: wy - cam.y }; }

function drawMap() {
  // Background
  ctx.fillStyle = '#2d5a27';
  ctx.fillRect(0, 0, W, H);

  // Ground details (grid)
  ctx.strokeStyle = 'rgba(0,0,0,0.05)';
  ctx.lineWidth = 1;
  const gs = 100;
  const ox = (-cam.x % gs + gs) % gs;
  const oy = (-cam.y % gs + gs) % gs;
  for (let x = ox; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = oy; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Buildings
  for (const b of buildings) {
    const s = w2s(b.x, b.y);
    if (s.x + b.w < 0 || s.x > W || s.y + b.h < 0 || s.y > H) continue;
    ctx.fillStyle = '#888'; ctx.fillRect(s.x, s.y, b.w, b.h);
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.strokeRect(s.x, s.y, b.w, b.h);
    // Windows
    ctx.fillStyle = '#aad';
    for (let wx2 = 8; wx2 < b.w - 8; wx2 += 20) {
      for (let wy2 = 8; wy2 < b.h - 8; wy2 += 20) {
        ctx.fillRect(s.x + wx2, s.y + wy2, 10, 10);
      }
    }
  }

  // Rocks
  for (const r of rocks) {
    const s = w2s(r.x, r.y);
    if (s.x+r.w < 0 || s.x > W || s.y+r.h < 0 || s.y > H) continue;
    ctx.fillStyle = '#7a7060';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, r.w/2, r.h/2, 0, 0, Math.PI*2); ctx.fill();
  }

  // Trees
  for (const t of trees) {
    const s = w2s(t.x, t.y);
    if (s.x+t.r < 0 || s.x-t.r > W || s.y+t.r < 0 || s.y-t.r > H) continue;
    ctx.fillStyle = '#1a4d0f';
    ctx.beginPath(); ctx.arc(s.x, s.y, t.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a6e1f';
    ctx.beginPath(); ctx.arc(s.x-3, s.y-3, t.r*0.7, 0, Math.PI*2); ctx.fill();
  }

  // Loot
  for (const l of lootItems) {
    if (l.picked) continue;
    const s = w2s(l.x, l.y);
    if (s.x < -20 || s.x > W+20 || s.y < -20 || s.y > H+20) continue;
    ctx.fillStyle = l.type === 'weapon' ? '#ff4' : l.type === 'shield' ? '#48f' : '#4f4';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(l.type === 'weapon' ? '🔫' : l.type === 'shield' ? '🛡' : '❤', s.x, s.y);
    ctx.textBaseline = 'alphabetic';
  }
}

function drawEntities() {
  // Bullets
  for (const b of bullets) {
    if (!b.alive) continue;
    const s = w2s(b.x, b.y);
    if (s.x < -10 || s.x > W+10 || s.y < -10 || s.y > H+10) continue;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, b.r, 0, Math.PI*2); ctx.fill();
    // Trail
    ctx.strokeStyle = b.color; ctx.lineWidth = 1; ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - Math.cos(Math.atan2(b.vy,b.vx))*12, s.y - Math.sin(Math.atan2(b.vy,b.vx))*12); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Particles
  for (const p of particles) {
    const s = w2s(p.x, p.y);
    ctx.globalAlpha = Math.max(0, p.life * 0.7);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(0.1, p.r), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Damage numbers
  for (const d of dmgNumbers) {
    const s = w2s(d.x, d.y);
    ctx.globalAlpha = Math.min(1, d.life);
    ctx.fillStyle = '#ff4'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
    ctx.fillText(d.val, s.x, s.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  // Enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    const s = w2s(e.x, e.y);
    if (s.x < -30 || s.x > W+30 || s.y < -30 || s.y > H+30) continue;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(s.x+2, s.y+4, e.r*0.8, e.r*0.4, 0, 0, Math.PI*2); ctx.fill();

    // Body
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, e.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();

    // Direction indicator
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + Math.cos(e.angle)*e.r*1.5, s.y + Math.sin(e.angle)*e.r*1.5); ctx.stroke();

    // Number
    ctx.fillStyle = '#000'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(e.num, s.x, s.y);
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';

    // HP bar
    const bw = 30, bh = 4;
    ctx.fillStyle = '#333'; ctx.fillRect(s.x - bw/2, s.y - e.r - 10, bw, bh);
    ctx.fillStyle = e.hp/e.maxHp > 0.5 ? '#4f4' : e.hp/e.maxHp > 0.25 ? '#ff4' : '#f44';
    ctx.fillRect(s.x - bw/2, s.y - e.r - 10, bw * Math.max(0, e.hp/e.maxHp), bh);
  }

  // Player
  if (player.alive) {
    const s = w2s(player.x, player.y);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(s.x+2, s.y+4, player.r*0.8, player.r*0.4, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = player.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, player.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();

    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + Math.cos(player.angle)*player.r*1.8, s.y + Math.sin(player.angle)*player.r*1.8); ctx.stroke();

    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('YOU', s.x, s.y);
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  }
}

function drawStorm() {
  // Storm overlay
  const s = w2s(storm.cx, storm.cy);
  ctx.save();
  ctx.beginPath();
  ctx.arc(s.x, s.y, storm.r, 0, Math.PI*2);
  ctx.rect(W+1, -1, -(W+2), H+2); // outer rect to fill outside
  // Actually draw outside of storm circle
  ctx.save();
  ctx.fillStyle = 'rgba(120,0,180,0.18)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(s.x, s.y, storm.r, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // Storm border
  ctx.beginPath(); ctx.arc(s.x, s.y, storm.r, 0, Math.PI*2);
  ctx.strokeStyle = '#b040ff'; ctx.lineWidth = 3 + Math.sin(Date.now()*0.005)*1;
  ctx.stroke();
  ctx.restore();
}

function drawCrosshair() {
  const x = mouse.x, y = mouse.y;
  const gap = 8, len = 10;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x-gap-len, y); ctx.lineTo(x-gap, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+gap, y); ctx.lineTo(x+gap+len, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y-gap-len); ctx.lineTo(x, y-gap); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y+gap); ctx.lineTo(x, y+gap+len); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
}

function drawHUD() {
  // Health & Shield
  const bw = 200, bh = 16;
  const bx = 20, by = H - 70;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(bx-4, by-4, bw+8, bh*2+16);

  // Shield
  ctx.fillStyle = '#334'; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#48f'; ctx.fillRect(bx, by, bw * (player.shield/player.maxShield), bh);
  ctx.fillStyle = '#fff'; ctx.font = '12px monospace';
  ctx.fillText(`🛡 ${Math.round(player.shield)}`, bx+4, by+12);

  // HP
  ctx.fillStyle = '#433'; ctx.fillRect(bx, by+bh+4, bw, bh);
  const hpPct = player.hp / player.maxHp;
  ctx.fillStyle = hpPct > 0.5 ? '#4f4' : hpPct > 0.25 ? '#ff4' : '#f44';
  ctx.fillRect(bx, by+bh+4, bw * hpPct, bh);
  ctx.fillStyle = '#fff'; ctx.fillText(`❤ ${Math.round(player.hp)}`, bx+4, by+bh+16);

  // Weapon
  const w = player.weapon;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(W-180, H-60, 170, 50);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(w.name, W-14, H-40);
  if (player.reloading) {
    ctx.fillStyle = '#ff4';
    ctx.fillText(`Reloading... ${reloadTimer.toFixed(1)}s`, W-14, H-20);
  } else {
    ctx.fillStyle = w.ammo > 0 ? '#fff' : '#f44';
    ctx.fillText(`${w.ammo} / ${w.maxAmmo}`, W-14, H-20);
  }
  ctx.textAlign = 'left';

  // Kill count & placement
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(W-130, 10, 120, 60);
  ctx.fillStyle = '#ff4'; ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`#${placement}`, W-14, 35);
  ctx.fillStyle = '#fff'; ctx.font = '13px monospace';
  ctx.fillText(`Kills: ${kills}`, W-14, 58);
  ctx.textAlign = 'left';

  // Storm warning
  const playerDist = Math.hypot(player.x - storm.cx, player.y - storm.cy);
  if (playerDist > storm.r * 0.9) {
    ctx.fillStyle = `rgba(180,0,255,${0.5 + Math.sin(Date.now()*0.008)*0.3})`;
    ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.fillText('⚠ GET IN THE STORM CIRCLE ⚠', W/2, 30);
    ctx.textAlign = 'left';
  }

  // Notifications
  for (let i = 0; i < notifications.length; i++) {
    const n = notifications[i];
    ctx.globalAlpha = Math.min(1, n.life);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W/2-150, 60 + i*28, 300, 24);
    ctx.fillStyle = n.color; ctx.font = '14px monospace'; ctx.textAlign = 'center';
    ctx.fillText(n.text, W/2, 76 + i*28);
    ctx.textAlign = 'left';
  }
  ctx.globalAlpha = 1;

  // Minimap
  const mm = { x: W-110, y: 10, w: 100, h: 100 };
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(mm.x, mm.y, mm.w, mm.h);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.strokeRect(mm.x, mm.y, mm.w, mm.h);
  const mscale = mm.w / MAP;

  // Storm on minimap
  ctx.beginPath(); ctx.arc(mm.x + storm.cx*mscale, mm.y + storm.cy*mscale, storm.r*mscale, 0, Math.PI*2);
  ctx.strokeStyle = '#b040ff'; ctx.lineWidth = 1.5; ctx.stroke();

  // Enemies on minimap
  for (const e of enemies) {
    if (!e.alive) continue;
    ctx.fillStyle = e.color;
    ctx.fillRect(mm.x + e.x*mscale - 1.5, mm.y + e.y*mscale - 1.5, 3, 3);
  }

  // Player on minimap
  ctx.fillStyle = '#4af';
  ctx.beginPath(); ctx.arc(mm.x + player.x*mscale, mm.y + player.y*mscale, 3, 0, Math.PI*2); ctx.fill();
}

function drawMenu() {
  ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, W, H);
  // Background circles
  for (let i = 0; i < 30; i++) {
    ctx.fillStyle = `rgba(74,175,255,${0.05+Math.random()*0.05})`;
    ctx.beginPath(); ctx.arc(Math.random()*W, Math.random()*H, 10+Math.random()*40, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#4af'; ctx.font = 'bold 56px monospace'; ctx.textAlign = 'center';
  ctx.fillText('BATTLE', W/2, H/2 - 60);
  ctx.fillStyle = '#f44'; ctx.font = 'bold 56px monospace';
  ctx.fillText('ROYALE', W/2, H/2 - 0);
  ctx.fillStyle = '#fff'; ctx.font = '18px monospace';
  ctx.fillText('WASD = Move   Mouse = Aim   Click = Shoot', W/2, H/2 + 60);
  ctx.fillText('R = Reload   1/2 = Switch Weapon', W/2, H/2 + 90);
  ctx.fillStyle = '#ff4'; ctx.font = 'bold 22px monospace';
  ctx.fillText('[ Click to Drop In ]', W/2, H/2 + 140);
  ctx.textAlign = 'left';
}

function drawEndScreen(won) {
  ctx.fillStyle = won ? 'rgba(0,40,0,0.85)' : 'rgba(40,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if (won) {
    ctx.fillStyle = '#ff4'; ctx.font = 'bold 52px monospace';
    ctx.fillText('VICTORY ROYALE!', W/2, H/2 - 60);
    ctx.fillStyle = '#4f4';
  } else {
    ctx.fillStyle = '#f44'; ctx.font = 'bold 52px monospace';
    ctx.fillText('ELIMINATED', W/2, H/2 - 60);
    ctx.fillStyle = '#f84';
  }
  ctx.font = '22px monospace';
  ctx.fillText(`Placement: #${placement}   Kills: ${kills}`, W/2, H/2 + 10);
  ctx.fillStyle = '#fff'; ctx.font = '18px monospace';
  ctx.fillText(`Survived ${Math.floor(gameTime)}s`, W/2, H/2 + 50);
  ctx.fillStyle = '#aaa'; ctx.font = '16px monospace';
  ctx.fillText('Click to Play Again', W/2, H/2 + 100);
  ctx.textAlign = 'left';
}

function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  update(dt);

  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random()-0.5)*screenShake*12, (Math.random()-0.5)*screenShake*12);
  }

  if (state === 'menu') {
    drawMenu();
  } else if (state === 'playing' || state === 'dead' || state === 'won') {
    drawMap();
    drawStorm();
    drawEntities();
    drawCrosshair();
    drawHUD();
    if (state === 'dead') drawEndScreen(false);
    if (state === 'won') drawEndScreen(true);
  }
  ctx.restore();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
