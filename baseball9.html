<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball 9 — Ryan & Nathan</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = C.width  = Math.min(window.innerWidth,  900);
const H = C.height = Math.min(window.innerHeight, 640);

// ── HELPERS ────────────────────────────────────────────────────────────────
const lerp  = (a,b,t) => a+(b-a)*t;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const getP  = id => ROSTER.find(r=>r.id===id);
let frame = 0;

// ── ROSTER ─────────────────────────────────────────────────────────────────
const ROSTER = [
  {id:1,name:'Ryan',   pow:8,con:7,price:0,  skin:'#f5c5a0',hair:'#3d2b1f',uni:'#cc2222',acc:'#ffeeee'},
  {id:2,name:'Nathan', pow:6,con:9,price:0,  skin:'#f0d0a0',hair:'#111',   uni:'#2244cc',acc:'#eeeeff'},
  {id:3,name:'Big Mac',pow:10,con:5,price:100,skin:'#e8a070',hair:'#8b4513',uni:'#ff7700',acc:'#ffcc00'},
  {id:4,name:'Ghost',  pow:5,con:9,price:120,skin:'#d8d8d8',hair:'#eee',   uni:'#8822cc',acc:'#aaffaa'},
  {id:5,name:'Tank',   pow:9,con:6,price:180,skin:'#7a5545',hair:'#111',   uni:'#226622',acc:'#ccffcc'},
  {id:6,name:'Ace',    pow:7,con:9,price:250,skin:'#ffe0b0',hair:'#cc8800',uni:'#cc3388',acc:'#ffff88'},
  {id:7,name:'Blaze',  pow:8,con:8,price:300,skin:'#f5b095',hair:'#ff4400',uni:'#334499',acc:'#ff8800'},
  {id:8,name:'Iron',   pow:10,con:7,price:400,skin:'#999',  hair:'#333',   uni:'#445566',acc:'#88aaff'},
];
const AI_BOT = {pow:6,con:6,name:'Robo-9',skin:'#99ccff',hair:'#334',uni:'#223355',acc:'#44aaff'};

// ── SAVE ───────────────────────────────────────────────────────────────────
let save = JSON.parse(localStorage.getItem('b9v3') || 'null') || {coins:0, unlocked:[1,2]};
const persist = () => localStorage.setItem('b9v3', JSON.stringify(save));

// ── INPUT ──────────────────────────────────────────────────────────────────
let mx=0, my=0, jclick=false, spaceJust=false;
C.addEventListener('mousemove', e => {
  const r=C.getBoundingClientRect();
  mx=(e.clientX-r.left)*(W/r.width); my=(e.clientY-r.top)*(H/r.height);
});
C.addEventListener('click', () => jclick=true);
document.addEventListener('keydown', e => { if(e.code==='Space'&&!e.repeat){spaceJust=true;e.preventDefault();} });

// ── DRAW HELPERS ───────────────────────────────────────────────────────────
function rr(x,y,w,h,r,fill,stroke,lw=2){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
}
function tx(str,x,y,sz,col,align='center',bold=true){
  ctx.font=`${bold?'bold ':''}${sz}px Arial`; ctx.fillStyle=col; ctx.textAlign=align;
  ctx.fillText(str,x,y);
}
function stx(str,x,y,sz,col,sh='#000',align='center'){
  ctx.font=`bold ${sz}px Arial`; ctx.textAlign=align;
  ctx.fillStyle=sh; ctx.fillText(str,x+2,y+2);
  ctx.fillStyle=col; ctx.fillText(str,x,y);
}
function btnHit(x,y,w,h){ return jclick&&mx>=x&&mx<=x+w&&my>=y&&my<=y+h; }
function btn(label,x,y,w,h,fill,tc='#fff',sz=16){
  const hover=mx>=x&&mx<=x+w&&my>=y&&my<=y+h;
  rr(x,y,w,h,10,hover?lighten(fill):fill,'rgba(255,255,255,0.3)',2);
  tx(label,x+w/2,y+h/2+sz*0.36,sz,tc);
}
function lighten(hex){
  // Simple lightening - just return a slightly brighter version
  return hex;
}

// ── PERSPECTIVE FIELD ──────────────────────────────────────────────────────
const VP = {x:W/2, y:H*0.27};
function pp(fx,fy){ // field point: fx=0-1 (left-right), fy=0-1 (near-far)
  return {
    x: lerp(lerp(W*0.03,VP.x,fy), lerp(W*0.97,VP.x,fy), fx),
    y: lerp(H*0.93, VP.y, fy)
  };
}

// ── STADIUM ────────────────────────────────────────────────────────────────
const STAND_COLORS = ['#cc2222','#2244aa','#22aa44','#cc8800'];
let standSeats = [];
for(let i=0;i<120;i++) standSeats.push({x:(i*173+7)%W, y:H*0.1+(i*97+3)%(H*0.2), col:STAND_COLORS[i%4]});

function drawStadium(){
  // Night sky
  const sky=ctx.createLinearGradient(0,0,0,H*0.6);
  sky.addColorStop(0,'#06091a'); sky.addColorStop(0.5,'#0d1535'); sky.addColorStop(1,'#1a3060');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.6);
  // Stars
  ctx.fillStyle='rgba(255,255,255,0.7)';
  for(let i=0;i<55;i++){
    const sx=(i*173+7)%W, sy=(i*97+11)%(H*0.25);
    const twinkle=0.5+0.5*Math.sin(frame*0.04+i);
    ctx.globalAlpha=twinkle*0.8;
    ctx.beginPath(); ctx.arc(sx,sy,i%9===0?1.5:0.8,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // Upper stands
  const wL=pp(0,1), wR=pp(1,1);
  ctx.fillStyle='#111a2a';
  ctx.beginPath(); ctx.moveTo(0,H*0.24); ctx.lineTo(W,H*0.24); ctx.lineTo(W,wR.y); ctx.lineTo(0,wL.y); ctx.closePath(); ctx.fill();
  // Stand rows
  for(let row=0;row<10;row++){
    const ry=H*0.24+row*((wL.y-H*0.24)/11);
    ctx.fillStyle=`rgba(30,50,90,0.5)`; ctx.fillRect(0,ry,W,((wL.y-H*0.24)/11)-1);
  }
  // Seat dots
  standSeats.forEach(s=>{
    if(s.y<wL.y){
      ctx.fillStyle=s.col;
      ctx.beginPath(); ctx.arc(s.x,s.y,2.5,0,Math.PI*2); ctx.fill();
    }
  });

  // Outfield wall
  ctx.strokeStyle='#8b4513'; ctx.lineWidth=16;
  ctx.beginPath(); ctx.moveTo(wL.x,wL.y); ctx.lineTo(wR.x,wR.y); ctx.stroke();
  ctx.strokeStyle='#44bb44'; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(wL.x,wL.y); ctx.lineTo(wR.x,wR.y); ctx.stroke();
  // Wall distance markers
  ['330','400','330'].forEach((d,i)=>{
    const fx=[0.15,0.5,0.85][i], p2=pp(fx,1);
    tx(d,p2.x,p2.y-10,11,'#ffcc00');
  });

  // Stadium lights
  [[0.05,0.75],[0.95,0.75],[0.15,0.9],[0.85,0.9]].forEach(([fx,fy])=>{
    const base=pp(fx,fy), top={x:base.x,y:base.y-65};
    ctx.strokeStyle='#666'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(base.x,base.y); ctx.lineTo(top.x,top.y); ctx.stroke();
    // Glow
    const g=ctx.createRadialGradient(top.x,top.y,0,top.x,top.y,45);
    g.addColorStop(0,'rgba(255,240,160,0.7)'); g.addColorStop(1,'rgba(255,240,160,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(top.x,top.y,45,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff8e0';
    ctx.beginPath(); ctx.arc(top.x,top.y,6,0,Math.PI*2); ctx.fill();
  });

  // Warning track
  const wt=pp(0,0.88), wt2=pp(1,0.88);
  ctx.fillStyle='#a05828';
  ctx.beginPath(); ctx.moveTo(wt.x,wt.y); ctx.lineTo(wt2.x,wt2.y); ctx.lineTo(wR.x,wR.y); ctx.lineTo(wL.x,wL.y); ctx.closePath(); ctx.fill();

  // Outfield grass
  const homeL=pp(0,0), homeR=pp(1,0);
  const g2=ctx.createLinearGradient(W/2,VP.y,W/2,H);
  g2.addColorStop(0,'#1e7a28'); g2.addColorStop(1,'#2ea838');
  ctx.fillStyle=g2;
  ctx.beginPath(); ctx.moveTo(homeL.x,homeL.y); ctx.lineTo(homeR.x,homeR.y); ctx.lineTo(wt2.x,wt2.y); ctx.lineTo(wt.x,wt.y); ctx.closePath(); ctx.fill();
  // Grass stripes
  for(let i=0;i<10;i++){
    if(i%2===0){
      const a=pp(0,i/10),b=pp(1,i/10),c=pp(1,(i+1)/10),d=pp(0,(i+1)/10);
      ctx.fillStyle='rgba(0,0,0,0.06)';
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath(); ctx.fill();
    }
  }

  // Infield dirt
  const dL=pp(0.18,0.28), dR=pp(0.82,0.28), dN=pp(0.5,0.58), dS=pp(0.5,0.08);
  ctx.fillStyle='#b87040';
  ctx.beginPath(); ctx.moveTo(dS.x,dS.y); ctx.lineTo(dR.x,dR.y); ctx.lineTo(dN.x,dN.y); ctx.lineTo(dL.x,dL.y); ctx.closePath(); ctx.fill();
  // Infield grass overlay
  ctx.fillStyle='#269835';
  ctx.beginPath();
  const dm=pp(0.5,0.38);
  ctx.moveTo(dL.x,dL.y); ctx.lineTo(dm.x,dm.y); ctx.lineTo(dR.x,dR.y);
  ctx.lineTo(pp(0.7,0.13).x,pp(0.7,0.13).y); ctx.lineTo(pp(0.5,0.28).x,pp(0.5,0.28).y);
  ctx.lineTo(pp(0.3,0.13).x,pp(0.3,0.13).y); ctx.closePath(); ctx.fill();

  // Foul lines
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2; ctx.setLineDash([8,6]);
  ctx.beginPath(); ctx.moveTo(homeL.x+W*0.08,homeL.y); ctx.lineTo(wt.x+20,wt.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(homeR.x-W*0.08,homeR.y); ctx.lineTo(wt2.x-20,wt2.y); ctx.stroke();
  ctx.setLineDash([]);

  // Pitcher's mound
  const mnd=pp(0.5,0.52);
  ctx.fillStyle='#a06030'; ctx.beginPath(); ctx.ellipse(mnd.x,mnd.y,24,12,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c88048'; ctx.beginPath(); ctx.ellipse(mnd.x,mnd.y-2,15,7,0,0,Math.PI*2); ctx.fill();

  // Bases
  [{fx:0.76,fy:0.32},{fx:0.5,fy:0.56},{fx:0.24,fy:0.32}].forEach((b,i)=>{
    const bp=pp(b.fx,b.fy);
    ctx.save(); ctx.translate(bp.x,bp.y); ctx.rotate(Math.PI/4);
    rr(-8,-8,16,16,2,G.bases[i]?'#ffcc00':'#f0f0f0',G.bases[i]?'#cc8800':'#aaa',1.5);
    ctx.restore();
  });

  // Home plate
  const plate=pp(0.5,0.055);
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(plate.x,plate.y-10); ctx.lineTo(plate.x+11,plate.y); ctx.lineTo(plate.x+8,plate.y+10); ctx.lineTo(plate.x-8,plate.y+10); ctx.lineTo(plate.x-11,plate.y); ctx.closePath(); ctx.fill();

  // Foreground grass + dirt
  const fg=ctx.createLinearGradient(0,H*0.87,0,H);
  fg.addColorStop(0,'#2ea838'); fg.addColorStop(1,'#229030');
  ctx.fillStyle=fg; ctx.fillRect(0,H*0.87,W,H*0.13);
  ctx.fillStyle='#a06030';
  ctx.beginPath(); ctx.ellipse(W*0.36,H*0.895,50,16,0,0,Math.PI*2); ctx.fill();
}

// ── CARTOON PLAYER ─────────────────────────────────────────────────────────
function drawPlayer(px,py,s,p,dir=1,batAngle=null){
  ctx.save(); ctx.translate(px,py); ctx.scale(dir,1);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0,16*s,12*s,4*s,0,0,Math.PI*2); ctx.fill();
  // legs
  ctx.fillStyle='#e8e8e8'; ctx.fillRect(-10*s,-2*s,8*s,20*s); ctx.fillRect(3*s,-2*s,8*s,20*s);
  // shoes
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.ellipse(-6*s,18*s,9*s,4*s,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7*s,18*s,9*s,4*s,0,0,Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle=p.uni; ctx.beginPath(); ctx.roundRect(-14*s,-36*s,28*s,36*s,5*s); ctx.fill();
  // belt
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(-14*s,-4*s,28*s,4*s);
  // number
  ctx.fillStyle=p.acc; ctx.font=`bold ${9*s}px Arial`; ctx.textAlign='center';
  ctx.fillText(p.id||'?',0,-20*s);
  // arms
  ctx.fillStyle=p.skin; ctx.fillRect(-23*s,-32*s,11*s,10*s); ctx.fillRect(13*s,-32*s,11*s,10*s);
  // head
  ctx.fillStyle=p.skin; ctx.beginPath(); ctx.arc(0,-46*s,16*s,0,Math.PI*2); ctx.fill();
  // hair
  ctx.fillStyle=p.hair; ctx.beginPath(); ctx.arc(0,-54*s,12*s,Math.PI,0); ctx.fill();
  // hat brim
  ctx.fillStyle=p.uni; ctx.fillRect(-17*s,-57*s,34*s,5*s);
  ctx.beginPath(); ctx.roundRect(-11*s,-72*s,22*s,17*s,3*s); ctx.fill();
  ctx.fillStyle=p.acc; ctx.fillRect(-5*s,-72*s,10*s,3*s);
  // eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-6*s,-46*s,4*s,4.5*s,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6*s,-46*s,4*s,4.5*s,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-6*s,-45*s,2.2*s,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(6*s,-45*s,2.2*s,0,Math.PI*2); ctx.fill();
  // smile
  ctx.strokeStyle='#332'; ctx.lineWidth=1.5*s;
  ctx.beginPath(); ctx.arc(0,-41*s,5.5*s,0.2,Math.PI-0.2); ctx.stroke();

  // bat
  if(batAngle !== null){
    ctx.save(); ctx.rotate(batAngle);
    ctx.fillStyle='#8b5020';
    ctx.beginPath(); ctx.roundRect(-3*s,-45*s,6*s,40*s,3*s); ctx.fill();
    ctx.fillStyle='#aa7030';
    ctx.beginPath(); ctx.ellipse(0,-48*s,9*s,6*s,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  } else {
    // resting bat
    ctx.save(); ctx.rotate(0.4);
    ctx.fillStyle='#8b5020'; ctx.fillRect(-2*s,-42*s,5*s,36*s);
    ctx.fillStyle='#aa7030'; ctx.beginPath(); ctx.ellipse(0,-44*s,7*s,5*s,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

// ── PARTICLES ──────────────────────────────────────────────────────────────
let particles=[];
function spawnParticles(x,y,col,n=18){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, spd=2+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-3,life:1,col,r:2+Math.random()*4});
  }
}
function updateParticles(){
  particles=particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=0.025;
    return p.life>0;
  });
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ── GAME STATE ─────────────────────────────────────────────────────────────
const INNINGS=3, OUTS_PER=3;
let G, ball, timingRing, swingAnim, hitBall, screenShake={x:0,y:0,t:0};

const PITCHES=[
  {type:'fastball',label:'Fastball ⚡',col:'#dd3333',desc:'Fast & straight',spd:0.030,curve:0},
  {type:'curve',   label:'Curveball 🌀',col:'#3366dd',desc:'Slow, breaks late',spd:0.018,curve:1},
  {type:'changeup',label:'Changeup 🎭',col:'#33aa44',desc:'Very slow, fools batter',spd:0.013,curve:0.5},
];

function newGame(){
  G={
    phase:'menu',
    inning:1, half:'top',
    outs:0, strikes:0, balls:0,
    score:{player:0,ai:0},
    bases:[false,false,false],
    playerLineup:[1,2], playerBatIdx:0,
    lineupSel:[],
    resultText:'', resultColor:'#fff', resultTimer:0,
    coinsCounted:false, coinsEarned:0,
    pitchLabel:'',
  };
  ball=null; timingRing=null; swingAnim=null; hitBall=null;
  particles=[];
}
newGame();

// ── TIMING RING (Baseball 9 style) ─────────────────────────────────────────
// A ring shrinks toward a center target. Tap when it overlaps the sweet spot.
const RING_START=130, RING_TARGET=22;
function initRing(batter){
  const speed = lerp(1.4, 2.2, (10-batter.con)/10);
  timingRing={radius:RING_START, speed, hit:false, active:true};
}
function updateRing(){
  if(!timingRing||timingRing.hit||!timingRing.active) return;
  timingRing.radius-=timingRing.speed;
  if(timingRing.radius<=0){
    timingRing.active=false; timingRing.radius=0;
    if(!timingRing.hit){
      // missed — no swing
      G.strikes++; showMsg('STRIKE!','#ff4444');
      checkCount(ball?.isAIPitching?false:true);
      setTimeout(()=>resetAtBat(),900);
    }
  }
}
function drawTimingRing(cx,cy,batter){
  if(!timingRing||!timingRing.active) return;
  const r=timingRing.radius;
  // Sweet spot circle (target)
  ctx.strokeStyle='rgba(255,220,0,0.9)'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(cx,cy,RING_TARGET,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,220,0,0.15)';
  ctx.beginPath(); ctx.arc(cx,cy,RING_TARGET,0,Math.PI*2); ctx.fill();
  // Good zone (slightly larger)
  ctx.strokeStyle='rgba(100,255,100,0.4)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,RING_TARGET+14,0,Math.PI*2); ctx.stroke();

  // The shrinking ring
  const dist=Math.abs(r-RING_TARGET);
  let ringCol;
  if(dist<8)       ringCol='#ffcc00';
  else if(dist<20) ringCol='#44ff88';
  else             ringCol='rgba(255,255,255,0.8)';
  ctx.strokeStyle=ringCol; ctx.lineWidth=5;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  // Ring glow
  ctx.strokeStyle=ringCol.replace(')',',0.2)').replace('rgb','rgba'); ctx.lineWidth=14;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();

  // Tap instruction
  stx('TAP  SPACE  or  CLICK',cx,cy+RING_START+22,15,'#fff','#000');
}

function playerTap(cx,cy,batter){
  if(!timingRing||timingRing.hit||!timingRing.active) return;
  timingRing.hit=true; timingRing.active=false;
  const dist=Math.abs(timingRing.radius-RING_TARGET);
  const pw=6+batter.pow*0.7;
  let inPower=false, inGreen=false;
  if(dist<8)  { inGreen=true; inPower=true; }
  else if(dist<20){ inGreen=true; }
  swingAnim={t:0,cx,cy};
  resolveSwing(inGreen,inPower,batter,false);
}

// ── BAT SWING ANIMATION ────────────────────────────────────────────────────
function updateSwingAnim(){
  if(swingAnim) swingAnim.t=Math.min(1,swingAnim.t+0.07);
}
function getBatAngle(isSwinging,t){
  if(!isSwinging) return 0.4; // resting
  return lerp(0.4,-1.5+Math.sin(t*Math.PI)*0.5,Math.min(1,t*2));
}

// ── BALL ANIMATION ─────────────────────────────────────────────────────────
const MOUND_PT=()=>pp(0.5,0.52);
const PLATE_PT=()=>pp(0.5,0.06);

function throwBall(type, isAIPitching){
  const def=PITCHES.find(p=>p.type===type);
  const inZone=Math.random()<0.68;
  const cd=Math.random()<0.5?1:-1;
  ball={t:0, spd:def.spd, type, curveAmt:def.curve*cd*(inZone?0.25:0.85), inZone, isAIPitching, done:false};
  G.pitchLabel=def.label.split(' ')[0];
  const batter=currentBatter(!isAIPitching);
  initRing(batter);
  if(!isAIPitching){ // AI is batting
    const delay=400+Math.random()*500;
    setTimeout(()=>aiSwingDecision(inZone,batter),delay);
  }
}

function updateBall(){
  if(!ball||ball.done) return;
  ball.t=Math.min(1,ball.t+ball.spd);
  if(ball.t>=1&&!ball.done){
    ball.done=true;
    if(timingRing&&!timingRing.hit){
      timingRing.active=false;
      if(ball.inZone){ G.strikes++; showMsg('STRIKE!','#ff4444'); }
      else            { G.balls++;  showMsg('Ball!','#88aaff'); }
      checkCount(ball.isAIPitching);
      if(G.phase==='game') setTimeout(()=>resetAtBat(),900);
    }
  }
}

function drawBall(){
  if(!ball) return;
  const mp=MOUND_PT(), plp=PLATE_PT();
  const t2=ball.t;
  const curve=Math.sin(t2*Math.PI)*ball.curveAmt*90;
  const bx=lerp(mp.x,plp.x,t2)+curve;
  const arc=Math.sin(t2*Math.PI)*-12;
  const by=lerp(mp.y,plp.y,t2)+arc;
  const r=lerp(2.5,13,Math.pow(t2,0.55));
  // motion blur trail
  for(let i=1;i<=4;i++){
    const tt=Math.max(0,t2-i*0.035);
    const tx2=lerp(mp.x,plp.x,tt)+Math.sin(tt*Math.PI)*ball.curveAmt*90;
    const ty2=lerp(mp.y,plp.y,tt)+Math.sin(tt*Math.PI)*-12;
    const tr2=lerp(2.5,13,Math.pow(tt,0.55));
    ctx.fillStyle=`rgba(255,255,200,${0.08-i*0.015})`;
    ctx.beginPath(); ctx.arc(tx2,ty2,tr2,0,Math.PI*2); ctx.fill();
  }
  // glow
  const g=ctx.createRadialGradient(bx,by,0,bx,by,r*3);
  g.addColorStop(0,'rgba(255,250,200,0.5)'); g.addColorStop(1,'rgba(255,250,200,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx,by,r*3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#cc3333'; ctx.lineWidth=Math.max(1,r*0.18);
  ctx.beginPath(); ctx.arc(bx,by,r*0.7,0.3,1.1); ctx.stroke();
  ctx.beginPath(); ctx.arc(bx,by,r*0.7,Math.PI+0.3,Math.PI+1.1); ctx.stroke();
  // pitch label
  if(t2<0.25){
    ctx.globalAlpha=1-t2*4;
    stx(G.pitchLabel,bx,by-20,14,'#ffee88');
    ctx.globalAlpha=1;
  }
}

// Hit ball arc
function spawnHitBall(type,fromX,fromY){
  let tx2, ty2, arc2;
  if(type==='homerun'){
    tx2=W/2+(Math.random()-0.5)*200; ty2=H*0.1; arc2=-180;
    doScreenShake(8);
  } else if(type==='triple'){ tx2=W*0.15+(Math.random()<0.5?0:W*0.7); ty2=H*0.45; arc2=-80; }
  else if(type==='double'){ tx2=W*0.2+Math.random()*W*0.6; ty2=H*0.5; arc2=-60; }
  else { tx2=W*0.25+Math.random()*W*0.5; ty2=H*0.6; arc2=-30; }
  hitBall={t:0,sx:fromX,sy:fromY,tx:tx2,ty:ty2,arc:arc2,type};
}
function updateHitBall(){
  if(!hitBall) return;
  hitBall.t+=0.02;
  if(hitBall.t>=1) hitBall=null;
}
function drawHitBall(){
  if(!hitBall) return;
  const t2=hitBall.t;
  const bx=lerp(hitBall.sx,hitBall.tx,t2);
  const by=lerp(hitBall.sy,hitBall.ty,t2)+Math.sin(t2*Math.PI)*hitBall.arc;
  const r=10-t2*4;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bx,by,Math.max(2,r),0,Math.PI*2); ctx.fill();
  const g=ctx.createRadialGradient(bx,by,0,bx,by,r*3);
  g.addColorStop(0,'rgba(255,250,150,0.4)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx,by,r*3,0,Math.PI*2); ctx.fill();
}

// ── SCREEN SHAKE ───────────────────────────────────────────────────────────
function doScreenShake(amt){ screenShake={x:0,y:0,t:amt}; }
function updateShake(){
  if(screenShake.t>0){
    screenShake.t*=0.85;
    screenShake.x=(Math.random()-0.5)*screenShake.t*2;
    screenShake.y=(Math.random()-0.5)*screenShake.t*2;
  } else { screenShake.x=0; screenShake.y=0; }
}

// ── LOGIC ──────────────────────────────────────────────────────────────────
function currentBatter(isAI){ return isAI?AI_BOT:getP(G.playerLineup[G.playerBatIdx%G.playerLineup.length]); }
function currentPitcher(isAI){ return isAI?AI_BOT:getP(G.playerLineup[0]); }

function resolveSwing(inGreen,inPower,batter,isAIBatting){
  const plp=PLATE_PT();
  if(!inGreen){
    G.strikes++; showMsg('SWING AND MISS! ✕','#ff8800');
    checkCount(isAIBatting);
    setTimeout(()=>resetAtBat(),1000);
  } else if(inPower){
    const hr=Math.random()<0.15+batter.pow*0.04;
    if(hr){ spawnHitBall('homerun',plp.x,plp.y); spawnParticles(plp.x,plp.y,'#ffcc00',30); resolveHit('homerun',isAIBatting); }
    else  { const t2=Math.random()<0.55?'double':'single'; spawnHitBall(t2,plp.x,plp.y); spawnParticles(plp.x,plp.y,'#ff8800',20); resolveHit(t2,isAIBatting); }
  } else {
    const r=Math.random();
    if(r<0.25)     { G.outs++; showMsg('GROUNDOUT','#ff5555'); spawnParticles(plp.x,plp.y,'#aaa',10); checkInning(); setTimeout(()=>resetAtBat(),1000); }
    else if(r<0.42){ G.outs++; showMsg('FLY OUT ✈','#ff5555'); spawnParticles(plp.x,plp.y,'#aaa',10); checkInning(); setTimeout(()=>resetAtBat(),1000); }
    else if(r<0.63){ spawnHitBall('single',plp.x,plp.y); spawnParticles(plp.x,plp.y,'#44ff88',15); resolveHit('single',isAIBatting); }
    else if(r<0.82){ spawnHitBall('double',plp.x,plp.y); spawnParticles(plp.x,plp.y,'#44ffff',18); resolveHit('double',isAIBatting); }
    else           { spawnHitBall('triple',plp.x,plp.y); spawnParticles(plp.x,plp.y,'#ffaa00',22); resolveHit('triple',isAIBatting); }
  }
}

function resolveHit(type,isAI){
  let runs=0;
  if(type==='homerun'){ runs=1+G.bases.filter(Boolean).length; G.bases=[false,false,false]; showMsg('HOME RUN!! 🎉','#ffcc00'); doScreenShake(10); }
  else if(type==='triple'){ runs=G.bases.filter(Boolean).length; G.bases=[false,false,true]; showMsg('TRIPLE! 🔥','#ffaa00'); }
  else if(type==='double'){ const sc=G.bases[2]?1:0; runs=sc+(G.bases[1]&&G.bases[2]?1:0); G.bases=[false,G.bases[0],G.bases[1]]; showMsg('DOUBLE!','#44ffff'); }
  else { runs=G.bases[2]?1:0; G.bases[2]=G.bases[1]; G.bases[1]=G.bases[0]; G.bases[0]=true; showMsg('SINGLE!','#44ff88'); }
  if(runs>0){ if(isAI) G.score.ai+=runs; else G.score.player+=runs; setTimeout(()=>showMsg(`${runs} RUN${runs>1?'S':''} SCORE!`,'#ffcc00'),700); }
  G.strikes=0; G.balls=0;
  setTimeout(()=>nextBatter(isAI),1500);
}

function checkCount(isAIBatting){
  if(G.strikes>=3){ showMsg('STRIKEOUT! ⚾','#ff3300'); G.outs++; G.strikes=0; G.balls=0; checkInning(); setTimeout(()=>nextBatter(isAIBatting),1300); }
  else if(G.balls>=4){ showMsg('WALK!','#88aaff'); walk(isAIBatting); }
}
function walk(isAI){
  if(G.bases[0]&&G.bases[1]&&G.bases[2]){ if(isAI) G.score.ai++; else G.score.player++; }
  if(G.bases[0]&&G.bases[1]) G.bases[2]=true;
  if(G.bases[0]) G.bases[1]=true;
  G.bases[0]=true; G.strikes=0; G.balls=0;
  setTimeout(()=>nextBatter(isAI),1300);
}
function checkInning(){ if(G.outs>=OUTS_PER) setTimeout(endHalf,1500); }
function endHalf(){
  G.outs=0; G.strikes=0; G.balls=0; G.bases=[false,false,false];
  if(G.half==='top') G.half='bottom';
  else { G.inning++; G.half='top'; if(G.inning>INNINGS){ G.phase='gameover'; countCoins(); return; } }
  ball=null; timingRing=null; swingAnim=null;
  if(G.half==='top') setTimeout(()=>aiPitch(),1200);
}
function nextBatter(isAI){
  if(G.phase!=='game') return;
  G.strikes=0; G.balls=0; ball=null; timingRing=null; swingAnim=null;
  if(!isAI) G.playerBatIdx=(G.playerBatIdx+1)%G.playerLineup.length;
  if(G.half==='top') setTimeout(()=>aiPitch(),900);
}
function resetAtBat(){
  ball=null; timingRing=null; swingAnim=null;
  if(G.phase!=='game') return;
  if(G.half==='top') setTimeout(()=>aiPitch(),700);
}

// AI PITCHER
function aiPitch(){
  if(G.phase!=='game'||G.half!=='top'||ball) return;
  const pick=PITCHES[Math.floor(Math.random()*PITCHES.length)];
  showMsg(`${AI_BOT.name}: ${pick.label.split(' ')[0]}!`,'#88ccff',45);
  setTimeout(()=>throwBall(pick.type,true),550);
}

// AI BATTER - actually swings with visible animation
function aiSwingDecision(inZone,batter){
  if(!timingRing||timingRing.hit) return;
  const willSwing=inZone?Math.random()<0.82:Math.random()<0.22;
  if(!willSwing) return;
  // AI accuracy: hits in ring zone ~55% of time
  const skill=0.55;
  const perfect=Math.random()<skill*0.4;
  const good=!perfect&&Math.random()<skill;
  let fakeRadius;
  if(perfect)   fakeRadius=RING_TARGET+Math.random()*6-3;      // perfect
  else if(good) fakeRadius=RING_TARGET+8+Math.random()*10;     // good
  else          fakeRadius=RING_TARGET+30+Math.random()*40;    // miss
  timingRing.radius=fakeRadius;
  timingRing.hit=true; timingRing.active=false;
  swingAnim={t:0,cx:W/2,cy:H*0.7};
  const inGreen=Math.abs(fakeRadius-RING_TARGET)<20;
  const inPower=Math.abs(fakeRadius-RING_TARGET)<8;
  resolveSwing(inGreen,inPower,batter,true);
}

function showMsg(str,col='#fff',dur=85){ G.resultText=str; G.resultColor=col; G.resultTimer=dur; }
function countCoins(){
  if(G.coinsCounted) return; G.coinsCounted=true;
  G.coinsEarned=30+G.score.player*14+G.score.ai*4; save.coins+=G.coinsEarned; persist();
}

// ── SCOREBOARD ─────────────────────────────────────────────────────────────
function drawScoreboard(){
  rr(8,8,252,105,12,'rgba(0,0,20,0.9)','rgba(80,140,255,0.4)',2);
  const half=G.half==='top'?'▲ AI Bats':'▼ You Bat';
  stx(`Inning ${G.inning}  ${half}`,134,30,14,'#aaddff');
  tx(`B: ${G.balls}   K: ${G.strikes}   Out: ${'●'.repeat(G.outs)}${'○'.repeat(OUTS_PER-G.outs)}`,134,52,13,'#fff');
  rr(14,62,106,42,6,'rgba(255,200,0,0.12)');
  rr(128,62,124,42,6,'rgba(80,160,255,0.12)');
  stx('YOU',67,78,11,'#ffdd55'); stx(`${G.score.player}`,67,98,22,'#ffcc00');
  stx(AI_BOT.name,190,78,11,'#88ccff'); stx(`${G.score.ai}`,190,98,22,'#88aaff');
}

// ── PITCH BUTTONS ──────────────────────────────────────────────────────────
function drawPitchUI(){
  rr(W/2-230,H-108,460,95,14,'rgba(0,0,0,0.8)','rgba(255,255,255,0.12)',1);
  stx('YOUR TURN TO PITCH',W/2,H-86,16,'#fff');
  PITCHES.forEach((p,i)=>{
    const bx=W/2-212+i*148, by=H-72, bw=134, bh=52;
    const hover=mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh;
    rr(bx,by,bw,bh,10,hover?p.col:p.col+'99','rgba(255,255,255,0.4)',hover?3:1);
    stx(p.label,bx+bw/2,by+22,13,'#fff');
    tx(p.desc,bx+bw/2,by+40,9,'rgba(255,255,255,0.7)');
    if(btnHit(bx,by,bw,bh)) throwBall(p.type,false);
  });
}

// ── SCREENS ────────────────────────────────────────────────────────────────
function drawMenu(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#06091a'); bg.addColorStop(1,'#0a2010');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  drawStadium();
  drawPlayer(W*0.33,H*0.86,1.15,getP(1)||ROSTER[0],1,0.4);
  drawPlayer(W*0.67,H*0.86,1.15,AI_BOT,-1,0.4);

  rr(W/2-250,H*0.06,500,110,18,'rgba(0,0,0,0.7)','rgba(100,180,255,0.3)',2);
  stx('⚾  BASEBALL  9',W/2,H*0.06+65,52,'#ffdd00','#330000');
  tx('Ryan & Nathan Edition  ·  vs Robot',W/2,H*0.06+93,17,'#aaddff');

  btn('▶  PLAY GAME',W/2-120,H*0.54,240,62,'#22aa44');
  btn('🛒  SHOP',W/2-105,H*0.54+76,210,52,'#aa6600');
  tx(`🪙 ${save.coins} coins`,W/2,H*0.54+148,17,'#ffcc00');
  if(btnHit(W/2-120,H*0.54,240,62)){ G.lineupSel=[]; G.phase='lineup'; }
  if(btnHit(W/2-105,H*0.54+76,210,52)) G.phase='shop';
}

function drawLineup(){
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#0d1b3e'); bg.addColorStop(1,'#1a0d3e');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  stx('Pick Your Lineup',W/2,50,28,'#fff');
  tx(`${G.lineupSel.length} selected  (need at least 2, max 4)`,W/2,78,15,'#aaa');
  const avail=ROSTER.filter(p=>save.unlocked.includes(p.id));
  const cols=Math.min(avail.length,4), cw=Math.floor((W-40)/cols);
  avail.forEach((p,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const cx=20+cw*col+cw/2, cy=105+row*215+95;
    const sel=G.lineupSel.includes(p.id);
    rr(cx-80,cy-95,160,185,12,sel?'#1a3a7a':'#1a1a3a',sel?'#ffcc00':'#445',sel?3:1);
    drawPlayer(cx,cy-12,0.95,p,1,0.4);
    stx(p.name,cx,cy+82,15,'#fff');
    tx(`PWR ${p.pow}  CON ${p.con}`,cx,cy+100,12,'#aaa');
    if(sel){ stx('✓',cx+65,cy-85,24,'#ffcc00'); }
    if(jclick&&mx>=cx-80&&mx<=cx+80&&my>=cy-95&&my<=cy+90){
      if(sel) G.lineupSel=G.lineupSel.filter(id=>id!==p.id);
      else if(G.lineupSel.length<4) G.lineupSel.push(p.id);
    }
  });
  if(G.lineupSel.length>=2){
    btn('PLAY BALL! ⚾',W/2-130,H-74,260,56,'#22aa44');
    if(btnHit(W/2-130,H-74,260,56)){
      G.playerLineup=G.lineupSel; G.playerBatIdx=0;
      G.phase='game'; setTimeout(()=>aiPitch(),1000);
    }
  } else {
    rr(W/2-130,H-74,260,56,10,'#333'); tx('Pick at least 2 players',W/2,H-40,15,'#666');
  }
  btn('Shop 🛒',22,H-74,130,56,'#aa6600');
  if(btnHit(22,H-74,130,56)) G.phase='shop';
}

function drawShop(){
  ctx.fillStyle='#0d1020'; ctx.fillRect(0,0,W,H);
  stx('🛒  SHOP',W/2,54,36,'#ffdd00');
  tx(`🪙 ${save.coins} coins`,W/2,88,19,'#fff');
  const locked=ROSTER.filter(p=>!save.unlocked.includes(p.id));
  if(!locked.length){ tx('All players unlocked! 🎉',W/2,H/2,26,'#44ff88'); }
  else {
    const cols=Math.min(locked.length,3), cw=Math.floor((W-40)/cols);
    locked.forEach((p,i)=>{
      const col=i%cols, row=Math.floor(i/cols);
      const cx=20+cw*col+cw/2, cy=130+row*250+110;
      const can=save.coins>=p.price;
      rr(cx-90,cy-110,180,210,12,'#1a1a3a',can?'#445':'#333',2);
      drawPlayer(cx,cy-18,1.0,p,1,0.4);
      stx(p.name,cx,cy+88,16,'#fff');
      tx(`PWR ${p.pow}  CON ${p.con}`,cx,cy+106,12,'#aaa');
      btn(`🪙 ${p.price}`,cx-58,cy+118,116,38,can?'#22aa44':'#444',can?'#fff':'#777',14);
      if(can&&btnHit(cx-58,cy+118,116,38)){ save.coins-=p.price; save.unlocked.push(p.id); persist(); }
    });
  }
  btn('← Back',22,22,110,42,'#445');
  if(btnHit(22,22,110,42)) G.phase=G.inning>1?'gameover':'lineup';
}

function drawGame(){
  ctx.save();
  if(screenShake.t>0.5){ ctx.translate(screenShake.x,screenShake.y); }
  drawStadium();
  drawHitBall();
  drawParticles();

  const mnd=pp(0.5,0.52);
  if(G.half==='top'){
    // AI batting: show AI batter swinging, player pitching
    const pitcher=getP(G.playerLineup[0]);
    if(pitcher) drawPlayer(mnd.x,mnd.y+8,0.55,pitcher,1,0.4);
    const batAngle=swingAnim?getBatAngle(true,swingAnim.t):0.4;
    drawPlayer(W*0.365,H*0.875,1.1,AI_BOT,-1,batAngle);
  } else {
    // Player batting: show player swinging, AI pitching
    drawPlayer(mnd.x,mnd.y+8,0.55,AI_BOT,1,0.4);
    const batter=getP(G.playerLineup[G.playerBatIdx%G.playerLineup.length]);
    const batAngle=swingAnim?getBatAngle(true,swingAnim.t):0.4;
    if(batter) drawPlayer(W*0.365,H*0.875,1.1,batter,-1,batAngle);
  }

  updateBall(); drawBall();
  updateRing(); updateSwingAnim();
  updateParticles(); updateHitBall(); updateShake();

  // Timing ring (player batting only)
  if(G.half==='bottom' && ball && !ball.done && timingRing && timingRing.active){
    const batter=getP(G.playerLineup[G.playerBatIdx%G.playerLineup.length]);
    drawTimingRing(W/2,H*0.62,batter);
  }

  // Pitch buttons (player pitching)
  if(G.half==='top'&&!ball) drawPitchUI();
  if(G.half==='top'&&ball&&!ball.done){
    rr(W/2-120,H-60,240,42,10,'rgba(0,0,0,0.7)');
    tx('Ball in the air…',W/2,H-32,16,'#fff');
  }

  // Waiting message (player batting, no ball yet)
  if(G.half==='bottom'&&!ball){
    rr(W/2-150,H-60,300,42,10,'rgba(0,0,0,0.7)');
    tx(`${AI_BOT.name} is winding up…`,W/2,H-32,16,'#88ccff');
  }

  drawScoreboard();

  // Inning banner
  tx(G.half==='top'?'AI Batting  ·  You Pitch':'You Batting  ·  AI Pitches',W/2,H-8,12,'rgba(255,255,255,0.45)');

  // Result popup
  if(G.resultTimer>0){
    G.resultTimer--;
    ctx.globalAlpha=Math.min(1,G.resultTimer/25);
    stx(G.resultText,W/2,H/2-30,44,G.resultColor);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawGameOver(){
  drawStadium();
  ctx.fillStyle='rgba(0,0,10,0.88)'; ctx.fillRect(0,0,W,H);
  stx('GAME OVER',W/2,H/2-135,52,'#ffdd00');
  rr(W/2-210,H/2-100,420,108,14,'rgba(255,255,255,0.06)','rgba(255,255,255,0.1)',1);
  stx('YOU',W/2-95,H/2-58,21,'#ffcc44'); stx(`${G.score.player}`,W/2-95,H/2-18,48,'#fff');
  stx(AI_BOT.name,W/2+95,H/2-58,21,'#88ccff'); stx(`${G.score.ai}`,W/2+95,H/2-18,48,'#88aaff');
  tx('—',W/2,H/2-18,40,'#555');
  const won=G.score.player>G.score.ai, tied=G.score.player===G.score.ai;
  stx(won?'You Win! 🏆':tied?"It's a Tie!":`${AI_BOT.name} Wins!`,W/2,H/2+42,36,won?'#ffcc00':tied?'#aaa':'#ff6666');
  if(won) spawnParticles(W/2,H/2,'#ffcc00',3);
  tx(`+${G.coinsEarned} coins earned  🪙`,W/2,H/2+84,18,'#ffcc00');
  tx(`Total: 🪙 ${save.coins}`,W/2,H/2+108,15,'#fff');
  btn('Play Again ▶',W/2-130,H/2+128,260,58,'#22aa44');
  btn('Shop 🛒',W/2-80,H/2+200,160,50,'#aa6600',undefined,15);
  if(btnHit(W/2-130,H/2+128,260,58)){ newGame(); G.lineupSel=[]; G.phase='lineup'; }
  if(btnHit(W/2-80,H/2+200,160,50)) G.phase='shop';
}

// ── MAIN LOOP ──────────────────────────────────────────────────────────────
function loop(){
  frame++;
  ctx.clearRect(0,0,W,H);
  switch(G.phase){
    case 'menu':     drawMenu();     break;
    case 'lineup':   drawLineup();   break;
    case 'shop':     drawShop();     break;
    case 'game':
      drawGame();
      if(G.half==='bottom'&&ball&&!ball.done&&timingRing&&timingRing.active){
        if(spaceJust||(jclick&&my>H*0.45)){
          const b=getP(G.playerLineup[G.playerBatIdx%G.playerLineup.length]);
          if(b){ swingAnim={t:0}; playerTap(W/2,H*0.62,b); }
        }
      }
      break;
    case 'gameover': drawGameOver(); break;
  }
  spaceJust=false; jclick=false;
  requestAnimationFrame(loop);
}
loop();
</script>
