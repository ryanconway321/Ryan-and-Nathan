<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball 9 — Ryan & Nathan</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = C.width  = Math.min(window.innerWidth,  900);
const H = C.height = Math.min(window.innerHeight, 640);
const VP = { x: W/2, y: H * 0.28 }; // vanishing point

// ── HELPERS ────────────────────────────────────────────────────────────────
const lerp  = (a,b,t) => a+(b-a)*t;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const getP  = id => ROSTER.find(r=>r.id===id);

// ── ROSTER ─────────────────────────────────────────────────────────────────
const ROSTER = [
  {id:1,name:'Ryan',   pow:8,con:7,price:0,  skin:'#f5c5a0',hair:'#3d2b1f',uni:'#cc2222',acc:'#ffffff'},
  {id:2,name:'Nathan', pow:6,con:9,price:0,  skin:'#f0d0a0',hair:'#111',   uni:'#2244cc',acc:'#ffffff'},
  {id:3,name:'Big Mac',pow:10,con:4,price:100,skin:'#e8a070',hair:'#8b4513',uni:'#ff7700',acc:'#ffcc00'},
  {id:4,name:'Ghost',  pow:5,con:9,price:120,skin:'#d8d8d8',hair:'#eee',   uni:'#8822cc',acc:'#aaffaa'},
  {id:5,name:'Tank',   pow:9,con:6,price:180,skin:'#7a5545',hair:'#111',   uni:'#226622',acc:'#ffffff'},
  {id:6,name:'Ace',    pow:7,con:9,price:250,skin:'#ffe0b0',hair:'#cc8800',uni:'#cc3388',acc:'#ffff88'},
  {id:7,name:'Blaze',  pow:8,con:8,price:300,skin:'#f5b095',hair:'#ff4400',uni:'#334499',acc:'#ff8800'},
  {id:8,name:'Iron',   pow:10,con:7,price:400,skin:'#999',  hair:'#333',   uni:'#445566',acc:'#88aaff'},
];

// ── SAVE ───────────────────────────────────────────────────────────────────
let save = JSON.parse(localStorage.getItem('b9v2') || 'null') || {coins:0, unlocked:[1,2]};
const persist = () => localStorage.setItem('b9v2', JSON.stringify(save));

// ── INPUT ──────────────────────────────────────────────────────────────────
let mx=0,my=0,jclick=false;
C.addEventListener('mousemove',e=>{
  const r=C.getBoundingClientRect();
  mx=(e.clientX-r.left)*(W/r.width);
  my=(e.clientY-r.top)*(H/r.height);
});
C.addEventListener('click',()=>jclick=true);
let spaceJustDown=false, spaceHeld=false;
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!e.repeat){spaceJustDown=true;spaceHeld=true;e.preventDefault();}
});
document.addEventListener('keyup',e=>{if(e.code==='Space')spaceHeld=false;});

// ── GAME STATE ─────────────────────────────────────────────────────────────
const INNINGS=3, OUTS_PER=3;
let G, ball, swing, showingResult;

const AI_NAMES = ['Robo-9','CpuBot','A.I. Pete','Digi-Dave'];
const aiName = AI_NAMES[Math.floor(Math.random()*AI_NAMES.length)];

function newGame(){
  G={
    phase:'menu',      // menu|lineup|game|shop|gameover
    playerTeam:0,      // 0=home, always
    inning:1, half:'top', // top=AI bats, bottom=player bats
    outs:0, strikes:0, balls:0,
    score:{player:0, ai:0},
    bases:[false,false,false],
    playerLineup:[1,2],
    playerBatIdx:0,
    lineupSel:[],
    resultText:'', resultColor:'#fff', resultTimer:0,
    coinsCounted:false, coinsEarned:0,
    // AI
    aiSkill:0.52,  // probability AI hits in green zone
    aiPitchTarget:null,
  };
  ball=null; swing=null; showingResult=false;
}
newGame();

// ── DRAW UTILS ─────────────────────────────────────────────────────────────
function rr(x,y,w,h,r,fill,stroke,lw=2){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
}
function t(str,x,y,sz,col,align='center',bold=true){
  ctx.font=`${bold?'bold ':''}${sz}px Arial`;
  ctx.fillStyle=col; ctx.textAlign=align;
  ctx.fillText(str,x,y);
}
function st(str,x,y,sz,col,sh='#000',align='center'){
  ctx.font=`bold ${sz}px Arial`; ctx.textAlign=align;
  ctx.fillStyle=sh; ctx.fillText(str,x+2,y+2);
  ctx.fillStyle=col; ctx.fillText(str,x,y);
}
function btnHit(x,y,w,h){return jclick&&mx>=x&&mx<=x+w&&my>=y&&my<=y+h;}
function btn(label,x,y,w,h,fill,tc='#fff',sz=16){
  rr(x,y,w,h,10,fill,'rgba(255,255,255,0.25)',2);
  t(label,x+w/2,y+h/2+sz*0.36,sz,tc);
}

// ── 3D FIELD ───────────────────────────────────────────────────────────────
function perspPt(fx, fy) {
  // fx,fy: field coords 0-1 (0=home end, 1=outfield wall)
  // returns screen x,y
  const sx = lerp(lerp(W*0.05, VP.x, fy), lerp(W*0.95, VP.x, fy), fx);
  const sy = lerp(H*0.92, VP.y, fy);
  return {x:sx, y:sy};
}

function drawStadium(){
  // Sky gradient
  const sky=ctx.createLinearGradient(0,0,0,H*0.55);
  sky.addColorStop(0,'#1a3a6e'); sky.addColorStop(0.6,'#2a5aa0'); sky.addColorStop(1,'#4a80c0');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.55);

  // Stars
  ctx.fillStyle='rgba(255,255,255,0.6)';
  for(let i=0;i<50;i++){
    const sx=(i*173+11)%W, sy=(i*97+7)%(H*0.28);
    ctx.beginPath(); ctx.arc(sx,sy,i%7===0?1.5:0.8,0,Math.PI*2); ctx.fill();
  }

  // Stadium upper stands (trapezoid behind outfield wall)
  const wallL=perspPt(0,1), wallR=perspPt(1,1);
  ctx.fillStyle='#1a2a3a';
  ctx.beginPath();
  ctx.moveTo(0,H*0.26); ctx.lineTo(W,H*0.26);
  ctx.lineTo(W,wallR.y); ctx.lineTo(0,wallL.y);
  ctx.closePath(); ctx.fill();

  // Stadium seats rows
  for(let row=0;row<8;row++){
    const ry=H*0.26+row*((wallL.y-H*0.26)/9);
    const alpha=0.12-row*0.01;
    ctx.fillStyle=`rgba(80,120,180,${alpha})`;
    ctx.fillRect(0,ry,W,5);
    // seat dots
    if(row<5){
      for(let s=0;s<Math.floor(W/18);s++){
        const sx2=s*18+9;
        const col=Math.random()<0.55?'#cc3333':'#2244aa';
        ctx.fillStyle=col;
        ctx.beginPath(); ctx.arc(sx2,ry+3,3,0,Math.PI*2); ctx.fill();
      }
    }
  }

  // Stadium lights on poles
  [[0.08,0.62],[0.92,0.62],[0.18,0.82],[0.82,0.82]].forEach(([fx,fy])=>{
    const p=perspPt(fx,fy);
    const ph=perspPt(fx,fy+0.05);
    ctx.strokeStyle='#888'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(ph.x,ph.y-60); ctx.stroke();
    // light glow
    const grd=ctx.createRadialGradient(ph.x,ph.y-60,0,ph.x,ph.y-60,40);
    grd.addColorStop(0,'rgba(255,240,180,0.6)'); grd.addColorStop(1,'rgba(255,240,180,0)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(ph.x,ph.y-60,40,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffe';
    ctx.beginPath(); ctx.arc(ph.x,ph.y-60,5,0,Math.PI*2); ctx.fill();
  });

  // Outfield wall
  ctx.strokeStyle='#8b4513'; ctx.lineWidth=14;
  ctx.beginPath(); ctx.moveTo(wallL.x,wallL.y); ctx.lineTo(wallR.x,wallR.y); ctx.stroke();
  ctx.strokeStyle='#33aa44'; ctx.lineWidth=7;
  ctx.beginPath(); ctx.moveTo(wallL.x,wallL.y); ctx.lineTo(wallR.x,wallR.y); ctx.stroke();

  // Outfield grass (warning track + green)
  const homeL=perspPt(0,0), homeR=perspPt(1,0);
  // Warning track (brown)
  const wL=perspPt(0,0.88), wR=perspPt(1,0.88);
  ctx.fillStyle='#b06030';
  ctx.beginPath(); ctx.moveTo(wL.x,wL.y); ctx.lineTo(wR.x,wR.y); ctx.lineTo(wallR.x,wallR.y); ctx.lineTo(wallL.x,wallL.y); ctx.closePath(); ctx.fill();

  // Outfield green
  const grd2=ctx.createLinearGradient(W/2,VP.y,W/2,H);
  grd2.addColorStop(0,'#2a8a35'); grd2.addColorStop(1,'#3daa48');
  ctx.fillStyle=grd2;
  ctx.beginPath(); ctx.moveTo(homeL.x,homeL.y); ctx.lineTo(homeR.x,homeR.y); ctx.lineTo(wR.x,wR.y); ctx.lineTo(wL.x,wL.y); ctx.closePath(); ctx.fill();

  // Grass stripes (perspective)
  for(let i=0;i<9;i++){
    if(i%2===0) continue;
    const f0=i/9, f1=(i+1)/9;
    const a=perspPt(0,f0),b=perspPt(1,f0),c=perspPt(1,f1),d=perspPt(0,f1);
    ctx.fillStyle='rgba(0,0,0,0.07)';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath(); ctx.fill();
  }

  // Infield dirt (diamond shape in perspective)
  const ifL=perspPt(0.22,0.28), ifR=perspPt(0.78,0.28);
  const ifHomeL=perspPt(0.3,0.05), ifHomeR=perspPt(0.7,0.05);
  ctx.fillStyle='#c07840';
  ctx.beginPath();
  ctx.moveTo(ifHomeL.x,ifHomeL.y); ctx.lineTo(ifHomeR.x,ifHomeR.y);
  ctx.lineTo(ifR.x,ifR.y); ctx.lineTo(ifL.x,ifL.y);
  ctx.closePath(); ctx.fill();

  // Infield grass overlay
  ctx.fillStyle='#35a045';
  ctx.beginPath();
  const midTop=perspPt(0.5,0.28);
  const midMid=perspPt(0.5,0.15);
  ctx.moveTo(ifL.x,ifL.y); ctx.lineTo(midTop.x,midTop.y); ctx.lineTo(ifR.x,ifR.y);
  ctx.lineTo(perspPt(0.65,0.1).x,perspPt(0.65,0.1).y);
  ctx.lineTo(perspPt(0.5,0.22).x,perspPt(0.5,0.22).y);
  ctx.lineTo(perspPt(0.35,0.1).x,perspPt(0.35,0.1).y);
  ctx.closePath(); ctx.fill();

  // Foul lines
  ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=2; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(homeL.x+W*0.12,homeL.y); ctx.lineTo(perspPt(0,0.92).x,perspPt(0,0.92).y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(homeR.x-W*0.12,homeR.y); ctx.lineTo(perspPt(1,0.92).x,perspPt(1,0.92).y); ctx.stroke();
  ctx.setLineDash([]);

  // Pitcher's mound
  const mound=perspPt(0.5,0.52);
  ctx.fillStyle='#b07040';
  ctx.beginPath(); ctx.ellipse(mound.x,mound.y,22,11,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c88048';
  ctx.beginPath(); ctx.ellipse(mound.x,mound.y-2,14,7,0,0,Math.PI*2); ctx.fill();

  // Bases
  const bases=[
    perspPt(0.75,0.32), // 1st
    perspPt(0.5,0.55),  // 2nd
    perspPt(0.25,0.32), // 3rd
  ];
  bases.forEach((bp,i)=>{
    const occ=G.bases[i];
    ctx.save(); ctx.translate(bp.x,bp.y); ctx.rotate(Math.PI/4);
    rr(-8,-8,16,16,2,occ?'#ffcc00':'#fff');
    ctx.restore();
  });

  // Home plate
  const platePt=perspPt(0.5,0.06);
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.moveTo(platePt.x,platePt.y-10); ctx.lineTo(platePt.x+10,platePt.y);
  ctx.lineTo(platePt.x+8,platePt.y+10); ctx.lineTo(platePt.x-8,platePt.y+10);
  ctx.lineTo(platePt.x-10,platePt.y); ctx.closePath(); ctx.fill();

  // Foreground grass (in front of plate)
  const fg=ctx.createLinearGradient(0,H*0.88,0,H);
  fg.addColorStop(0,'#3daa48'); fg.addColorStop(1,'#2d8838');
  ctx.fillStyle=fg; ctx.fillRect(0,H*0.88,W,H*0.12);

  // Dirt batters box
  ctx.fillStyle='#b07040';
  ctx.beginPath(); ctx.ellipse(W*0.38,H*0.88,40,15,0,0,Math.PI*2); ctx.fill();
}

// ── CARTOON PLAYER ─────────────────────────────────────────────────────────
function drawPlayer(px,py,s,p,dir=1){
  ctx.save(); ctx.translate(px,py); ctx.scale(dir,1);
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0,15*s,10*s,4*s,0,0,Math.PI*2); ctx.fill();
  // legs
  ctx.fillStyle='#fff'; ctx.fillRect(-9*s,-2*s,8*s,18*s); ctx.fillRect(2*s,-2*s,8*s,18*s);
  // shoes
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.ellipse(-5*s,16*s,8*s,4*s,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6*s,16*s,8*s,4*s,0,0,Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle=p.uni; ctx.beginPath(); ctx.roundRect(-13*s,-34*s,26*s,34*s,4*s); ctx.fill();
  // arms
  ctx.fillStyle=p.skin; ctx.fillRect(-21*s,-30*s,10*s,9*s); ctx.fillRect(12*s,-30*s,10*s,9*s);
  // head
  ctx.fillStyle=p.skin; ctx.beginPath(); ctx.arc(0,-44*s,15*s,0,Math.PI*2); ctx.fill();
  // hair
  ctx.fillStyle=p.hair; ctx.beginPath(); ctx.arc(0,-51*s,11*s,Math.PI,0); ctx.fill();
  // hat brim
  ctx.fillStyle=p.uni; ctx.fillRect(-16*s,-54*s,32*s,5*s);
  // hat
  ctx.beginPath(); ctx.roundRect(-10*s,-68*s,20*s,16*s,3*s); ctx.fill();
  ctx.fillStyle=p.acc; ctx.fillRect(-4*s,-68*s,8*s,3*s);
  // eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-5*s,-44*s,3.5*s,4*s,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5*s,-44*s,3.5*s,4*s,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.arc(-5*s,-43*s,2*s,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5*s,-43*s,2*s,0,Math.PI*2); ctx.fill();
  // smile
  ctx.strokeStyle='#333'; ctx.lineWidth=1.5*s;
  ctx.beginPath(); ctx.arc(0,-40*s,5*s,0.2,Math.PI-0.2); ctx.stroke();
  ctx.restore();
}

// ── SCOREBOARD ─────────────────────────────────────────────────────────────
function drawScoreboard(){
  rr(8,8,240,95,12,'rgba(0,0,20,0.88)','rgba(100,150,255,0.3)',2);
  const half=G.half==='top'?'▲ AI bats':'▼ You bat';
  t(`Inning ${G.inning}  ${half}`,128,30,13,'#aaddff');
  t(`Balls: ${G.balls}  Strikes: ${G.strikes}  Outs: ${'●'.repeat(G.outs)}${'○'.repeat(OUTS_PER-G.outs)}`,128,52,12,'#fff');
  rr(15,60,100,36,6,'rgba(255,200,0,0.15)');
  rr(125,60,115,36,6,'rgba(100,180,255,0.15)');
  t('YOU',65,74,11,'#ffcc44'); t(`${G.score.player}`,65,92,20,'#ffcc00',undefined,true);
  t(aiName,182,74,11,'#88bbff'); t(`${G.score.ai}`,182,92,20,'#88aaff',undefined,true);
}

// ── PITCH BUTTONS (your turn to pitch) ────────────────────────────────────
const PITCHES=[
  {type:'fastball',label:'Fastball',col:'#dd3333',desc:'Fast & straight',spd:0.038,curve:0},
  {type:'curve',   label:'Curveball',col:'#3366dd',desc:'Slow, breaks away',spd:0.022,curve:1},
  {type:'changeup',label:'Changeup',col:'#33aa44',desc:'Very slow, deceives',spd:0.015,curve:0.4},
];

function drawPitchButtons(){
  rr(W/2-220,H-110,440,95,14,'rgba(0,0,0,0.75)','rgba(255,255,255,0.15)',1);
  st('YOUR TURN TO PITCH — pick a pitch:',W/2,H-88,15,'#fff');
  PITCHES.forEach((p,i)=>{
    const bx=W/2-200+i*145, by=H-75, bw=130, bh=50;
    const hover=mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh;
    rr(bx,by,bw,bh,10,hover?p.col:p.col+'88','rgba(255,255,255,0.4)',hover?3:1);
    t(p.label,bx+bw/2,by+20,14,'#fff');
    t(p.desc,bx+bw/2,by+36,10,'rgba(255,255,255,0.75)');
    if(btnHit(bx,by,bw,bh)) throwBall(p.type, false);
  });
}

// ── SWING BAR ──────────────────────────────────────────────────────────────
function initSwing(batter){
  const spd = 1.1 + (10-batter.con)*0.12; // slow! 1.1–2.3
  swing={pos:0,dir:1,spd,hit:false,active:true};
}
function updateSwing(){
  if(!swing||swing.hit||!swing.active) return;
  swing.pos+=swing.dir*swing.spd;
  if(swing.pos>=100){swing.pos=100;swing.dir=-1;}
  if(swing.pos<=0)  {swing.pos=0;  swing.dir=1;}
}
function drawSwingBar(batter){
  if(!swing||!swing.active) return;
  const bx=W/2-180,by=H-48,bw=360,bh=30;
  // shadow bg
  rr(bx-4,by-4,bw+8,bh+8,12,'rgba(0,0,0,0.7)');
  ctx.fillStyle='#222'; ctx.fillRect(bx,by,bw,bh);
  // green zone (wide!)
  const gw=28+batter.con*2.2;
  ctx.fillStyle='#22cc55';
  ctx.fillRect(bx+(50-gw/2)/100*bw,by,gw/100*bw,bh);
  // power zone (center)
  const pw=8+batter.pow*0.8;
  ctx.fillStyle='#ff3300';
  ctx.fillRect(bx+(50-pw/2)/100*bw,by,pw/100*bw,bh);
  // labels inside bar
  t('MISS',bx+30,by+bh/2+5,11,'rgba(255,255,255,0.4)','left',false);
  t('HIT',bx+bw/2,by+bh/2+5,11,'rgba(0,0,0,0.6)','center',true);
  t('💥',bx+bw/2,by+bh/2+5,13,'rgba(255,100,0,0.8)');
  t('MISS',bx+bw-30,by+bh/2+5,11,'rgba(255,255,255,0.4)','right',false);
  // cursor line
  const cx=bx+swing.pos/100*bw;
  ctx.fillStyle='#fff';
  ctx.fillRect(cx-3,by-8,6,bh+16);
  // instruction
  st('SPACE or CLICK to swing!',W/2,by-12,15,'#ffdd88');
}

function playerSwing(){
  if(!swing||swing.hit||!swing.active) return;
  swing.hit=true; swing.active=false;
  const batter=currentBatter(false);
  const gw=28+batter.con*2.2;
  const pw=8+batter.pow*0.8;
  const pos=swing.pos;
  const inGreen=pos>=(50-gw/2)&&pos<=(50+gw/2);
  const inPower=pos>=(50-pw/2)&&pos<=(50+pw/2);
  resolveSwing(inGreen,inPower,batter,false);
}

function resolveSwing(inGreen,inPower,batter,isAI){
  if(!inGreen){
    G.strikes++; showMsg('SWING AND MISS!','#ff8800');
    checkCount(isAI);
    if(!showingResult) setTimeout(()=>resetAtBat(isAI),900);
  } else if(inPower){
    const hr=Math.random()<0.18+batter.pow*0.035;
    if(hr){ resolveHit('homerun',isAI); }
    else   { resolveHit(Math.random()<0.55?'double':'single',isAI); }
  } else {
    const r=Math.random();
    if     (r<0.28){ G.outs++; showMsg('GROUNDOUT!','#ff5555'); checkInning(); setTimeout(()=>resetAtBat(isAI),1000); }
    else if(r<0.46){ G.outs++; showMsg('FLY OUT!','#ff5555');   checkInning(); setTimeout(()=>resetAtBat(isAI),1000); }
    else if(r<0.68){ resolveHit('single',isAI); }
    else if(r<0.85){ resolveHit('double',isAI); }
    else            { resolveHit('triple',isAI); }
  }
}

function resolveHit(type,isAI){
  let runs=0;
  if(type==='homerun'){
    runs=1+G.bases.filter(Boolean).length; G.bases=[false,false,false];
    showMsg('HOME RUN!! 🎉','#ffcc00');
  } else if(type==='triple'){
    runs=G.bases.filter(Boolean).length; G.bases=[false,false,true];
    showMsg('TRIPLE! 🔥','#ffaa00');
  } else if(type==='double'){
    const nb=G.bases[2]?1:0; const nb2=G.bases[1]; const nb3=G.bases[0];
    runs=G.bases[2]?1:0;
    G.bases=[false,G.bases[0]||false,G.bases[1]||false];
    showMsg('DOUBLE!','#44ffff');
  } else {
    runs=G.bases[2]?1:0;
    G.bases[2]=G.bases[1]; G.bases[1]=G.bases[0]; G.bases[0]=true;
    showMsg('SINGLE!','#44ff88');
  }
  if(runs>0){
    if(isAI) G.score.ai+=runs; else G.score.player+=runs;
    setTimeout(()=>showMsg(`${runs} RUN${runs>1?'S':''} SCORED!`,'#ffcc00'),600);
  }
  G.strikes=0; G.balls=0;
  setTimeout(()=>{ nextBatter(isAI); },1400);
}

// ── COUNT LOGIC ────────────────────────────────────────────────────────────
function checkCount(isAI){
  if(G.strikes>=3){
    showMsg('STRIKEOUT! ⚾','#ff3300'); G.outs++; G.strikes=0; G.balls=0;
    checkInning();
    setTimeout(()=>nextBatter(isAI),1200);
  } else if(G.balls>=4){
    showMsg('WALK!','#88aaff');
    walkBatter(isAI); G.strikes=0; G.balls=0;
  }
}
function walkBatter(isAI){
  if(G.bases[0]&&G.bases[1]&&G.bases[2]){
    if(isAI) G.score.ai++; else G.score.player++;
  }
  if(G.bases[0]&&G.bases[1]) G.bases[2]=true;
  if(G.bases[0]) G.bases[1]=true;
  G.bases[0]=true;
  setTimeout(()=>nextBatter(isAI),1200);
}
function checkInning(){
  if(G.outs>=OUTS_PER) setTimeout(endHalf,1400);
}
function endHalf(){
  G.outs=0; G.strikes=0; G.balls=0; G.bases=[false,false,false];
  if(G.half==='top') G.half='bottom';
  else { G.inning++; G.half='top'; if(G.inning>INNINGS){ G.phase='gameover'; countCoins(); return; } }
  ball=null; swing=null;
}
function nextBatter(isAI){
  if(G.phase!=='game') return;
  G.strikes=0; G.balls=0;
  ball=null; swing=null;
  if(G.half==='bottom'){
    G.playerBatIdx=(G.playerBatIdx+1)%G.playerLineup.length;
  }
  // AI bats: start next pitch after short delay
  if(G.half==='top') setTimeout(()=>aiStartPitch(),800);
}
function resetAtBat(isAI){
  ball=null; swing=null;
  if(G.phase!=='game') return;
  if(G.half==='top') setTimeout(()=>aiStartPitch(),600);
}

// ── CURRENT BATTER ─────────────────────────────────────────────────────────
function currentBatter(isAI){
  if(isAI){
    // AI batter has fixed mid-stats
    return {pow:6,con:6,name:aiName,skin:'#aaddff',hair:'#333',uni:'#334488',acc:'#88aaff'};
  }
  return getP(G.playerLineup[G.playerBatIdx%G.playerLineup.length]);
}

// ── BALL ANIMATION ─────────────────────────────────────────────────────────
const moundPt = () => perspPt(0.5, 0.52);
const platePt = () => perspPt(0.5, 0.06);

function throwBall(pitchType, isAIPitching){
  const def=PITCHES.find(p=>p.type===pitchType);
  // Determine if pitch is in zone (for ball/strike call)
  const inZone=Math.random()<0.65; // 65% in zone
  const curveDir=Math.random()<0.5?1:-1;
  ball={
    t:0, spd:def.spd, type:pitchType,
    curveAmt:def.curve*curveDir*(inZone?0.3:0.9),
    inZone,
    isAIPitching,
    done:false,
  };
  // Start swing bar for batter
  const batter=currentBatter(!isAIPitching);
  initSwing(batter);
  // If AI is batting, schedule AI swing decision
  if(!isAIPitching){
    const aiSwingDelay = 200 + Math.random()*400;
    setTimeout(()=>aiSwingDecision(inZone), aiSwingDelay);
  }
}

function updateBall(){
  if(!ball||ball.done) return;
  ball.t=Math.min(1,ball.t+ball.spd);
  if(ball.t>=1 && !ball.done){
    ball.done=true;
    if(swing&&!swing.hit){
      // No swing
      swing.active=false;
      if(ball.inZone){ G.strikes++; showMsg('STRIKE!','#ff4444'); }
      else            { G.balls++;  showMsg('Ball!','#88aaff'); }
      checkCount(ball.isAIPitching?false:true);
      if(G.phase==='game') setTimeout(()=>resetAtBat(!ball.isAIPitching),900);
    }
  }
}

function drawBall(){
  if(!ball) return;
  const mp=moundPt(), pp=platePt();
  const t2=ball.t;
  const curve=Math.sin(t2*Math.PI)*ball.curveAmt*80;
  const bx=lerp(mp.x,pp.x,t2)+curve;
  // arc: ball rises slightly then drops
  const arc=Math.sin(t2*Math.PI)*-15;
  const by=lerp(mp.y,pp.y,t2)+arc;
  const r=lerp(3,14,Math.pow(t2,0.6));
  // glow
  const grd=ctx.createRadialGradient(bx,by,0,bx,by,r*2.5);
  grd.addColorStop(0,'rgba(255,255,230,0.5)'); grd.addColorStop(1,'rgba(255,255,230,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(bx,by,r*2.5,0,Math.PI*2); ctx.fill();
  // ball
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
  // seams
  ctx.strokeStyle='#cc3333'; ctx.lineWidth=Math.max(1,r*0.18);
  ctx.beginPath(); ctx.arc(bx,by,r*0.7,0.3,1.1); ctx.stroke();
  ctx.beginPath(); ctx.arc(bx,by,r*0.7,Math.PI+0.3,Math.PI+1.1); ctx.stroke();
}

// ── AI PITCHER ─────────────────────────────────────────────────────────────
function aiStartPitch(){
  if(G.phase!=='game'||G.half!=='top') return;
  if(ball||showingResult) return;
  const pick=PITCHES[Math.floor(Math.random()*PITCHES.length)];
  // Show "AI is pitching" message briefly
  showMsg(`${aiName} throws ${pick.label}!`,'#88aaff',50);
  setTimeout(()=>throwBall(pick.type,true),600);
}

// ── AI BATTER ──────────────────────────────────────────────────────────────
function aiSwingDecision(inZone){
  if(!swing||swing.hit) return;
  // AI swings at strikes (80%) and chases balls (25%)
  const willSwing = inZone ? Math.random()<0.80 : Math.random()<0.25;
  if(!willSwing) return;
  // AI hits in green zone based on skill
  const aiHitsGreen=Math.random()<G.aiSkill;
  const batter=currentBatter(true);
  const gw=28+batter.con*2.2;
  const pw=8+batter.pow*0.8;
  // Place cursor in appropriate zone
  let fakePos;
  if(aiHitsGreen){
    const inPow=Math.random()<0.3;
    if(inPow) fakePos=lerp(50-pw/2,50+pw/2,Math.random());
    else      fakePos=lerp(50-gw/2,50+gw/2,Math.random());
  } else {
    fakePos=Math.random()<0.5 ? Math.random()*(50-gw/2) : (50+gw/2)+Math.random()*(50-gw/2);
  }
  swing.pos=clamp(fakePos,0,100);
  swing.hit=true; swing.active=false;
  const inGreen2=fakePos>=(50-gw/2)&&fakePos<=(50+gw/2);
  const inPower2=fakePos>=(50-pw/2)&&fakePos<=(50+pw/2);
  resolveSwing(inGreen2,inPower2,batter,false);
}

// ── MSG ─────────────────────────────────────────────────────────────────────
function showMsg(str,col='#fff',dur=80){
  G.resultText=str; G.resultColor=col; G.resultTimer=dur;
  showingResult=dur>0;
  if(dur>0) setTimeout(()=>showingResult=false,(dur/60)*1000+200);
}

// ── COINS ──────────────────────────────────────────────────────────────────
function countCoins(){
  if(G.coinsCounted) return; G.coinsCounted=true;
  const earned=30+G.score.player*12+G.score.ai*5;
  G.coinsEarned=earned; save.coins+=earned; persist();
}

// ── SCREENS ────────────────────────────────────────────────────────────────
function drawMenu(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d1b3e'); bg.addColorStop(1,'#0a2a14');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){
    ctx.fillStyle=`rgba(255,255,255,${0.4+Math.random()*0.4})`;
    ctx.beginPath(); ctx.arc((i*173+7)%W,(i*97+11)%(H*0.5),i%7===0?1.5:0.8,0,Math.PI*2); ctx.fill();
  }
  drawStadium();
  // Draw two characters on field
  if(getP(1)) drawPlayer(W*0.35,H*0.84,1.1,getP(1),1);
  const aiBot={pow:6,con:6,name:aiName,skin:'#aaddff',hair:'#334',uni:'#334488',acc:'#88aaff'};
  drawPlayer(W*0.65,H*0.84,1.1,aiBot,-1);

  rr(W/2-240,H*0.08,480,100,18,'rgba(0,0,0,0.65)','rgba(100,180,255,0.3)',2);
  st('⚾  BASEBALL 9',W/2,H*0.08+60,52,'#ffdd00');
  t('Ryan & Nathan Edition  —  vs Robot',W/2,H*0.08+88,17,'#aaddff');

  btn('▶  PLAY',W/2-115,H*0.55,230,60,'#22aa44');
  btn('🛒  SHOP',W/2-100,H*0.55+74,200,50,'#aa6600');
  t(`🪙 ${save.coins} coins`,W/2,H*0.55+144,16,'#ffcc00');

  if(btnHit(W/2-115,H*0.55,230,60)){ G.lineupSel=[]; G.phase='lineup'; }
  if(btnHit(W/2-100,H*0.55+74,200,50)) G.phase='shop';
}

function drawLineup(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d1b3e'); bg.addColorStop(1,'#1a0d3e');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  st('Pick Your Lineup  (pick 2–4)',W/2,50,26,'#fff');
  t(`${G.lineupSel.length} selected`,W/2,78,15,'#aaa');

  const avail=ROSTER.filter(p=>save.unlocked.includes(p.id));
  const cols=Math.min(avail.length,4);
  const cellW=Math.floor((W-40)/cols);
  avail.forEach((p,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const cx=20+cellW*col+cellW/2, cy=105+row*210+90;
    const sel=G.lineupSel.includes(p.id);
    rr(cx-78,cy-92,156,178,12,sel?'#1a3a7a':'#1e1e3e',sel?'#ffcc00':'#445',2);
    drawPlayer(cx,cy-10,0.95,p,1);
    t(p.name,cx,cy+78,14,'#fff');
    t(`PWR ${p.pow}  CON ${p.con}`,cx,cy+96,11,'#aaa');
    if(sel) st('✓',cx+60,cy-82,22,'#ffcc00');
    if(jclick&&mx>=cx-78&&mx<=cx+78&&my>=cy-92&&my<=cy+86){
      if(sel) G.lineupSel=G.lineupSel.filter(id=>id!==p.id);
      else if(G.lineupSel.length<4) G.lineupSel.push(p.id);
    }
  });

  if(G.lineupSel.length>=2){
    btn('LET\'S PLAY! ▶',W/2-120,H-72,240,54,'#22aa44');
    if(btnHit(W/2-120,H-72,240,54)){
      G.playerLineup=G.lineupSel; G.playerBatIdx=0;
      G.phase='game';
      // Game starts with AI batting (top of 1st)
      setTimeout(()=>aiStartPitch(),1000);
    }
  } else {
    rr(W/2-120,H-72,240,54,10,'#333'); t('Pick at least 2',W/2,H-38,15,'#666');
  }
  btn('Shop 🛒',22,H-72,130,54,'#aa6600');
  if(btnHit(22,H-72,130,54)) G.phase='shop';
}

function drawShop(){
  ctx.fillStyle='#0d1020'; ctx.fillRect(0,0,W,H);
  st('🛒  SHOP',W/2,52,34,'#ffdd00');
  t(`🪙 ${save.coins} coins`,W/2,84,18,'#fff');
  const locked=ROSTER.filter(p=>!save.unlocked.includes(p.id));
  if(!locked.length){
    t('All players unlocked! 🎉',W/2,H/2,24,'#44ff88');
  } else {
    const cols=Math.min(locked.length,3), cw=Math.floor((W-40)/cols);
    locked.forEach((p,i)=>{
      const col=i%cols, row=Math.floor(i/cols);
      const cx=20+cw*col+cw/2, cy=130+row*240+105;
      const can=save.coins>=p.price;
      rr(cx-88,cy-105,176,200,12,'#1a1a3a','#445',2);
      drawPlayer(cx,cy-15,0.95,p,1);
      t(p.name,cx,cy+82,15,'#fff');
      t(`PWR ${p.pow}  CON ${p.con}`,cx,cy+100,11,'#aaa');
      btn(`🪙 ${p.price}`,cx-55,cy+112,110,36,can?'#22aa44':'#444',can?'#fff':'#888',14);
      if(can&&btnHit(cx-55,cy+112,110,36)){ save.coins-=p.price; save.unlocked.push(p.id); persist(); }
    });
  }
  btn('← Back',22,20,110,40,'#445');
  if(btnHit(22,20,110,40)) G.phase=G.inning>1?'gameover':'lineup';
}

function drawGame(){
  drawStadium();

  // Players in field
  const aiBot={pow:6,con:6,name:aiName,skin:'#aaddff',hair:'#334',uni:'#334488',acc:'#88aaff'};

  if(G.half==='top'){
    // AI batting, player pitching
    // Pitcher (player) on mound
    const pitcher=getP(G.playerLineup[0]);
    if(pitcher){ const mp=moundPt(); drawPlayer(mp.x,mp.y+10,0.55,pitcher,1); }
    // AI batter at plate
    const pp=perspPt(0.38,0.03);
    drawPlayer(pp.x,H*0.86,1.05,aiBot,-1);
    // bat
    ctx.save(); ctx.translate(pp.x-20,H*0.86-30); ctx.rotate(-0.65);
    ctx.fillStyle='#7a4a1a'; ctx.fillRect(-3,-38,6,44);
    ctx.fillStyle='#aa7740'; ctx.beginPath(); ctx.ellipse(0,-40,7,5,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  } else {
    // Player batting, AI pitching
    // AI pitcher on mound
    const mp=moundPt(); drawPlayer(mp.x,mp.y+10,0.55,aiBot,1);
    // Player batter
    const batter=getP(G.playerLineup[G.playerBatIdx%G.playerLineup.length]);
    const pp=perspPt(0.38,0.03);
    if(batter) drawPlayer(pp.x,H*0.86,1.05,batter,-1);
    // bat
    ctx.save(); ctx.translate(pp.x-20,H*0.86-30); ctx.rotate(-0.65);
    ctx.fillStyle='#7a4a1a'; ctx.fillRect(-3,-38,6,44);
    ctx.fillStyle='#aa7740'; ctx.beginPath(); ctx.ellipse(0,-40,7,5,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  drawScoreboard();
  updateBall(); drawBall();
  updateSwing();

  // Show appropriate UI
  if(G.half==='bottom'){
    // Player batting
    if(ball && !ball.done && swing && swing.active){
      const batter=getP(G.playerLineup[G.playerBatIdx%G.playerLineup.length]);
      if(batter) drawSwingBar(batter);
    } else if(!ball && !swing){
      // Waiting for AI to pitch
      rr(W/2-140,H-60,280,44,10,'rgba(0,0,0,0.7)');
      t(`${aiName} is winding up...`,W/2,H-32,16,'#88aaff');
    }
  } else {
    // Player pitching
    if(!ball) drawPitchButtons();
    else if(ball && !ball.done){
      rr(W/2-130,H-60,260,44,10,'rgba(0,0,0,0.7)');
      t('Ball in the air!',W/2,H-32,16,'#fff');
    }
  }

  // Result popup
  if(G.resultTimer>0){
    G.resultTimer--;
    const alpha=Math.min(1,G.resultTimer/25);
    ctx.globalAlpha=alpha;
    st(G.resultText,W/2,H/2-20,44,G.resultColor);
    ctx.globalAlpha=1;
  }

  // Inning transition overlay
  const halfLabel=G.half==='top'?`AI batting  |  You pitch`:`You batting  |  AI pitches`;
  t(halfLabel,W/2,H-8,12,'rgba(255,255,255,0.5)');
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,10,0.9)'; ctx.fillRect(0,0,W,H);
  st('GAME OVER',W/2,H/2-130,50,'#ffdd00');
  rr(W/2-200,H/2-95,400,100,14,'rgba(255,255,255,0.06)');
  st('YOU',W/2-90,H/2-55,20,'#ffcc44');
  st(`${G.score.player}`,W/2-90,H/2-18,44,'#fff');
  st(aiName,W/2+90,H/2-55,20,'#88bbff');
  st(`${G.score.ai}`,W/2+90,H/2-18,44,'#fff');
  const won=G.score.player>G.score.ai, tied=G.score.player===G.score.ai;
  st(won?'You Win! 🏆':tied?"It's a Tie!":`${aiName} Wins!`,W/2,H/2+38,34,won?'#ffcc00':tied?'#aaa':'#ff6666');
  t(`+${G.coinsEarned} coins earned  🪙`,W/2,H/2+78,17,'#ffcc00');
  t(`Total: ${save.coins} coins`,W/2,H/2+100,14,'#fff');
  btn('Play Again',W/2-125,H/2+120,250,56,'#22aa44');
  btn('Shop 🛒',W/2-80,H/2+190,160,48,'#aa6600',undefined,15);
  if(btnHit(W/2-125,H/2+120,250,56)){ newGame(); G.lineupSel=[]; G.phase='lineup'; }
  if(btnHit(W/2-80,H/2+190,160,48)) { G.phase='shop'; }
}

// ── MAIN LOOP ──────────────────────────────────────────────────────────────
function loop(){
  ctx.clearRect(0,0,W,H);
  switch(G.phase){
    case 'menu':     drawMenu();     break;
    case 'lineup':   drawLineup();   break;
    case 'shop':     drawShop();     break;
    case 'game':
      drawGame();
      // Player swings with space or click during batting
      if(G.half==='bottom' && ball && !ball.done && swing && swing.active){
        if(spaceJustDown || (jclick && my > H*0.7)) playerSwing();
      }
      if(G.phase==='gameover') break;
      break;
    case 'gameover':
      drawStadium(); drawGameOver();
      break;
  }
  spaceJustDown=false; jclick=false;
  requestAnimationFrame(loop);
}
loop();
</script>
