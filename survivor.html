<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Survivor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
canvas{display:block;cursor:none}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
// ── SURVIVOR — arena wave shooter ─────────────────────────────
const C=document.getElementById('c'), ctx=C.getContext('2d');
const W=800,H=600;

// ── Audio ──────────────────────────────────────────────────────
const AC=new(window.AudioContext||window.webkitAudioContext)();
function tone(freq,dur,vol,type,delay){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.value=freq;
  const t=AC.currentTime+(delay||0);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.1,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.01);
}
function noise(dur,vol,delay){
  const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length*0.5);
  const n=AC.createBufferSource(),g=AC.createGain();
  n.buffer=buf;g.gain.value=vol||0.1;
  n.connect(g);g.connect(AC.destination);n.start(AC.currentTime+(delay||0));
}
const SND={
  shoot:()=>{ tone(320,0.08,0.08,'square'); tone(200,0.06,0.05,'sawtooth',0.02); },
  hit:()=>{ noise(0.05,0.06); tone(150,0.08,0.04,'sine'); },
  die:()=>{ noise(0.2,0.15); tone(80,0.3,0.1,'sawtooth'); tone(50,0.4,0.08,'sine',0.1); },
  hurt:()=>{ tone(200,0.15,0.12,'sawtooth'); noise(0.1,0.08); },
  upgrade:()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,0.2,0.1,'square',i*0.08)); },
  wave:()=>{ [200,300,400].forEach((f,i)=>tone(f,0.3,0.1,'square',i*0.1)); },
  pickup:()=>{ tone(660,0.1,0.08,'sine'); tone(880,0.1,0.06,'sine',0.08); },
};

// ── Constants ──────────────────────────────────────────────────
const ARENA={x:40,y:40,w:720,h:520};
const PLAYER_R=16, BULLET_SPD=620, MAX_BULLETS=120;

// ── Game state ─────────────────────────────────────────────────
let state='menu'; // menu|play|upgrade|dead
let wave=0,score=0,hiScore=0,kills=0,combo=0,comboTimer=0;
let screenShake=0,flashColor=null,flashAlpha=0;

// ── Player ─────────────────────────────────────────────────────
const P={
  x:W/2,y:H/2,vx:0,vy:0,
  hp:100,maxHp:100,
  speed:210,
  fireRate:0.22,fireCooldown:0,
  damage:20,
  bulletCount:1,bulletSpread:0,
  piercing:false,
  xp:0,xpNext:100,level:1,
  angle:0,
  invuln:0,
};
function resetPlayer(){
  P.x=W/2;P.y=H/2;P.vx=0;P.vy=0;
  P.hp=100;P.maxHp=100;P.speed=210;
  P.fireRate=0.22;P.fireCooldown=0;P.damage=20;
  P.bulletCount=1;P.bulletSpread=0;P.piercing=false;
  P.xp=0;P.xpNext=100;P.level=1;P.invuln=0;
}

// ── Input ──────────────────────────────────────────────────────
const keys={};
const mouse={x:W/2,y:H/2,down:false};
document.addEventListener('keydown',e=>{keys[e.code]=true;});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
C.addEventListener('mousemove',e=>{
  const r=C.getBoundingClientRect();
  mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;
});
C.addEventListener('mousedown',e=>{
  mouse.down=true;AC.resume();
  if(state==='menu'){startGame();return;}
  if(state==='dead'){startGame();return;}
});
C.addEventListener('mouseup',()=>mouse.down=false);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    AC.resume();
    if(state==='menu'){startGame();}
    else if(state==='dead'){startGame();}
  }
});

// ── Entities ────────────────────────────────────────────────────
let bullets=[], enemies=[], particles=[], xpOrbs=[], damageNums=[];

// ── Enemy types ────────────────────────────────────────────────
const ETYPES={
  runner:{r:14,speed:115,hp:40, color:'#f44',score:10,xp:8,  damage:12,shootCool:0},
  tank:  {r:22,speed:60, hp:180,color:'#f80',score:30,xp:25, damage:20,shootCool:0},
  speeder:{r:10,speed:190,hp:25,color:'#f4f',score:15,xp:10, damage:8, shootCool:0},
  shooter:{r:13,speed:55, hp:55,color:'#ff4',score:25,xp:20, damage:0, shootCool:2.2,bulletDmg:15},
  bomber:{r:18,speed:80, hp:70, color:'#4ff',score:20,xp:15, damage:30,shootCool:0,explodeOnDeath:true},
};

function spawnEnemy(type,x,y){
  const t=ETYPES[type];
  enemies.push({
    x:x??randEdge().x, y:y??randEdge().y,
    vx:0,vy:0,
    hp:t.hp*(1+wave*0.15),maxHp:t.hp*(1+wave*0.15),
    r:t.r, speed:t.speed*(1+wave*0.04),
    color:t.color, score:t.score, xp:t.xp,
    damage:t.damage, type,
    fireCooldown:Math.random()*t.shootCool,
    shootCool:t.shootCool,bulletDmg:t.bulletDmg||0,
    explodeOnDeath:t.explodeOnDeath||false,
    knockVx:0,knockVy:0,
    flashTimer:0,
  });
}

function randEdge(){
  const side=Math.floor(Math.random()*4);
  if(side===0) return {x:ARENA.x+Math.random()*ARENA.w, y:ARENA.y-20};
  if(side===1) return {x:ARENA.x+Math.random()*ARENA.w, y:ARENA.y+ARENA.h+20};
  if(side===2) return {x:ARENA.x-20, y:ARENA.y+Math.random()*ARENA.h};
  return {x:ARENA.x+ARENA.w+20, y:ARENA.y+Math.random()*ARENA.h};
}

// ── Particles ──────────────────────────────────────────────────
function burst(x,y,col,n,spd,life){
  for(let i=0;i<(n||12);i++){
    const a=Math.random()*Math.PI*2,v=(spd||150)+Math.random()*(spd||150);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
      r:1.5+Math.random()*3,life:life||0.7,maxLife:life||0.7,col});
  }
}
function ring(x,y,col){ particles.push({x,y,ring:true,r:0,maxR:60,life:0.5,maxLife:0.5,col}); }
function dmgNum(x,y,val,col){
  damageNums.push({x,y,val,col:col||'#ff4',life:1,vy:-60});
}

// ── Upgrades ───────────────────────────────────────────────────
const ALL_UPGRADES=[
  {name:'Damage Up',    desc:'+25% bullet damage',  icon:'💥', apply:()=>P.damage=Math.round(P.damage*1.25)},
  {name:'Fire Rate',    desc:'Shoot 25% faster',     icon:'⚡', apply:()=>P.fireRate=Math.max(0.06,P.fireRate*0.75)},
  {name:'Speed Boost',  desc:'+20% move speed',      icon:'👟', apply:()=>P.speed=Math.round(P.speed*1.2)},
  {name:'Max HP +40',   desc:'Increase max health',  icon:'❤️', apply:()=>{P.maxHp+=40;P.hp=Math.min(P.hp+40,P.maxHp);}},
  {name:'Heal',         desc:'Restore 50 HP',        icon:'💊', apply:()=>P.hp=Math.min(P.maxHp,P.hp+50)},
  {name:'Triple Shot',  desc:'Fire 3 bullets at once',icon:'🔱', apply:()=>{P.bulletCount=Math.min(7,P.bulletCount+2);P.bulletSpread=Math.max(P.bulletSpread,0.18);}},
  {name:'Piercing',     desc:'Bullets pierce enemies',icon:'🗡️', apply:()=>P.piercing=true},
  {name:'Rapid Fire',   desc:'Shoot even faster',    icon:'🌀', apply:()=>P.fireRate=Math.max(0.05,P.fireRate*0.65)},
  {name:'Big Damage',   desc:'+50% bullet damage',   icon:'💣', apply:()=>P.damage=Math.round(P.damage*1.5)},
  {name:'Full Heal',    desc:'Fully restore HP',     icon:'🌟', apply:()=>P.hp=P.maxHp},
];
let upgradeChoices=[], upgradeSelected=-1;

function pickUpgrades(){
  const pool=[...ALL_UPGRADES];
  upgradeChoices=[];
  for(let i=0;i<3;i++){
    const idx=Math.floor(Math.random()*pool.length);
    upgradeChoices.push(pool.splice(idx,1)[0]);
  }
}

// ── Wave spawning ──────────────────────────────────────────────
let waveTimer=0, waveSpawning=false, waveQueue=[], waveDelay=0;
let betweenWaves=false, betweenTimer=0;

function startWave(){
  wave++;
  waveSpawning=true;
  waveQueue=buildWave(wave);
  waveTimer=0;
  betweenWaves=false;
  SND.wave();
}

function buildWave(w){
  const q=[];
  // Each entry: [delay, type]
  const add=(d,t)=>q.push({d,t});

  if(w===1){
    for(let i=0;i<6;i++) add(i*0.6,'runner');
  } else if(w===2){
    for(let i=0;i<8;i++) add(i*0.5,'runner');
    add(2,'tank');
  } else if(w===3){
    for(let i=0;i<5;i++) add(i*0.5,'runner');
    for(let i=0;i<3;i++) add(1+i*0.7,'speeder');
    add(3,'tank');
  } else if(w===4){
    for(let i=0;i<6;i++) add(i*0.4,'speeder');
    add(1,'shooter');add(2.5,'shooter');
    add(4,'tank');
  } else if(w===5){
    for(let i=0;i<10;i++) add(i*0.35,'runner');
    for(let i=0;i<3;i++) add(i*0.8,'bomber');
    add(3,'tank');add(4,'tank');
  } else {
    // Wave 6+: scale up
    const n=Math.floor(w*1.8);
    for(let i=0;i<n;i++){
      const types=['runner','speeder','shooter','bomber','tank'];
      const weights=[3,2,2,1.5,1];
      let roll=Math.random()*9.5, pick='runner';
      let acc=0;
      for(let j=0;j<types.length;j++){acc+=weights[j];if(roll<acc){pick=types[j];break;}}
      add(i*0.25,pick);
    }
    // Boss tank every 5 waves
    if(w%5===0){
      add(0,'tank');add(0.3,'tank');add(0.6,'tank');
    }
  }
  return q.sort((a,b)=>a.d-b.d);
}

// ── XP orbs ───────────────────────────────────────────────────
function spawnXP(x,y,val){
  xpOrbs.push({x,y,val,r:5+val*0.1,vx:(Math.random()-0.5)*60,vy:(Math.random()-0.5)*60,life:12});
}

// ── Shooting ───────────────────────────────────────────────────
function shootAt(tx,ty){
  const baseAngle=Math.atan2(ty-P.y,tx-P.x);
  const half=(P.bulletCount-1)/2;
  for(let i=0;i<P.bulletCount;i++){
    const a=baseAngle+(i-half)*P.bulletSpread;
    bullets.push({
      x:P.x,y:P.y,
      vx:Math.cos(a)*BULLET_SPD,
      vy:Math.sin(a)*BULLET_SPD,
      damage:P.damage,r:5,
      piercing:P.piercing,hits:new Set(),
      life:1.2,player:true,
      trail:[],
    });
  }
  SND.shoot();
}

function enemyShoot(e){
  const a=Math.atan2(P.y-e.y,P.x-e.x);
  const spd=300;
  bullets.push({
    x:e.x,y:e.y,
    vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
    damage:e.bulletDmg,r:6,
    life:1.8,player:false,
    col:'#f44',
  });
  burst(e.x,e.y,e.color,4,80,0.3);
}

// ── Collision helpers ─────────────────────────────────────────
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function clampArena(ent){
  ent.x=clamp(ent.x,ARENA.x+ent.r,ARENA.x+ARENA.w-ent.r);
  ent.y=clamp(ent.y,ARENA.y+ent.r,ARENA.y+ARENA.h-ent.r);
}

// ── Main update ────────────────────────────────────────────────
let last=performance.now();

function startGame(){
  state='play';wave=0;score=0;kills=0;combo=0;comboTimer=0;
  bullets=[];enemies=[];particles=[];xpOrbs=[];damageNums=[];
  resetPlayer();
  betweenWaves=true;betweenTimer=1.5;
}

function update(dt){
  if(state==='upgrade') return;
  if(state!=='play') return;

  screenShake=Math.max(0,screenShake-dt*10);
  flashAlpha=Math.max(0,flashAlpha-dt*4);
  comboTimer=Math.max(0,comboTimer-dt);
  if(comboTimer<=0) combo=0;

  // Between waves countdown
  if(betweenWaves){
    betweenTimer-=dt;
    if(betweenTimer<=0){ betweenWaves=false; startWave(); }
    updateParticles(dt); updateXP(dt); updateDmgNums(dt);
    return;
  }

  // Wave spawning
  if(waveSpawning&&waveQueue.length){
    waveTimer+=dt;
    while(waveQueue.length&&waveQueue[0].d<=waveTimer){
      spawnEnemy(waveQueue.shift().t);
    }
    if(!waveQueue.length) waveSpawning=false;
  }

  // Wave clear
  if(!waveSpawning&&enemies.length===0){
    betweenWaves=true;
    betweenTimer=3.5;
    state='upgrade';
    pickUpgrades();
    upgradeSelected=-1;
    return;
  }

  // Player movement
  let mx=0,my=0;
  if(keys['KeyW']||keys['ArrowUp'])    my=-1;
  if(keys['KeyS']||keys['ArrowDown'])  my= 1;
  if(keys['KeyA']||keys['ArrowLeft'])  mx=-1;
  if(keys['KeyD']||keys['ArrowRight']) mx= 1;
  if(mx||my){const l=Math.sqrt(mx*mx+my*my);mx/=l;my/=l;}
  P.vx+=(mx*P.speed-P.vx)*Math.min(1,dt*14);
  P.vy+=(my*P.speed-P.vy)*Math.min(1,dt*14);
  P.x+=P.vx*dt; P.y+=P.vy*dt;
  clampArena(P);
  P.angle=Math.atan2(mouse.y-P.y,mouse.x-P.x);
  P.invuln=Math.max(0,P.invuln-dt);

  // Player shoot
  P.fireCooldown=Math.max(0,P.fireCooldown-dt);
  if(mouse.down&&P.fireCooldown<=0){
    shootAt(mouse.x,mouse.y);
    P.fireCooldown=P.fireRate;
  }

  // Update bullets
  bullets=bullets.filter(b=>{
    b.life-=dt;
    if(b.life<=0) return false;
    if(b.trail) b.trail.push({x:b.x,y:b.y});
    if(b.trail&&b.trail.length>6) b.trail.shift();
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    // Wall bounce for enemy bullets; kill player bullets on wall
    if(b.x<ARENA.x||b.x>ARENA.x+ARENA.w||b.y<ARENA.y||b.y>ARENA.y+ARENA.h){
      if(!b.player){
        b.vx*=-1;b.vy*=-1;
        b.x=clamp(b.x,ARENA.x,ARENA.x+ARENA.w);
        b.y=clamp(b.y,ARENA.y,ARENA.y+ARENA.h);
      } else return false;
    }
    return true;
  });

  // Player bullets vs enemies
  for(const b of bullets){
    if(!b.player) continue;
    for(const e of enemies){
      if(b.hits&&b.hits.has(e)) continue;
      const dist=Math.hypot(b.x-e.x,b.y-e.y);
      if(dist<e.r+b.r){
        e.hp-=b.damage;
        e.flashTimer=0.12;
        e.knockVx+=(b.vx/BULLET_SPD)*120;
        e.knockVy+=(b.vy/BULLET_SPD)*120;
        burst(b.x,b.y,e.color,6,100,0.4);
        dmgNum(e.x,e.y-e.r,Math.round(b.damage));
        SND.hit();
        if(b.piercing) b.hits.add(e);
        else { b.life=0; break; }
      }
    }
  }

  // Enemy bullets vs player
  for(const b of bullets){
    if(b.player||P.invuln>0) continue;
    if(Math.hypot(b.x-P.x,b.y-P.y)<PLAYER_R+b.r){
      b.life=0;
      P.hp-=b.damage;
      P.invuln=0.4;
      screenShake=0.5; flashColor='#f44'; flashAlpha=0.25;
      burst(P.x,P.y,'#f44',8,120,0.5);
      SND.hurt();
      if(P.hp<=0){SND.die();state='dead';hiScore=Math.max(hiScore,score);return;}
    }
  }

  // Update enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.flashTimer=Math.max(0,e.flashTimer-dt);

    // Knockback decay
    e.knockVx*=0.8; e.knockVy*=0.8;

    // AI: chase player
    const a=Math.atan2(P.y-e.y,P.x-e.x);
    e.vx=Math.cos(a)*e.speed+e.knockVx;
    e.vy=Math.sin(a)*e.speed+e.knockVy;
    e.x+=e.vx*dt; e.y+=e.vy*dt;
    clampArena(e);

    // Enemy shoot
    if(e.shootCool>0){
      e.fireCooldown-=dt;
      if(e.fireCooldown<=0){
        e.fireCooldown=e.shootCool*(0.8+Math.random()*0.4);
        enemyShoot(e);
      }
    }

    // Enemy touches player
    if(P.invuln<=0&&Math.hypot(e.x-P.x,e.y-P.y)<e.r+PLAYER_R){
      P.hp-=e.damage*dt*3;
      P.invuln=0.15;
      screenShake=0.3; flashColor='#f44'; flashAlpha=0.18;
      if(P.hp<=0){SND.die();state='dead';hiScore=Math.max(hiScore,score);return;}
    }

    // Enemy separation
    for(let j=0;j<enemies.length;j++){
      if(i===j) continue;
      const o=enemies[j],dx=e.x-o.x,dy=e.y-o.y;
      const d=Math.hypot(dx,dy);
      if(d<e.r+o.r&&d>0){
        const push=(e.r+o.r-d)*0.3;
        e.x+=dx/d*push; e.y+=dy/d*push;
        clampArena(e);
      }
    }

    // Enemy death
    if(e.hp<=0){
      const pts=e.score*(1+Math.floor(kills/15));
      score+=pts*(combo>1?combo:1);
      kills++; combo++; comboTimer=3.5;
      P.xp+=e.xp;
      burst(e.x,e.y,e.color,20,200,0.8);
      ring(e.x,e.y,e.color);
      dmgNum(e.x,e.y,'+'+(pts*(combo>1?combo:1)),'#ff4');
      if(e.explodeOnDeath){
        screenShake=0.6;
        for(const ne of enemies){
          const d2=Math.hypot(ne.x-e.x,ne.y-e.y);
          if(d2<80&&ne!==e){ ne.hp-=60; ne.knockVx+=(ne.x-e.x)/d2*300; ne.knockVy+=(ne.y-e.y)/d2*300; }
        }
        if(Math.hypot(P.x-e.x,P.y-e.y)<80){ P.hp-=25; P.invuln=0.5; flashColor='#4ff';flashAlpha=0.2; }
      }
      spawnXP(e.x,e.y,e.xp);
      SND.die();
      enemies.splice(i,1);
    }
  }

  // XP orbs
  updateXP(dt);

  // Player level up
  while(P.xp>=P.xpNext){
    P.xp-=P.xpNext; P.level++;
    P.xpNext=Math.round(P.xpNext*1.4);
    burst(P.x,P.y,'#ff4',20,200,1);
    ring(P.x,P.y,'#ff4');
    SND.upgrade();
  }

  updateParticles(dt);
  updateDmgNums(dt);
}

function updateXP(dt){
  for(let i=xpOrbs.length-1;i>=0;i--){
    const xp=xpOrbs[i];
    xp.life-=dt;
    // Attract to player when nearby
    const dist=Math.hypot(P.x-xp.x,P.y-xp.y);
    if(dist<120){
      const spd=300+((120-dist)/120)*400;
      const a=Math.atan2(P.y-xp.y,P.x-xp.x);
      xp.vx=Math.cos(a)*spd; xp.vy=Math.sin(a)*spd;
    } else { xp.vx*=0.95; xp.vy*=0.95; }
    xp.x+=xp.vx*dt; xp.y+=xp.vy*dt;
    if(dist<PLAYER_R+xp.r||xp.life<=0){
      if(dist<PLAYER_R+xp.r){ P.xp+=xp.val; SND.pickup(); }
      xpOrbs.splice(i,1);
    }
  }
}

function updateParticles(dt){
  particles=particles.filter(p=>{
    p.life-=dt;
    if(p.ring){ p.r=p.maxR*(1-p.life/p.maxLife); return p.life>0; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=200*dt; p.vx*=0.97;
    return p.life>0;
  });
}
function updateDmgNums(dt){
  damageNums=damageNums.filter(d=>{d.y+=d.vy*dt;d.life-=dt;return d.life>0;});
}

// ── Draw ───────────────────────────────────────────────────────
// Stars background
const STARS=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()<0.1?2:1,b:Math.random()}));

function drawBG(){
  ctx.fillStyle='#080810'; ctx.fillRect(0,0,W,H);
  // Stars
  for(const s of STARS){
    const a=0.2+s.b*0.6+Math.sin(Date.now()*0.001+s.b*10)*0.15;
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  // Arena
  const {x,y,w,h}=ARENA;
  ctx.fillStyle='rgba(20,20,50,0.6)'; ctx.fillRect(x,y,w,h);
  // Grid
  ctx.strokeStyle='rgba(80,80,180,0.08)'; ctx.lineWidth=1;
  for(let gx=x;gx<=x+w;gx+=40){ ctx.beginPath(); ctx.moveTo(gx,y); ctx.lineTo(gx,y+h); ctx.stroke(); }
  for(let gy=y;gy<=y+h;gy+=40){ ctx.beginPath(); ctx.moveTo(x,gy); ctx.lineTo(x+w,gy); ctx.stroke(); }
  // Arena border glow
  const pulse=0.6+Math.sin(Date.now()*0.003)*0.4;
  ctx.shadowColor='#44f'; ctx.shadowBlur=12*pulse;
  ctx.strokeStyle=`rgba(80,80,255,${0.5+pulse*0.3})`; ctx.lineWidth=2;
  ctx.strokeRect(x,y,w,h);
  ctx.shadowBlur=0;
}

function glow(col,b){ ctx.shadowColor=col; ctx.shadowBlur=b||12; }
function noGlow(){ ctx.shadowBlur=0; }

function drawPlayer(){
  const {x,y,angle}=P;
  ctx.save();
  ctx.translate(x,y);

  // Invuln flicker
  if(P.invuln>0&&Math.floor(Date.now()/60)%2) { ctx.restore(); return; }

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(3,4,PLAYER_R,PLAYER_R*0.4,0,0,Math.PI*2); ctx.fill();

  // Body glow
  glow('#4af',18);
  ctx.fillStyle='#4af';
  ctx.beginPath(); ctx.arc(0,0,PLAYER_R,0,Math.PI*2); ctx.fill();

  // Inner ring
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,PLAYER_R*0.6,0,Math.PI*2); ctx.stroke();

  // Aim line
  noGlow();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(angle)*(PLAYER_R+8),Math.sin(angle)*(PLAYER_R+8)); ctx.stroke();

  // XP ring
  const xpFrac=P.xp/P.xpNext;
  ctx.strokeStyle='#8f4'; ctx.lineWidth=3;
  glow('#8f4',6);
  ctx.beginPath(); ctx.arc(0,0,PLAYER_R+4,-Math.PI/2,-Math.PI/2+xpFrac*Math.PI*2); ctx.stroke();
  noGlow();

  ctx.restore();
}

function drawEnemies(){
  for(const e of enemies){
    ctx.save(); ctx.translate(e.x,e.y);
    const flash=e.flashTimer>0;
    const col=flash?'#fff':e.color;

    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(3,4,e.r,e.r*0.4,0,0,Math.PI*2); ctx.fill();

    glow(e.color,flash?20:10);
    ctx.fillStyle=col;

    if(e.type==='tank'){
      ctx.fillRect(-e.r,-e.r,e.r*2,e.r*2);
      ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2; ctx.strokeRect(-e.r,-e.r,e.r*2,e.r*2);
    } else if(e.type==='bomber'){
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=i/6*Math.PI*2, r=i%2===0?e.r:e.r*0.6;
        i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1.5; ctx.stroke();
    }

    // Enemy HP bar
    const bw=e.r*2.5;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(-bw/2,-e.r-10,bw,5);
    ctx.fillStyle=e.hp/e.maxHp>0.5?'#4f4':e.hp/e.maxHp>0.25?'#ff4':'#f44';
    ctx.fillRect(-bw/2,-e.r-10,bw*(e.hp/e.maxHp),5);
    noGlow(); ctx.restore();
  }
}

function drawBullets(){
  for(const b of bullets){
    ctx.save();
    const col=b.player?'#fff':b.col||'#f44';
    // Trail
    if(b.trail&&b.trail.length>1){
      ctx.globalAlpha=0.4;
      ctx.strokeStyle=col; ctx.lineWidth=b.r;
      ctx.beginPath();
      ctx.moveTo(b.trail[0].x,b.trail[0].y);
      for(const tp of b.trail) ctx.lineTo(tp.x,tp.y);
      ctx.stroke();
      ctx.globalAlpha=1;
    }
    glow(col,b.player?12:8);
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    noGlow(); ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    if(p.ring){
      ctx.strokeStyle=p.col; ctx.lineWidth=2;
      glow(p.col,8);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.stroke();
    } else {
      glow(p.col,4);
      ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    noGlow(); ctx.restore();
  }
}

function drawXP(){
  for(const xp of xpOrbs){
    ctx.save();
    glow('#8f4',10);
    ctx.fillStyle='#8f4';
    ctx.beginPath(); ctx.arc(xp.x,xp.y,xp.r,0,Math.PI*2); ctx.fill();
    noGlow(); ctx.restore();
  }
}

function drawDmgNums(){
  for(const d of damageNums){
    ctx.save();
    ctx.globalAlpha=Math.min(1,d.life);
    ctx.fillStyle=d.col; ctx.font=`bold ${14+Math.floor(d.life*4)}px Arial`;
    ctx.textAlign='center'; ctx.fillText(d.val,d.x,d.y);
    ctx.restore();
  }
  ctx.textAlign='left';
}

function drawCursor(){
  const {x,y}=mouse;
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1.5;
  const r=8;
  ctx.beginPath(); ctx.moveTo(x-r,y); ctx.lineTo(x+r,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x,y+r); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,r*0.4,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawHUD(){
  // HP bar
  const bx=50,by=H-36,bw=200,bh=16;
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx-2,by-2,bw+4,bh+4);
  ctx.fillStyle='#333'; ctx.fillRect(bx,by,bw,bh);
  const hpCol=P.hp/P.maxHp>0.5?'#4f4':P.hp/P.maxHp>0.25?'#ff4':'#f44';
  glow(hpCol,6);
  ctx.fillStyle=hpCol; ctx.fillRect(bx,by,bw*(P.hp/P.maxHp),bh);
  noGlow();
  ctx.fillStyle='#fff'; ctx.font='bold 12px Arial';
  ctx.fillText(`HP  ${Math.ceil(P.hp)} / ${P.maxHp}`,bx+4,by+12);

  // Wave / score
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(W-180,8,170,60);
  ctx.fillStyle='#fff'; ctx.font='bold 14px Arial'; ctx.textAlign='right';
  ctx.fillText(`Wave  ${wave}`,W-14,28);
  ctx.fillStyle='#ff4'; ctx.font='bold 16px Arial';
  ctx.fillText(score.toLocaleString(),W-14,50);
  ctx.textAlign='left';

  // Combo
  if(combo>1&&comboTimer>0){
    const a=Math.min(1,comboTimer/1.5);
    ctx.save(); ctx.globalAlpha=a;
    glow('#ff4',12);
    ctx.fillStyle='#ff4'; ctx.font=`bold ${20+combo}px Arial`; ctx.textAlign='center';
    ctx.fillText(`x${combo} COMBO!`,W/2,70);
    noGlow(); ctx.restore();
  }

  // Enemy count
  const alive=enemies.length;
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(ARENA.x,ARENA.y-30,120,24);
  ctx.fillStyle='#f84'; ctx.font='13px Arial';
  ctx.fillText(`Enemies: ${alive}`,ARENA.x+6,ARENA.y-12);

  // Level / XP
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(50,H-58,200,18);
  ctx.fillStyle='#333'; ctx.fillRect(50,H-58,200,18);
  glow('#8f4',4);
  ctx.fillStyle='#8f4'; ctx.fillRect(50,H-58,200*(P.xp/P.xpNext),18);
  noGlow();
  ctx.fillStyle='#fff'; ctx.font='11px Arial';
  ctx.fillText(`Lv ${P.level}   ${P.xp} / ${P.xpNext} XP`,56,H-44);

  // Between waves countdown
  if(betweenWaves&&state==='play'){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(W/2-120,H/2-30,240,60);
    ctx.fillStyle='#4af'; ctx.font='bold 18px Arial'; ctx.textAlign='center';
    ctx.fillText(`Wave ${wave+1} in ${Math.ceil(betweenTimer)}...`,W/2,H/2+8);
    ctx.restore(); ctx.textAlign='left';
  }

  // Controls hint (early game)
  if(wave<=1&&kills<3){
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font='12px Arial'; ctx.textAlign='center';
    ctx.fillText('WASD move  •  Mouse aim  •  Click shoot  •  Collect green XP orbs',W/2,H-8);
    ctx.textAlign='left';
  }
}

function drawUpgrade(){
  // dim background
  ctx.fillStyle='rgba(0,0,10,0.75)'; ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff'; ctx.font='bold 28px Arial'; ctx.textAlign='center';
  ctx.fillText(`Wave ${wave} Complete!`,W/2,120);
  ctx.fillStyle='#8f4'; ctx.font='18px Arial';
  ctx.fillText('Choose an upgrade',W/2,155);

  const cw=200,ch=240,gap=20;
  const total=upgradeChoices.length*(cw+gap)-gap;
  const sx=(W-total)/2;

  upgradeChoices.forEach((u,i)=>{
    const cx2=sx+i*(cw+gap), cy=190;
    const hover=upgradeSelected===i;
    ctx.save();
    if(hover){ ctx.shadowColor='#4af'; ctx.shadowBlur=20; }
    ctx.fillStyle=hover?'rgba(40,80,140,0.95)':'rgba(20,20,50,0.9)';
    ctx.strokeStyle=hover?'#4af':'rgba(100,100,200,0.5)';
    ctx.lineWidth=hover?2.5:1.5;
    ctx.beginPath(); ctx.roundRect(cx2,cy,cw,ch,12); ctx.fill(); ctx.stroke();
    noGlow();

    ctx.fillStyle='#fff'; ctx.font='32px Arial'; ctx.textAlign='center';
    ctx.fillText(u.icon,cx2+cw/2,cy+55);
    ctx.font='bold 16px Arial'; ctx.fillStyle=hover?'#4af':'#eee';
    ctx.fillText(u.name,cx2+cw/2,cy+90);
    ctx.font='13px Arial'; ctx.fillStyle='rgba(255,255,255,0.7)';
    // Word wrap desc
    const words=u.desc.split(' '), lines=[];let line='';
    for(const w of words){ const test=line+w+' '; ctx.measureText(test).width<cw-20?(line=test):(lines.push(line),line=w+' '); }
    lines.push(line);
    lines.forEach((l,li)=>ctx.fillText(l.trim(),cx2+cw/2,cy+115+li*20));

    ctx.restore();
  });

  ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='13px Arial'; ctx.textAlign='center';
  ctx.fillText('Click an upgrade or press 1 / 2 / 3',W/2,H-30);
  ctx.textAlign='left';
}

function drawMenu(){
  drawBG();
  ctx.save();
  ctx.shadowColor='#4af'; ctx.shadowBlur=40;
  ctx.fillStyle='#4af'; ctx.font='bold 70px Arial'; ctx.textAlign='center';
  ctx.fillText('SURVIVOR',W/2,220);
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font='18px Arial'; ctx.textAlign='center';
  ctx.fillText('Survive endless waves of enemies',W/2,275);
  ctx.fillText('WASD to move  ·  Mouse to aim and shoot',W/2,305);
  ctx.fillText('Collect XP orbs  ·  Pick upgrades between waves',W/2,332);
  if(hiScore>0){ ctx.fillStyle='#ff4'; ctx.font='16px Arial'; ctx.fillText('Best score: '+hiScore.toLocaleString(),W/2,370); }
  const p=0.7+Math.sin(Date.now()*0.004)*0.3;
  ctx.globalAlpha=p; ctx.fillStyle='#ff4'; ctx.font='bold 22px Arial';
  ctx.fillText('▶  Click or Space to Play',W/2,430);
  ctx.globalAlpha=1; ctx.textAlign='left';
}

function drawDead(){
  ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.shadowColor='#f44'; ctx.shadowBlur=30;
  ctx.fillStyle='#f44'; ctx.font='bold 60px Arial'; ctx.textAlign='center';
  ctx.fillText('YOU DIED',W/2,200);
  ctx.restore();
  ctx.fillStyle='#fff'; ctx.font='22px Arial'; ctx.textAlign='center';
  ctx.fillText(`Wave  ${wave}   ·   Score  ${score.toLocaleString()}   ·   Kills  ${kills}`,W/2,265);
  ctx.fillStyle='#ff4'; ctx.font='18px Arial';
  ctx.fillText('Best: '+hiScore.toLocaleString(),W/2,300);
  const p=0.7+Math.sin(Date.now()*0.004)*0.3;
  ctx.globalAlpha=p; ctx.fillStyle='#aaa'; ctx.font='18px Arial';
  ctx.fillText('Click or Space to play again',W/2,370);
  ctx.globalAlpha=1; ctx.textAlign='left';
}

// Upgrade click / keyboard
C.addEventListener('click',e=>{
  if(state!=='upgrade') return;
  const r=C.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const cw=200,ch=240,gap=20;
  const total=3*(cw+gap)-gap;
  const sx=(W-total)/2;
  upgradeChoices.forEach((u,i)=>{
    const cx2=sx+i*(cw+gap),cy=190;
    if(mx>=cx2&&mx<=cx2+cw&&my>=cy&&my<=cy+ch){
      selectUpgrade(i);
    }
  });
});
C.addEventListener('mousemove',e=>{
  if(state!=='upgrade') return;
  const r=C.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const cw=200,ch=240,gap=20;
  const total=3*(cw+gap)-gap;
  const sx=(W-total)/2;
  upgradeSelected=-1;
  upgradeChoices.forEach((u,i)=>{
    const cx2=sx+i*(cw+gap),cy=190;
    if(mx>=cx2&&mx<=cx2+cw&&my>=cy&&my<=cy+ch) upgradeSelected=i;
  });
});
document.addEventListener('keydown',e=>{
  if(state!=='upgrade') return;
  if(e.code==='Digit1') selectUpgrade(0);
  if(e.code==='Digit2') selectUpgrade(1);
  if(e.code==='Digit3') selectUpgrade(2);
});
function selectUpgrade(i){
  upgradeChoices[i].apply();
  SND.upgrade();
  state='play';
  betweenWaves=true; betweenTimer=2;
}

// ── Main loop ──────────────────────────────────────────────────
function loop(now){
  const dt=Math.min((now-last)/1000,0.05);
  last=now;
  update(dt);

  ctx.save();
  if(screenShake>0){
    ctx.translate((Math.random()-0.5)*screenShake*10,(Math.random()-0.5)*screenShake*8);
    screenShake*=0.85;
  }

  if(state==='menu'){ drawMenu(); }
  else if(state==='dead'){ drawBG(); drawParticles(); drawDead(); }
  else {
    drawBG();
    drawXP();
    drawParticles();
    drawBullets();
    drawEnemies();
    drawPlayer();
    drawDmgNums();
    drawCursor();
    drawHUD();
    if(flashAlpha>0){
      ctx.fillStyle=flashColor||'#f44';
      ctx.globalAlpha=flashAlpha;
      ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=1;
    }
    if(state==='upgrade') drawUpgrade();
  }

  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
