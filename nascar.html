<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NASCAR — Daytona Speedway</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    font-family: 'Impact', 'Arial Black', sans-serif;
    color: #fff; user-select: none;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: absolute; inset: 0; pointer-events: none;
  }
  .panel {
    position: absolute; pointer-events: auto;
    background: rgba(0,0,0,0.85);
    border: 3px solid #ffcc00;
    border-radius: 12px;
    padding: 30px 50px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255,204,0,0.4);
  }
  #menu, #finish {
    left: 50%; top: 50%; transform: translate(-50%,-50%);
    min-width: 480px;
  }
  h1 {
    margin: 0 0 6px 0; font-size: 78px;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #ffd84d 0%, #ff6a00 50%, #c00 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255,140,0,0.7);
  }
  h2 { margin: 0; font-size: 22px; letter-spacing: 6px; color: #ffcc00; }
  button {
    margin-top: 24px;
    padding: 14px 42px;
    font-size: 28px;
    font-family: inherit;
    letter-spacing: 4px;
    background: linear-gradient(180deg, #ffcc00, #ff8800);
    color: #111; border: none; border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 0 #a55600, 0 0 20px rgba(255,170,0,0.5);
    transition: transform 0.1s;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(2px); box-shadow: 0 0 0 #a55600; }
  .hidden { display: none !important; }
  #standings {
    margin: 18px auto 0; font-size: 20px;
    border-collapse: collapse; min-width: 360px;
  }
  #standings td {
    padding: 6px 14px; border-bottom: 1px solid #333; text-align: left;
  }
  #standings .pos { color: #ffcc00; font-size: 24px; width: 50px; }
  #standings .you { background: rgba(255,204,0,0.15); color: #ffd84d; }
  .controls {
    margin-top: 10px; font-size: 16px; color: #aaa; letter-spacing: 2px;
  }
  /* HUD */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .hud-box {
    position: absolute; background: rgba(0,0,0,0.6);
    border: 2px solid rgba(255,204,0,0.7);
    border-radius: 8px; padding: 8px 14px;
    font-size: 22px; letter-spacing: 2px;
  }
  #lap { top: 18px; left: 50%; transform: translateX(-50%); font-size: 28px; text-align: center; }
  #lap .small { font-size: 16px; color: #ffcc00; display: block; letter-spacing: 4px; }
  #gap { top: 18px; left: 18px; font-size: 18px; color: #fff; }
  #gap .lead { color: gold; font-weight: bold; font-size: 22px; }
  #gap .draft { color: #4fd0ff; }
  #speedo { bottom: 18px; left: 18px; font-size: 18px; min-width: 180px; }
  #speedo .mph { font-size: 48px; color: #ffcc00; font-weight: bold; }
  #speedo .unit { font-size: 16px; color: #ccc; margin-left: 6px; }
  #speedo .bar {
    margin-top: 6px; height: 8px; width: 100%;
    background: #222; border-radius: 4px; overflow: hidden;
  }
  #speedo .bar .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #2ecc40 0%, #ffcc00 60%, #ff3333 100%);
    transition: width 0.1s;
  }
  #minimap {
    bottom: 18px; right: 18px;
    padding: 8px;
    background: rgba(0,0,0,0.65);
    border: 2px solid rgba(255,204,0,0.7);
    border-radius: 8px;
  }
  #countdown {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    font-size: 220px; color: #ffcc00;
    text-shadow: 0 0 40px #ff6a00, 0 0 80px #ff3300;
    pointer-events: none;
  }
  #message {
    position: absolute; left: 50%; top: 25%;
    transform: translate(-50%,-50%);
    font-size: 60px; color: #ffcc00;
    text-shadow: 0 0 20px #000;
    pointer-events: none;
    letter-spacing: 6px;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <!-- Menu -->
  <div id="menu" class="panel">
    <h1>NASCAR</h1>
    <h2>DAYTONA SPEEDWAY</h2>
    <div style="margin-top:14px; font-size:18px; color:#ddd;">10 LAPS &nbsp; • &nbsp; 8 CARS &nbsp; • &nbsp; FULL THROTTLE</div>
    <button id="raceBtn">START RACE</button>
    <div class="controls">
      W / ↑ ACCELERATE &nbsp; • &nbsp; S / ↓ BRAKE<br>
      A / ← INSIDE LINE &nbsp; • &nbsp; D / → OUTSIDE LINE
    </div>
  </div>

  <!-- Finish -->
  <div id="finish" class="panel hidden">
    <h1 id="finishTitle">FINISH!</h1>
    <h2 id="finishSub">FINAL STANDINGS</h2>
    <table id="standings"></table>
    <button id="againBtn">RACE AGAIN</button>
  </div>

  <!-- HUD (race) -->
  <div id="hud" class="hidden">
    <div id="lap" class="hud-box"><span class="small">LAP</span><span id="lapText">1 / 10</span><span class="small" id="posText">P1 / 8</span></div>
    <div id="gap" class="hud-box">
      <div id="gapAhead">— AHEAD</div>
      <div id="gapBehind">— BEHIND</div>
      <div id="draftInd"></div>
    </div>
    <div id="speedo" class="hud-box">
      <div><span class="mph" id="mph">0</span><span class="unit">MPH</span></div>
      <div class="bar"><div class="fill" id="speedFill"></div></div>
    </div>
    <div id="minimap" class="hud-box" style="padding:8px;">
      <canvas id="map" width="180" height="100"></canvas>
    </div>
  </div>

  <div id="countdown" class="hidden"></div>
  <div id="message" class="hidden"></div>
</div>

<script>
// ============================================================
// NASCAR Oval Racing — single-file game
// ============================================================
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mapCanvas = document.getElementById('map');
const mctx = mapCanvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// -----------------------------
// Track parametric definition
// -----------------------------
// Oval centered at origin in world coordinates.
// Two straights of length 2*SW connected by two semicircles of radius RAD.
// Total centerline length = 2 * (2*SW) + 2 * PI * RAD
const SW = 600;    // straight half-length
const RAD = 260;   // turn radius (centerline)
const TRACK_HALF = 65; // half-width of track (so width = 130)
const STRAIGHT_LEN = 2 * SW;
const TURN_LEN = Math.PI * RAD;
const TRACK_LEN = 2 * STRAIGHT_LEN + 2 * TURN_LEN;

// t in [0,1) — convert to arc-length and return {x, y, angle}
// Layout (clockwise top-down racing direction is to the right on the top straight):
//   Top straight: x from -SW to +SW at y = -RAD          (t: 0       .. s1)
//   Right turn:   centered at (SW, 0), angle from -PI/2 to PI/2 (going down on right)
//   Bottom straight: x from +SW to -SW at y = +RAD       (going left)
//   Left turn: centered at (-SW, 0), angle PI/2 to 3PI/2  (going up on left)
function getTrackPoint(t) {
  t = ((t % 1) + 1) % 1;
  const s = t * TRACK_LEN;
  const s1 = STRAIGHT_LEN;
  const s2 = s1 + TURN_LEN;
  const s3 = s2 + STRAIGHT_LEN;
  if (s < s1) {
    // top straight, moving +x
    return { x: -SW + s, y: -RAD, angle: 0 };
  } else if (s < s2) {
    // right turn (clockwise from top to bottom on right side)
    const a = (s - s1) / RAD; // 0 .. PI
    // start at angle -PI/2 (top of circle), rotate clockwise -> angle = -PI/2 + a
    const ang = -Math.PI / 2 + a;
    const cx = SW, cy = 0;
    return {
      x: cx + Math.cos(ang) * RAD,
      y: cy + Math.sin(ang) * RAD,
      // tangent direction of motion = ang + PI/2
      angle: ang + Math.PI / 2
    };
  } else if (s < s3) {
    // bottom straight, moving -x
    const d = s - s2;
    return { x: SW - d, y: RAD, angle: Math.PI };
  } else {
    // left turn
    const a = (s - s3) / RAD;
    const ang = Math.PI / 2 + a; // from PI/2 (bottom-left) to 3PI/2 (top-left)
    const cx = -SW, cy = 0;
    return {
      x: cx + Math.cos(ang) * RAD,
      y: cy + Math.sin(ang) * RAD,
      angle: ang + Math.PI / 2
    };
  }
}

// World position of a car with given t and lane offset (perpendicular to track direction)
// lane = -1 inside, +1 outside (in units of TRACK_HALF)
function getCarWorld(t, lane) {
  const p = getTrackPoint(t);
  // perpendicular direction: rotate angle by -PI/2 to get outward normal
  // travel direction angle, normal pointing outward (away from infield center):
  // For top straight (angle=0), outward should be -y (up on screen is away from center? center is at 0,0, top straight is at y=-RAD so outward = -y direction)
  // Outward normal = (sin(angle), -cos(angle))? Let's verify: at angle=0 (top straight),
  //   sin(0)=0, -cos(0)=-1 -> normal = (0,-1). Yes, that points further up (outside the oval on top). Good.
  const nx = Math.sin(p.angle);
  const ny = -Math.cos(p.angle);
  // But on a curve, "outside" means away from the turn center. For right turn, center at (SW,0).
  // At angle = -PI/2 (just entered turn at top of right circle), tangent angle = 0 (moving right), normal = (0,-1). Good — outside is up.
  // At angle = 0 (rightmost point), tangent angle = PI/2 (moving down), normal = (1, 0). Center is at SW (to the left of point). So outside is +x. Correct.
  return {
    x: p.x + nx * lane * TRACK_HALF,
    y: p.y + ny * lane * TRACK_HALF,
    angle: p.angle
  };
}

// -----------------------------
// Audio
// -----------------------------
let actx = null;
function getAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  return actx;
}

let engineOsc = null, engineGain = null;
function startEngine() {
  const a = getAudio(); if (!a) return;
  if (engineOsc) return;
  engineOsc = a.createOscillator();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 150;
  engineGain = a.createGain();
  engineGain.gain.value = 0.06;
  // Low-pass to soften
  const lp = a.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 900;
  engineOsc.connect(lp); lp.connect(engineGain); engineGain.connect(a.destination);
  engineOsc.start();
}
function setEngine(speedFraction) {
  if (!engineOsc) return;
  const f = 130 + speedFraction * 320;
  engineOsc.frequency.setTargetAtTime(f, actx.currentTime, 0.05);
  engineGain.gain.setTargetAtTime(0.04 + speedFraction * 0.05, actx.currentTime, 0.05);
}
function stopEngine() {
  if (engineOsc) {
    try { engineOsc.stop(); } catch(e){}
    engineOsc = null; engineGain = null;
  }
}
function beep(freq, dur, vol) {
  const a = getAudio(); if (!a) return;
  const o = a.createOscillator(); const g = a.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.value = 0;
  g.gain.setValueAtTime(0, a.currentTime);
  g.gain.linearRampToValueAtTime(vol || 0.15, a.currentTime + 0.01);
  g.gain.linearRampToValueAtTime(0, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.05);
}
function noiseBurst(dur, vol) {
  const a = getAudio(); if (!a) return;
  const bufferSize = a.sampleRate * dur;
  const buffer = a.createBuffer(1, bufferSize, a.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  const src = a.createBufferSource(); src.buffer = buffer;
  const g = a.createGain(); g.gain.value = vol || 0.3;
  const filt = a.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 1200;
  src.connect(filt); filt.connect(g); g.connect(a.destination);
  src.start();
}
function fanfare() {
  const notes = [523, 659, 784, 1047];
  notes.forEach((n, i) => setTimeout(() => beep(n, 0.25, 0.18), i * 180));
}
function crowdCheer() {
  // Short crowd-like noise
  const a = getAudio(); if (!a) return;
  noiseBurst(0.6, 0.18);
}

// -----------------------------
// Game state
// -----------------------------
const COLORS = [
  '#ffcc00', // 0 — player (gold)
  '#ff3333', // 1
  '#3399ff', // 2
  '#33cc33', // 3
  '#ff6600', // 4
  '#cc33ff', // 5
  '#ffffff', // 6
  '#00e5e5', // 7
];
const NUMBERS = ['7','24','18','11','22','9','48','2'];

const STATE_MENU = 0, STATE_COUNTDOWN = 1, STATE_RACING = 2, STATE_FINISH = 3;
let state = STATE_MENU;

const NUM_CARS = 8;
const TOTAL_LAPS = 10;
const PLAYER_INDEX = 0;

let cars = [];
let particles = [];
let raceTime = 0;
let countdownTimer = 0;
let countdownStep = 0;
let shake = 0;
let menuCars = [];
let lastDraftingState = false;
let slingshotTimer = 0;
let finishMessageTimer = 0;

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function makeCar(i) {
  return {
    i,
    color: COLORS[i],
    number: NUMBERS[i],
    t: 0,
    lane: 0,
    speed: 0,
    targetLane: 0,
    maxSpeed: (i === PLAYER_INDEX) ? 0.0055 : 0.0044 + Math.random() * 0.0009, // ai 0.0044..0.0053
    aiPreferredLane: (Math.random() - 0.5) * 0.6,
    lap: 0,
    lastT: 0,
    finished: false,
    finishTime: 0,
    angleVisual: 0,
    aiThinkTimer: 0,
  };
}

function setupRace() {
  cars = [];
  for (let i = 0; i < NUM_CARS; i++) cars.push(makeCar(i));
  // Starting grid: 4 rows of 2, on bottom straight before start/finish at t=0 (top straight start).
  // Start/finish line is at t = 0 (left edge of top straight). Place cars at the very back of the lap
  // (near top-straight start, behind start line — i.e. t slightly less than 0 / equivalently near 1.0).
  // We line them up along the top straight just behind the start line.
  const gridSpacing = 90 / TRACK_LEN; // ~90 world units between rows
  for (let i = 0; i < NUM_CARS; i++) {
    const row = Math.floor(i / 2);
    const col = i % 2;
    // Place cars on the back straight (bottom) so they have a full lap distance to start
    // Actually for an oval, let's line them up on the bottom straight approaching the start/finish line.
    // Start/finish at t=0 (top-left of top straight). They drive top straight to right, around, then bottom straight to left, then left turn, then back up.
    // Place starting grid on top straight, ahead of start line by 0.02..0.1 (post-start line) so they immediately race.
    // Simpler: place them on top straight just past start line, row by row.
    const baseT = 0.005 + row * gridSpacing;
    const lane = col === 0 ? -0.35 : 0.35;
    cars[i].t = baseT;
    cars[i].lane = lane;
    cars[i].targetLane = lane;
    cars[i].speed = 0;
    cars[i].lap = 0;
    cars[i].lastT = baseT;
    cars[i].finished = false;
    cars[i].finishTime = 0;
  }
  particles = [];
  raceTime = 0;
  slingshotTimer = 0;
  finishMessageTimer = 0;
}

// -----------------------------
// Particles
// -----------------------------
function spawnDebris(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 0.5 + Math.random() * 0.6,
      maxLife: 1.1,
      size: 2 + Math.random() * 3,
      color: color || (Math.random() < 0.5 ? '#888' : '#444'),
    });
  }
}
function spawnSmoke(x, y) {
  particles.push({
    x: x + (Math.random()-0.5)*8,
    y: y + (Math.random()-0.5)*8,
    vx: (Math.random()-0.5)*0.5,
    vy: -0.5 - Math.random()*0.5,
    life: 0.8,
    maxLife: 0.8,
    size: 6 + Math.random()*4,
    color: 'rgba(180,180,180,0.5)',
    smoke: true,
  });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    if (!p.smoke) { p.vy += 0.1; p.vx *= 0.97; }
    else { p.size *= 1.02; }
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// -----------------------------
// AI
// -----------------------------
function updateAI(car, dt) {
  // Determine current segment for curve awareness
  const tt = ((car.t % 1) + 1) % 1;
  const sNorm = tt; // already 0..1
  // 0..s1/TL = top straight; in_turn = on a turn
  const s = tt * TRACK_LEN;
  const inTurn = (s >= STRAIGHT_LEN && s < STRAIGHT_LEN + TURN_LEN) ||
                 (s >= 2 * STRAIGHT_LEN + TURN_LEN);

  // Find car ahead in same lane
  let nearestAhead = null, nearestGap = 1;
  for (const o of cars) {
    if (o === car) continue;
    let gap = o.t - car.t;
    if (gap < 0) gap += 1;
    if (gap < nearestGap && gap > 0.0001 && Math.abs(o.lane - car.lane) < 0.45) {
      nearestGap = gap; nearestAhead = o;
    }
  }
  // Drafting boost
  let boost = 1.0;
  if (nearestAhead && nearestGap < 0.006 && Math.abs(nearestAhead.lane - car.lane) < 0.5) {
    boost = 1.08;
  }
  // Avoid collision: if too close in same lane, lane change
  if (nearestAhead && nearestGap < 0.0035 && Math.abs(nearestAhead.lane - car.lane) < 0.35) {
    // try to shift away
    car.targetLane = car.aiPreferredLane + (nearestAhead.lane < car.aiPreferredLane ? 0.4 : -0.4);
    car.targetLane = Math.max(-0.8, Math.min(0.8, car.targetLane));
  } else {
    // gradually return to preferred lane
    car.aiThinkTimer -= dt;
    if (car.aiThinkTimer <= 0) {
      car.aiThinkTimer = 1 + Math.random() * 2;
      car.targetLane = car.aiPreferredLane + (Math.random() - 0.5) * 0.2;
    }
  }
  // Lane smoothing
  car.lane += (car.targetLane - car.lane) * Math.min(1, dt * 3);

  // Speed: accelerate toward target
  let targetSpeed = car.maxSpeed * boost;
  if (inTurn) targetSpeed *= 0.95; // small turn penalty
  if (nearestAhead && nearestGap < 0.003 && Math.abs(nearestAhead.lane - car.lane) < 0.3) {
    targetSpeed *= 0.85; // slow down behind
  }
  const accel = 0.0008;
  if (car.speed < targetSpeed) car.speed = Math.min(targetSpeed, car.speed + accel * dt);
  else car.speed = Math.max(targetSpeed, car.speed - accel * 0.5 * dt);
}

// -----------------------------
// Player update
// -----------------------------
function updatePlayer(car, dt) {
  const accelKey = keys['w'] || keys['arrowup'];
  const brakeKey = keys['s'] || keys['arrowdown'];
  const leftKey = keys['a'] || keys['arrowleft'];
  const rightKey = keys['d'] || keys['arrowright'];

  // Drafting check
  let drafting = false;
  let aheadCar = null, aheadGap = 1;
  for (const o of cars) {
    if (o === car) continue;
    let gap = o.t - car.t; if (gap < 0) gap += 1;
    if (gap < aheadGap && gap > 0.0001) {
      aheadGap = gap; aheadCar = o;
    }
  }
  if (aheadCar && aheadGap < 0.006 && Math.abs(aheadCar.lane - car.lane) < 0.5) {
    drafting = true;
  }
  // Slingshot trigger: was drafting last frame, now pulled out (lane diff > 0.5 or no longer behind same-lane)
  if (lastDraftingState && !drafting) {
    slingshotTimer = 1.0;
  }
  lastDraftingState = drafting;

  // HUD draft indicator
  const di = document.getElementById('draftInd');
  if (drafting) di.innerHTML = '<span class="draft">DRAFTING ⟫</span>';
  else if (slingshotTimer > 0) di.innerHTML = '<span class="draft">SLINGSHOT!</span>';
  else di.innerHTML = '';

  let boost = 1.0;
  if (drafting) boost = 1.08;
  if (slingshotTimer > 0) {
    boost = Math.max(boost, 1.12);
    slingshotTimer -= dt;
  }

  // Acceleration
  const accel = 0.0014;
  const targetMax = car.maxSpeed * boost;
  // Turn penalty if no gas
  const s = ((car.t % 1) + 1) % 1 * TRACK_LEN;
  const inTurn = (s >= STRAIGHT_LEN && s < STRAIGHT_LEN + TURN_LEN) ||
                 (s >= 2 * STRAIGHT_LEN + TURN_LEN);

  if (accelKey) {
    car.speed += accel * dt;
    if (car.speed > targetMax) car.speed = targetMax;
  } else if (brakeKey) {
    car.speed -= 0.0035 * dt;
    if (car.speed < 0) car.speed = 0;
  } else {
    car.speed -= 0.0005 * dt; // engine braking
    if (inTurn) car.speed -= 0.0003 * dt;
    if (car.speed < 0) car.speed = 0;
  }

  // Lane shift
  const laneSpeed = 1.6;
  if (leftKey) car.targetLane -= laneSpeed * dt;
  if (rightKey) car.targetLane += laneSpeed * dt;
  car.targetLane = Math.max(-0.85, Math.min(0.85, car.targetLane));
  car.lane += (car.targetLane - car.lane) * Math.min(1, dt * 6);
}

// -----------------------------
// Collisions
// -----------------------------
function handleCollisions() {
  for (let i = 0; i < cars.length; i++) {
    for (let j = i+1; j < cars.length; j++) {
      const a = cars[i], b = cars[j];
      let dt_ = a.t - b.t;
      // normalize to nearest
      if (dt_ > 0.5) dt_ -= 1;
      if (dt_ < -0.5) dt_ += 1;
      const dist = Math.abs(dt_);
      const dlane = Math.abs(a.lane - b.lane);
      // Car length in track-t units: roughly 50 world units / TRACK_LEN
      const carLenT = 55 / TRACK_LEN;
      if (dist < carLenT && dlane < 0.3) {
        // Collision
        const wA = getCarWorld(a.t, a.lane);
        const wB = getCarWorld(b.t, b.lane);
        // Push laterally
        const push = 0.08;
        if (a.lane < b.lane) { a.lane -= push; b.lane += push; }
        else { a.lane += push; b.lane -= push; }
        a.targetLane = a.lane; b.targetLane = b.lane;
        a.speed *= 0.85; b.speed *= 0.85;
        // Push in t to separate
        if (dt_ > 0) { a.t += carLenT * 0.5; b.t -= carLenT * 0.5; }
        else { a.t -= carLenT * 0.5; b.t += carLenT * 0.5; }
        // Debris
        const cx = (wA.x + wB.x) / 2, cy = (wA.y + wB.y) / 2;
        spawnDebris(cx, cy, 12);
        for (let s = 0; s < 4; s++) spawnSmoke(cx, cy);
        if (i === PLAYER_INDEX || j === PLAYER_INDEX) {
          shake = 12;
          noiseBurst(0.15, 0.25);
        } else {
          noiseBurst(0.08, 0.12);
        }
      }
    }
  }
}

// -----------------------------
// Lap & position tracking
// -----------------------------
function updateLaps(dt) {
  for (const car of cars) {
    if (car.finished) continue;
    const prev = car.lastT;
    car.t += car.speed * dt * 60; // dt in seconds, speed defined per frame at 60fps
    if (car.t >= 1) {
      car.t -= 1;
      car.lap += 1;
      if (car.i === PLAYER_INDEX) {
        crowdCheer();
      }
      if (car.lap >= TOTAL_LAPS) {
        car.finished = true;
        car.finishTime = raceTime;
        if (car.i === PLAYER_INDEX) {
          finishMessageTimer = 2.0;
        }
      }
    }
    car.lastT = car.t;
  }
}

function getStandings() {
  // sort by lap desc, then t desc (further along this lap = ahead), but finished cars by finishTime asc
  return [...cars].sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished) return -1;
    if (b.finished) return 1;
    if (b.lap !== a.lap) return b.lap - a.lap;
    return b.t - a.t;
  });
}

// -----------------------------
// Rendering
// -----------------------------
function drawTrack() {
  // Build inner & outer paths from getTrackPoint
  // We'll trace the outer boundary (lane = +1) and then inner (lane = -1) with reverse direction to fill.
  const SEG = 200;
  ctx.beginPath();
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = getCarWorldNoOffset(t, 1);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  // inner (reverse)
  for (let i = SEG; i >= 0; i--) {
    const t = i / SEG;
    const p = getCarWorldNoOffset(t, -1);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  // Asphalt
  ctx.fillStyle = '#2a2a2e';
  ctx.fill();

  // Add banking shading (slight gradient inside vs outside on turns) — approximate with a stroke
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  // Outer boundary highlight
  ctx.beginPath();
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = getCarWorldNoOffset(t, 1);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.stroke();

  // White edge lines
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#fff';
  ctx.beginPath();
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = getCarWorldNoOffset(t, 0.98);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = getCarWorldNoOffset(t, -0.98);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.stroke();

  // Yellow center line (dashed)
  ctx.setLineDash([16, 14]);
  ctx.strokeStyle = '#f5d000';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = getCarWorldNoOffset(t, 0);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);

  // White lane markings between lanes (dashed)
  ctx.setLineDash([10, 18]);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  for (const laneOffset of [-0.5, 0.5]) {
    ctx.beginPath();
    for (let i = 0; i <= SEG; i++) {
      const t = i / SEG;
      const p = getCarWorldNoOffset(t, laneOffset);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Start/Finish line — black & white checker at t=0
  const startP = getTrackPoint(0);
  ctx.save();
  ctx.translate(startP.x, startP.y);
  ctx.rotate(startP.angle);
  const tw = TRACK_HALF * 2;
  ctx.fillStyle = '#fff';
  ctx.fillRect(-6, -tw/2, 12, tw);
  // checker squares
  const sqs = 8;
  for (let i = 0; i < sqs; i++) {
    if ((i % 2) === 0) {
      ctx.fillStyle = '#000';
      ctx.fillRect(-6, -tw/2 + i * (tw / sqs), 12, tw / sqs);
    }
  }
  ctx.restore();

  // Pit wall / inner boundary detail
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#555';
  ctx.beginPath();
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = getCarWorldNoOffset(t, -1.02);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.stroke();
}

// Helper: get world point on track centerline plus lane offset
function getCarWorldNoOffset(t, laneOffset) {
  const p = getTrackPoint(t);
  const nx = Math.sin(p.angle);
  const ny = -Math.cos(p.angle);
  return {
    x: p.x + nx * laneOffset * TRACK_HALF,
    y: p.y + ny * laneOffset * TRACK_HALF,
    angle: p.angle
  };
}

function drawInfield() {
  // Infield grass (inside the inner track boundary)
  const SEG = 200;
  ctx.beginPath();
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = getCarWorldNoOffset(t, -1.02);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  // gradient
  const grad = ctx.createRadialGradient(0, 0, 50, 0, 0, 600);
  grad.addColorStop(0, '#2f6f2a');
  grad.addColorStop(1, '#1f4f1a');
  ctx.fillStyle = grad;
  ctx.fill();

  // "DAYTONA" text in the infield
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.font = 'bold 90px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('DAYTONA', 0, -20);
  ctx.font = 'bold 36px Impact, Arial Black, sans-serif';
  ctx.fillText('SPEEDWAY', 0, 40);
  ctx.restore();

  // Small infield road/pit decoration
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(-300, 100, 600, 12);
}

function drawBackground() {
  // Outside the track: dirt, grandstands, crowd
  // Big dark dirt rectangle behind everything
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(-2400, -1400, 4800, 2800);

  // Grandstands as colored bands
  // Top grandstand
  for (let row = 0; row < 4; row++) {
    const y = -RAD - TRACK_HALF - 60 - row * 24;
    ctx.fillStyle = row % 2 === 0 ? '#666' : '#777';
    ctx.fillRect(-SW - 100, y, 2 * (SW + 100), 22);
    // crowd dots
    for (let x = -SW - 80; x < SW + 80; x += 8) {
      ctx.fillStyle = `hsl(${(x*7+row*30)%360}, 50%, 50%)`;
      ctx.fillRect(x, y + 4, 5, 5);
    }
  }
  // Bottom grandstand
  for (let row = 0; row < 4; row++) {
    const y = RAD + TRACK_HALF + 60 + row * 24;
    ctx.fillStyle = row % 2 === 0 ? '#666' : '#777';
    ctx.fillRect(-SW - 100, y, 2 * (SW + 100), 22);
    for (let x = -SW - 80; x < SW + 80; x += 8) {
      ctx.fillStyle = `hsl(${(x*11+row*45)%360}, 50%, 50%)`;
      ctx.fillRect(x, y + 4, 5, 5);
    }
  }
  // Side grandstands curved approximate with rectangles (further out)
  for (let row = 0; row < 3; row++) {
    const off = RAD + TRACK_HALF + 80 + row * 22;
    ctx.fillStyle = row % 2 === 0 ? '#666' : '#777';
    ctx.fillRect(SW + 40 + row * 12, -off, 22, 2 * off);
    ctx.fillRect(-SW - 60 - row * 12, -off, 22, 2 * off);
    for (let y = -off; y < off; y += 8) {
      ctx.fillStyle = `hsl(${(y*9+row*60)%360}, 50%, 50%)`;
      ctx.fillRect(SW + 44 + row * 12, y, 5, 5);
      ctx.fillRect(-SW - 56 - row * 12, y, 5, 5);
    }
  }
}

function drawCar(car, isPlayerView) {
  const w = getCarWorld(car.t, car.lane);
  ctx.save();
  ctx.translate(w.x, w.y);
  ctx.rotate(w.angle + Math.PI / 2); // car points along travel direction; +PI/2 so length is along travel

  // Speed lines / motion blur behind
  const speedFrac = car.speed / 0.006;
  if (speedFrac > 0.5) {
    ctx.globalAlpha = Math.min(0.4, (speedFrac - 0.5) * 0.7);
    ctx.fillStyle = car.color;
    ctx.fillRect(-12, 22, 24, 8 + speedFrac * 12);
    ctx.globalAlpha = 1;
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(-13, -23, 28, 50);

  // Body
  ctx.fillStyle = car.color;
  roundedRect(-14, -25, 28, 50, 6);
  ctx.fill();

  // Side stripes
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(-14, -5, 28, 4);

  // Roof (darker)
  ctx.fillStyle = shade(car.color, -0.35);
  roundedRect(-10, -10, 20, 24, 4);
  ctx.fill();

  // Windshield (front)
  ctx.fillStyle = 'rgba(50,80,120,0.6)';
  ctx.fillRect(-9, -18, 18, 6);
  // Rear window
  ctx.fillStyle = 'rgba(50,80,120,0.4)';
  ctx.fillRect(-9, 14, 18, 5);

  // Number on roof
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(car.number, 0, 2);

  // Wheels
  ctx.fillStyle = '#111';
  ctx.fillRect(-15, -22, 4, 9);
  ctx.fillRect(11, -22, 4, 9);
  ctx.fillRect(-15, 13, 4, 9);
  ctx.fillRect(11, 13, 4, 9);

  // Headlights (front)
  ctx.fillStyle = '#fffacd';
  ctx.fillRect(-10, -25, 4, 2);
  ctx.fillRect(6, -25, 4, 2);
  // Tail lights
  ctx.fillStyle = '#ff2222';
  ctx.fillRect(-10, 23, 4, 2);
  ctx.fillRect(6, 23, 4, 2);

  ctx.restore();
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function shade(hex, amt) {
  // hex #RRGGBB, amt -1..1
  if (hex.startsWith('#') && hex.length === 7) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    const f = (v) => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
    const toHex = (v) => v.toString(16).padStart(2, '0');
    return '#' + toHex(f(r)) + toHex(f(g)) + toHex(f(b));
  }
  return hex;
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    if (p.smoke) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}

// -----------------------------
// Camera & main draw
// -----------------------------
function drawScene() {
  // Clear
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  const player = cars[PLAYER_INDEX];
  const pw = getCarWorld(player.t, player.lane);

  // Camera transform: center on player, rotate so player faces up
  const scale = 1.0;
  ctx.save();
  // Apply screen-shake
  let sx = 0, sy = 0;
  if (shake > 0) {
    sx = (Math.random() - 0.5) * shake;
    sy = (Math.random() - 0.5) * shake;
  }
  ctx.translate(W / 2 + sx, H / 2 + sy);
  ctx.scale(scale, scale);
  // Rotate world so player's heading is "up" (-y on screen).
  // Player heading angle (world angle of travel direction). We want that to map to -PI/2 on screen.
  ctx.rotate(-pw.angle - Math.PI / 2);
  ctx.translate(-pw.x, -pw.y);

  drawBackground();
  drawInfield();
  drawTrack();

  // Cars sorted by t so visually overlap is consistent
  const sorted = [...cars].sort((a, b) => a.t - b.t);
  for (const c of sorted) drawCar(c, c === player);

  drawParticles();

  ctx.restore();

  if (shake > 0) shake = Math.max(0, shake - 0.6);
}

// -----------------------------
// Mini-map
// -----------------------------
function drawMinimap() {
  const w = mapCanvas.width, h = mapCanvas.height;
  mctx.clearRect(0, 0, w, h);
  // Track outline (scaled)
  const sx = w / (2 * SW + 2 * RAD + 60);
  const sy = h / (2 * RAD + 60);
  const s = Math.min(sx, sy);
  const ox = w / 2, oy = h / 2;
  mctx.strokeStyle = '#888';
  mctx.lineWidth = 8;
  mctx.beginPath();
  const SEG = 80;
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = getTrackPoint(t);
    const x = ox + p.x * s, y = oy + p.y * s;
    if (i === 0) mctx.moveTo(x, y); else mctx.lineTo(x, y);
  }
  mctx.closePath();
  mctx.stroke();
  mctx.strokeStyle = '#ccc';
  mctx.lineWidth = 1;
  mctx.stroke();

  for (const c of cars) {
    const p = getTrackPoint(c.t);
    const x = ox + p.x * s, y = oy + p.y * s;
    mctx.fillStyle = c.color;
    mctx.beginPath();
    mctx.arc(x, y, c.i === PLAYER_INDEX ? 4 : 3, 0, Math.PI * 2);
    mctx.fill();
    if (c.i === PLAYER_INDEX) {
      mctx.strokeStyle = '#fff';
      mctx.lineWidth = 1.5;
      mctx.stroke();
    }
  }
}

// -----------------------------
// HUD updates
// -----------------------------
function updateHUD() {
  const player = cars[PLAYER_INDEX];
  document.getElementById('lapText').textContent = `${Math.min(player.lap + 1, TOTAL_LAPS)} / ${TOTAL_LAPS}`;
  const standings = getStandings();
  const pos = standings.indexOf(player) + 1;
  document.getElementById('posText').textContent = `P${pos} / ${NUM_CARS}`;

  // Gap to ahead / behind based on standings
  const myIdx = pos - 1;
  const ahead = myIdx > 0 ? standings[myIdx - 1] : null;
  const behind = myIdx < standings.length - 1 ? standings[myIdx + 1] : null;

  function gapStr(other, isAhead) {
    if (!other) return '';
    // approximate seconds: t-difference / average speed
    let dt = other.t - player.t;
    if (isAhead) {
      if (other.lap > player.lap) dt += (other.lap - player.lap);
      else if (dt < 0) dt += 1;
    } else {
      if (other.lap < player.lap) dt -= (player.lap - other.lap);
      else if (dt > 0) dt -= 1;
      dt = -dt;
    }
    const avgSpeed = (player.speed + other.speed) / 2 || 0.003;
    const secs = (dt / avgSpeed) / 60; // per-frame speed -> seconds
    return secs.toFixed(2) + 's';
  }

  const gapAhead = document.getElementById('gapAhead');
  const gapBehind = document.getElementById('gapBehind');
  if (pos === 1) {
    gapAhead.innerHTML = '<span class="lead">★ LEADER</span>';
  } else {
    gapAhead.textContent = '▲ ' + gapStr(ahead, true) + ' AHEAD';
  }
  if (behind) {
    gapBehind.textContent = '▼ ' + gapStr(behind, false) + ' BEHIND';
  } else {
    gapBehind.textContent = '';
  }

  // Speed
  const mph = Math.round((player.speed / 0.0055) * 200);
  document.getElementById('mph').textContent = mph;
  document.getElementById('speedFill').style.width = Math.min(100, (player.speed / 0.0055) * 100) + '%';
}

// -----------------------------
// Game loop
// -----------------------------
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (state === STATE_MENU) {
    drawMenuBg();
  } else if (state === STATE_COUNTDOWN) {
    countdownTimer -= dt;
    drawScene();
    drawMinimap();
    if (countdownTimer <= 0) {
      countdownStep++;
      if (countdownStep === 1) { showCountdown('3'); beep(440, 0.2); countdownTimer = 1.0; }
      else if (countdownStep === 2) { showCountdown('2'); beep(440, 0.2); countdownTimer = 1.0; }
      else if (countdownStep === 3) { showCountdown('1'); beep(440, 0.2); countdownTimer = 1.0; }
      else if (countdownStep === 4) {
        showCountdown('GO!');
        beep(880, 0.4);
        countdownTimer = 0.8;
      } else {
        hideCountdown();
        state = STATE_RACING;
        startEngine();
      }
    }
  } else if (state === STATE_RACING) {
    raceTime += dt;
    // Update
    for (const car of cars) {
      if (car.i === PLAYER_INDEX) updatePlayer(car, dt * 60);
      else updateAI(car, dt * 60);
    }
    handleCollisions();
    updateLaps(dt);
    updateParticles(dt);

    // Engine sound
    setEngine(cars[PLAYER_INDEX].speed / 0.0055);

    drawScene();
    drawMinimap();
    updateHUD();

    // Check race end
    if (cars[PLAYER_INDEX].finished) {
      finishMessageTimer -= dt;
      if (finishMessageTimer <= 0) {
        // wait a beat then show finish screen
        finishRace();
      }
    }
  } else if (state === STATE_FINISH) {
    // keep scene drawn behind panel
    if (cars.length > 0) drawScene();
  }

  requestAnimationFrame(loop);
}

function showCountdown(text) {
  const el = document.getElementById('countdown');
  el.textContent = text;
  el.classList.remove('hidden');
}
function hideCountdown() {
  document.getElementById('countdown').classList.add('hidden');
}

function startRace() {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('finish').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  setupRace();
  state = STATE_COUNTDOWN;
  countdownStep = 0;
  countdownTimer = 0.4;
  hideCountdown();
  getAudio();
}

function finishRace() {
  state = STATE_FINISH;
  stopEngine();
  fanfare();
  // finalize finishTimes for unfinished cars based on standings
  const standings = getStandings();
  const finishDiv = document.getElementById('finish');
  const table = document.getElementById('standings');
  table.innerHTML = '';
  const playerStand = standings.indexOf(cars[PLAYER_INDEX]) + 1;
  document.getElementById('finishTitle').textContent =
    playerStand === 1 ? 'VICTORY!' : (playerStand <= 3 ? 'PODIUM!' : 'RACE OVER');
  document.getElementById('finishSub').textContent = `YOU FINISHED P${playerStand} OF ${NUM_CARS}`;
  standings.forEach((car, idx) => {
    const tr = document.createElement('tr');
    if (car.i === PLAYER_INDEX) tr.classList.add('you');
    tr.innerHTML = `
      <td class="pos">P${idx + 1}</td>
      <td style="color:${car.color}">#${car.number}</td>
      <td>${car.i === PLAYER_INDEX ? 'YOU' : 'AI'}</td>
      <td>${car.finished ? car.finishTime.toFixed(2) + 's' : 'LAP ' + (car.lap + 1)}</td>
    `;
    table.appendChild(tr);
  });
  finishDiv.classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
}

// Buttons
document.getElementById('raceBtn').addEventListener('click', startRace);
document.getElementById('againBtn').addEventListener('click', () => {
  document.getElementById('finish').classList.add('hidden');
  startRace();
});

// Init menu
initMenuCars();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
